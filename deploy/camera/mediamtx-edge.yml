# MediaMTX in the camera live edge's pod (printer camera live view, phase 3). The edge process
# (`backend/scadbuddy/camera/edge.py`) adds one path per recorded printer through the control
# API, which listens on localhost only. Each path reads the relay's path of that printer over
# RTSP with the relay read user, on demand (`sourceOnDemand`), and serves it to the API as
# WebRTC (WHEP, :8889, ICE over UDP :8189) and LL-HLS (:8888). Keys:
# https://github.com/bluenviron/mediamtx/blob/v1.21.4/mediamtx.yml
#
# The browser never reaches this pod: the API proxies `/api/v1/camera/live/{printer_id}/...`
# to it. A NetworkPolicy in eh-homelab/clusters admits only the API to :8888 and :8889, so
# the read user below has no password. The address browsers reach for ICE comes from the
# environment: the pod sets MTX_WEBRTCADDITIONALHOSTS (MediaMTX overrides a key from
# `MTX_<KEY>`, https://mediamtx.org/docs/features/configuration).
#
# The edge serves no RTSP, RTMP, SRT or MoQ listener.

logLevel: info

# The timeout of read operations, at MediaMTX's default: the v1.21.4 release's mediamtx.yml
# (https://github.com/bluenviron/mediamtx/blob/v1.21.4/mediamtx.yml). Pinned here, so an
# upstream change of the default cannot change it, as in mediamtx-relay.yml.
readTimeout: 10s

api: yes
apiAddress: 127.0.0.1:9997
metrics: yes
metricsAddress: 127.0.0.1:9998

rtsp: no
rtmp: no
srt: no
moq: no

webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ""
webrtcIPsFromInterfaces: yes
webrtcAdditionalHosts: []

hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
hlsAlwaysRemux: no
# Close a muxer 10 s after its last request (default 60s). The HLS session still reads the
# path for about 30 s after its muxer closes, and has no key of its own in v1.21.4; then the
# path's on-demand pull closes 10 s later. Measured 2026-11-25 with the edge e2e
# (backend/tests/camera/test_e2e_mediamtx.py, v1.21.4): the relay lost the edge's pull 69 s
# after the last playlist request at 60s, 48.5 s at 10s.
hlsMuxerCloseAfter: 10s

authMethod: internal
authInternalUsers:
  # The API, through the NetworkPolicy only: WHEP and HLS reads.
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
        path:
  # The edge process, from localhost only: the control API and the metrics.
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: api
      - action: metrics

# The edge adds every path through the API, with the relay read password in its source.
paths: {}
