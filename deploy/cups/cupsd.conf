# The label print server's CUPS scheduler (deploy/cups/README.md).
#
# The queue is declared by start.sh from the Deployment's env (or mounted with the
# config), never through CUPS itself: every administration and operator operation is denied, so a client on the
# network can print and cancel jobs but cannot add, change or delete a printer.
# TLS ends at the shared Envoy Gateway; cupsd serves plain HTTP inside the cluster.

LogLevel warn
ErrorLog stderr
AccessLog stderr
PageLog stderr
MaxLogSize 0

Listen 0.0.0.0:8631
Listen /run/cups/cups.sock
# Envoy forwards the client's Host (cups.internal.nullreference.io); cupsd refuses a
# Host it does not know unless this is set.
ServerAlias *

Browsing No
DefaultEncryption Never
WebInterface Yes
ErrorPolicy retry-job
# A job whose send to the printer failed (deploy/cups/zebra exits RETRY) is tried again
# every 30 s for up to a week. A job waiting for its labels stays in the backend instead.
JobRetryInterval 30
JobRetryLimit 20160
PreserveJobHistory 1d
PreserveJobFiles No

<Location />
  Order allow,deny
  Allow all
</Location>

<Location /admin>
  Order allow,deny
</Location>

<Policy default>
  JobPrivateAccess all
  JobPrivateValues none
  SubscriptionPrivateAccess all
  SubscriptionPrivateValues none

  <Limit Create-Job Print-Job Print-URI Validate-Job Send-Document Send-URI Close-Job Cancel-Job Cancel-My-Jobs Get-Notifications Create-Job-Subscription Renew-Subscription Cancel-Subscription>
    Order deny,allow
  </Limit>

  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job CUPS-Move-Job CUPS-Get-Document CUPS-Authenticate-Job>
    Order allow,deny
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
