# Relationships. `expect: refused` marks one the design must refuse; `check.py` fails if
# it is allowed.
relations:
  - {type: accepts, from: "kind:filament", to: "kind:spool_part", max: 1}
  - {type: accepts, from: "kind:printer_h2c", to: "kind:nozzle", max: 2}
  - {type: accepts, from: "kind:printer_h2c", to: "kind:build_plate", max: 1}
  - {type: accepts, from: "item:label_printer_62", to: "kind:label_roll", max: 1, where: {width_mm: 62}}
  - {type: compatible_with, from: "item:nozzle_hs_04", to: "kind:printer_h2c"}
  - {type: contains, from: "unit:h2c_1", to: "unit:nozzle_3"}
  - {type: contains, from: "unit:h2c_1", to: "unit:plate_1"}
  - {type: contains, from: "unit:spool_112", to: "unit:insert_7"}
  - {type: contains, from: "unit:label_printer_1", to: "unit:roll_4"}
  - {type: contains, from: "unit:label_printer_1", to: "unit:roll_5", expect: refused,
     why: "the label printer holds one roll (max 1), and roll_4 is in it"}
  - {type: contains, from: "unit:label_printer_1", to: "unit:roll_9", expect: refused,
     why: "roll_9 is 29 mm; the label printer accepts only width_mm 62"}
  - {type: contains, from: "unit:drill_1", to: "unit:nozzle_4", expect: refused,
     why: "the drill accepts nothing"}
  - {type: contains, from: "unit:h2c_1", to: "unit:insert_7", expect: refused,
     why: "insert_7 is already in spool_112"}
  - {type: covers, from: "unit:plan_1", to: "unit:label_printer_1"}
  - {type: covers, from: "unit:warranty_1", to: "unit:h2c_1"}
  - {type: covers, from: "unit:drill_1", to: "unit:h2c_1", expect: refused,
     why: "only a service with a term covers"}

# What happens over time (design §4.5, §4.7, README §5.7, §6). `check.py` replays it in
# order:
#   add, remove  - change a `contains` relationship;
#   run          - print runs that end on a printer (`hours` of running, `prints` of them).
#                  They book on the printer (own_run_hours) and, through it, on every unit
#                  it contains at that moment (container_run_hours; prints for uses);
#   set_params   - a person changes a handler parameter on a unit;
#   reading      - a person enters a measured value by hand (the unit page's Advanced
#                  section), as a weighing sets a spool's grams. Later uses count on top;
#   refresh      - recompute the cached values of one unit or all, now.
# Each event recomputes the cached handler values it touches; a history row is written
# only when a value changes. Then `expect_life`, `expect_history` and
# `expect_config_history` must hold.
history:
  - {at: 2026-12-01, do: add, rel: {type: contains, from: "unit:h2c_1", to: "unit:nozzle_4"}}
  - {at: 2026-12-02, do: run, printer: "unit:h2c_1", hours: 600, prints: 400}
  - {at: 2027-01-10, do: remove, rel: {type: contains, from: "unit:h2c_1", to: "unit:nozzle_4"}}
  - {at: 2027-01-10, do: remove, rel: {type: contains, from: "unit:h2c_1", to: "unit:plate_1"}}
  - {at: 2027-01-11, do: add, rel: {type: contains, from: "unit:h2c_2", to: "unit:nozzle_4"}}
  - {at: 2027-01-11, do: add, rel: {type: contains, from: "unit:h2c_2", to: "unit:plate_1"}}
  - {at: 2027-01-12, do: run, printer: "unit:h2c_2", hours: 750, prints: 500}
  - {at: 2027-01-13, do: run, printer: "unit:h2c_1", hours: 100, prints: 80}
  - {at: 2027-01-13, do: reading, target: "unit:nozzle_4", step: life, value: 1400}
  - {at: 2027-01-14, do: set_params, target: "unit:nozzle_3", step: life, params: {hours: 2000}}
  - {at: 2027-01-15, do: run, printer: "unit:h2c_2", hours: 50, prints: 30}
  - {at: 2027-01-25, do: refresh, scope: "unit:drill_1", expect_changed: ["unit:drill_1"]}
  - {at: 2027-01-25, do: refresh, scope: all, expect_changed: []}

# The nozzle and the plate moved from printer A (h2c_1) to printer B (h2c_2). Each keeps
# what it did in both: nozzle_4 600 + 750 = 1350 of 1500 h; plate_1 400 + 500 = 900 of
# 1000 prints. Printer A's last run came after they left, so it does not count on them;
# it counts on nozzle_3, which stayed, and whose life a person then raised to 2000 h.
# On 2027-01-13 a person judged nozzle_4's wear by hand at 1400 h (it had 1350 counted);
# printer B's 50 h on 2027-01-15 count on top: 1450 of 1500 h. Plate_1 gets B's 30 prints.
expect_life:
  - {unit: nozzle_4, used: 1450, share: 0.9667, warn: true, book_value_minor: 83.33}
  - {unit: plate_1, used: 930, share: 0.93, warn: true, book_value_minor: 280}
  - {unit: nozzle_3, used: 700, share: 0.35, warn: false, book_value_minor: 1625}
  - {unit: h2c_1, used: 700, share: 0.07, warn: false, book_value_minor: 325407}
  - {unit: h2c_2, used: 800, share: 0.08, warn: false, book_value_minor: 321908}
  - {unit: drill_1, used: 2, share: 0.0238, warn: false, book_value_minor: 11742.86}

# The value history: one row per change, never rewritten. The moves (`relation`) changed
# no value, so they wrote no row. The second refresh changed nothing, so it wrote none.
expect_history:
  nozzle_4:
    - {at: 2026-12-01, reason: received, used: 0, share: 0.0, book: 2500.0}
    - {at: 2026-12-02, reason: use, used: 600, share: 0.4, book: 1500.0}
    - {at: 2027-01-12, reason: use, used: 1350, share: 0.9, book: 250.0}
    - {at: 2027-01-13, reason: manual, used: 1400, share: 0.9333, book: 166.67}
    - {at: 2027-01-15, reason: use, used: 1450, share: 0.9667, book: 83.33}
  nozzle_3:
    - {at: 2026-12-01, reason: received, used: 0, share: 0.0, book: 2500.0}
    - {at: 2026-12-02, reason: use, used: 600, share: 0.4, book: 1500.0}
    - {at: 2027-01-13, reason: use, used: 700, share: 0.4667, book: 1333.33}
    - {at: 2027-01-14, reason: params_changed, used: 700, share: 0.35, book: 1625.0}
  drill_1:
    - {at: 2026-12-01, reason: received, used: 0, share: 0.0, book: 12000.0}
    - {at: 2027-01-25, reason: refresh, used: 2, share: 0.0238, book: 11742.86}

expect_config_history:
  - {target: "unit:nozzle_3", step: life, key: hours, old: 1500, new: 2000}
