  - {id: nozzle_3, item: nozzle_hs_04, type: unit, cost_minor: 2500}
  - {id: nozzle_4, item: nozzle_hs_04, type: unit, cost_minor: 2500}
  - {id: plate_1, item: pei_textured, type: unit, cost_minor: 4000}
  - {id: spool_112, item: pla_matte_charcoal, type: unit}
  - {id: spool_113, item: pla_plus_gold, type: unit}
  - {id: insert_7, item: reusable_spool, type: unit}
  - {id: tags_lot_1, item: ntag215, type: lot, received: 100}
  - {id: drill_1, item: drill, type: unit, cost_minor: 12000, in_service_at: 2026-11-25}
  - {id: label_printer_1, item: label_printer_62, type: unit}
  - {id: roll_4, item: label_roll_62, type: unit}
  - {id: roll_5, item: label_roll_62, type: unit}
  - {id: roll_9, item: label_roll_29, type: unit}
  - {id: plan_1, item: label_printer_plan, type: unit, starts_at: 2026-11-25, ends_at: 2028-11-25}
  - {id: warranty_1, item: h2c_warranty, type: unit, starts_at: 2026-06-01, ends_at: 2027-06-01}
