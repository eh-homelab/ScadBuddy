# Real examples (design §7). Every thing the owner named on 2026-11-25 is here as an item
# (what you buy) and an instance (a lot or a unit you have), with the relationships
# between them. Prices and lives are examples, not measured values.
#
# `check.py` resolves every item's handlers from kinds.yaml and handlers.yaml, checks the
# parameters and the relationships, and prints the table in README.md §3.

items:
  - id: h2c
    name: Bambu Lab H2C
    kind: printer_h2c
    manufacturer: Bambu Lab
    properties: {model_code: H2C}
  - id: nozzle_hs_04
    name: H2C hardened steel nozzle 0.4 mm
    kind: nozzle
    manufacturer: Bambu Lab
    properties: {diameter_mm: 0.4, material: hardened_steel}
    steps:
      life: {params: {hours: 1500}}
  - id: pla_matte_charcoal
    name: Bambu PLA Matte Charcoal 1 kg
    kind: filament_pla_matte
    manufacturer: Bambu Lab
    properties: {rgba: "000000FF", colour_name: Charcoal, diameter_mm: 1.75, label_g: 1000}
  - id: pla_plus_gold
    name: Bambu PLA+ Gold 1 kg
    kind: filament_pla
    manufacturer: Bambu Lab
    properties: {rgba: "E4BD68FF", colour_name: Gold, diameter_mm: 1.75, label_g: 1000}
  - id: reusable_spool
    name: Bambu reusable spool
    kind: spool_part
    manufacturer: Bambu Lab
    properties: {empty_weight_g: 216}
  - id: pei_textured
    name: Textured PEI plate 350 mm
    kind: build_plate
    manufacturer: Bambu Lab
  - id: ntag215
    name: NTAG215 stickers, pack of 50
    kind: rfid_tag
    offer: {pack: 50}
  - id: drill
    name: Cordless drill 18 V
    kind: tool
    steps:
      life: {params: {months: 84, salvage_pct: 10}}
  - id: label_printer_62
    name: Label printer, 62 mm
    kind: label_printer
  - id: label_roll_62
    name: Continuous label roll 62 mm
    kind: label_roll
    properties: {width_mm: 62}
    steps:
      count: {params: {capacity: 400}}
  - id: label_roll_29
    name: Die-cut label roll 29 mm
    kind: label_roll
    properties: {width_mm: 29}
    steps:
      count: {params: {capacity: 800}}
  - id: label_printer_plan
    name: Label printer service plan, 2 years
    kind: service_plan
    steps:
      receive: {params: {term_months: 24}}
  - id: h2c_warranty
    name: H2C manufacturer warranty, 1 year
    kind: warranty
    steps:
      receive: {params: {term_months: 12}}
  - id: letter_paper
    name: Letter size paper, 20 lb
    kind: paper
    offer: {pack: 500, pack_name: ream}
  - id: repair_labour
    name: Printer repair labour
    kind: labour
    steps:
      bill: {params: {rate_minor: 6000, increment_minutes: 15, minimum_minutes: 30}}
  - id: nozzle_swap
    name: Nozzle swap, flat rate
    kind: flat_service
    steps:
      bill: {params: {price_minor: 1500}}

