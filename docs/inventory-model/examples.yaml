# Real examples (design §7). Every thing the owner named on 2026-11-25 is here as an item
# (what you buy) and an instance (a lot or a unit you have), with the relationships
# between them. Prices and lives are examples, not measured values.
#
# `check.py` resolves every item's handlers from kinds.yaml and handlers.yaml, checks the
# parameters and the relationships, and prints the table in README.md §3.

