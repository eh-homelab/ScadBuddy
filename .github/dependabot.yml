---
# Conventions here are the eh-homelab/WonderForgeLabs house style, ported from
# WonderForgeLabs/forge:
#
#   * `schedule` pins the day and time, not just the interval — every ecosystem
#     lands in the same Monday 04:00 batch instead of drifting to whenever each
#     one was first enabled.
#   * `commit-message.prefix: "deps"` / `prefix-development: "deps-dev"`, so
#     release-drafter and a human skimming `git log` can tell a runtime bump
#     from a tooling bump without opening the diff. (This replaces the previous
#     `chore` prefix, which said nothing about which kind of change it was.)
#   * `labels` carry BOTH this repo's domain label (ci / api / frontend) and the
#     ecosystem name, so a PR can be filtered either way.
#   * No `update-types` filter anywhere: major, minor and patch all flow. See
#     forge's docs/ADR/051-dependabot-actions-composite-and-ungrouped-severity.md
#     — filtering majors out does not remove the upgrade, it only removes the
#     notification that it is due.
version: 2
updates:
  # GitHub Actions. `directory: "/"` is correct and non-obvious: Dependabot
  # always reads .github/workflows/ relative to the repo root, never a
  # workflows subdirectory.
  #
  # There are no composite actions in .github/actions/ here. If any are ever
  # added they need their OWN entry pointed at their directory — the
  # github-actions ecosystem scans <directory>/.github/workflows and
  # <directory>/action.yml only, and does not recurse.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 10
    reviewers:
      - "ElanHasson"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels: ["dependencies", "ci", "github-actions"]
    groups:
      # One PR for every first-party action rather than one per action. These
      # move together, review as a unit, and each separate PR costs a full CI
      # run including an image build.
      actions:
        applies-to: version-updates
        patterns: ["actions/*"]

  # Python. `uv` ecosystem, NOT `pip`: the backend is a uv project with a
  # uv.lock, and the `pip` ecosystem would edit pyproject.toml while leaving
  # the lockfile stale — which then fails `uv sync --frozen` in CI and in the
  # Docker build, i.e. an update PR that cannot possibly go green.
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 10
    reviewers:
      - "ElanHasson"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels: ["dependencies", "api", "uv"]
    groups:
      # FastAPI is a thin layer over starlette and pydantic and its version
      # constraints on both are tight; bumping one without the others is the
      # usual way to land an unsatisfiable lock. uvicorn ships here too because
      # it is what actually serves the app.
      fastapi:
        patterns:
          - "fastapi"
          - "starlette"
          - "uvicorn*"
          - "pydantic"
          - "pydantic-settings"
          - "python-multipart"
      # The geometry stack. trimesh's own requirements pin numpy ranges, and
      # networkx/lxml are its optional-but-used companions, so they resolve
      # together or not at all.
      geometry:
        patterns:
          - "trimesh"
          - "numpy"
          - "networkx"
          - "lxml"
      # respx mocks httpx at the transport layer and tracks its internals, so
      # a respx bump that leaves httpx behind (or vice versa) breaks every
      # test that stubs the Bambuddy client. httpx is a runtime dependency,
      # which is why this is its own group rather than part of `pytest` below.
      httpx:
        patterns:
          - "httpx"
          - "respx"
      # pytest-asyncio's compatibility window with pytest is narrow enough
      # that the two must move together.
      pytest:
        patterns:
          - "pytest"
          - "pytest-*"
      # Lint/typecheck. Both gate CI and neither affects the shipped app, so a
      # single PR carrying both is the cheapest thing to review and revert.
      lint:
        patterns:
          - "ruff"
          - "mypy"

  # Go (#2686): the two modules of the go.work workspace. A bump edits only
  # the module's go.mod/go.sum; it does not run `go work vendor`, so the root
  # vendor/ (and scadbuddy-client's own) lag until vendor-autofix.yml commits
  # them, and the `go` job's drift check stays red until it does.
  - package-ecosystem: "gomod"
    directories:
      - "/tools/go/scadbuddy-client"
      - "/tools/go/bambuddy-fs"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 10
    reviewers:
      - "ElanHasson"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels: ["dependencies", "gomod"]
    groups:
      # The Kiota runtime packages the generated client imports move together.
      kiota:
        patterns: ["github.com/microsoft/kiota-*"]
      go-fuse:
        patterns: ["github.com/hanwen/go-fuse/*"]

  # The frontend and the AI agent service (#261), one entry for both. A group
  # in a multi-directory entry is one PR across every directory it touches,
  # which zod needs: agent/test/zodAlias.test.ts fails unless agent/ and
  # frontend/ declare the same zod range, so separate entries opened one
  # failing PR per directory (#4294, #4307). The groups are the union of the
  # two old entries'; a pattern that matches nothing in a directory is a no-op
  # there. The cost is the domain label: one entry cannot label frontend and
  # agent PRs differently, so they carry only `dependencies` and `npm`.
  #
  # `@anthropic-ai/claude-agent-sdk` is pinned to an exact version, and it
  # bundles the Claude Code binary the harness runs. The `agent` job's tests
  # run that binary against a fake endpoint, so an SDK bump that changes what
  # the harness relies on reds the job on its PR (#1540).
  - package-ecosystem: "npm"
    directories:
      - "/frontend"
      - "/agent"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    # The two old entries' 10 each.
    open-pull-requests-limit: 20
    reviewers:
      - "ElanHasson"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels: ["dependencies", "npm"]
    groups:
      # The SDK declares these as peer dependencies; they move together. zod
      # is here for both directories: the agent's SDK peers on it and the
      # frontend's must match it (see above).
      agent-sdk:
        patterns:
          - "@anthropic-ai/*"
          - "@modelcontextprotocol/sdk"
          - "zod"
      hono:
        patterns: ["hono", "@hono/*"]
      # React and the three.js stack move together; separate PRs for
      # react/react-dom or three/@react-three/* land a tree that does not build.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      three:
        patterns: ["three", "@types/three", "@react-three/*"]
      # vitest is built on vite and resolves against its exact major; a vite
      # bump without vitest (or the plugin) is a typecheck failure at best.
      vite:
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/*"
      # eslint 10 flat config: the core, the config package and the TS plugin
      # share a config schema, so a partial bump breaks `pnpm lint` outright.
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "typescript-eslint"
          - "globals"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      # The test harness: Playwright drives the e2e suite, msw mocks the API
      # for both it and the vitest unit tests, and testing-library/jsdom are
      # what those tests are written against.
      testing:
        patterns:
          - "@playwright/test"
          - "msw"
          - "@testing-library/*"
          - "jsdom"
      # Kept out of the groups above so a bare @types bump never blocks a
      # runtime group's PR on an unrelated typecheck failure.
      types:
        patterns:
          - "@types/node"
    ignore:
      # @types/node tracks the runtime's major (Node 24, the Dockerfile's
      # frontend and agent stages); a newer major would type APIs neither can
      # call.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Docker: the Dockerfile's FROM lines. Three of the four are bumpable
  # (node, ghcr.io/astral-sh/uv, hadolint's own image is not here); the fourth,
  # openscad/openscad, is a dated nightly pinned by tag and digest. It is
  # ignored: a bump means re-verifying §3 of the design spec and moving
  # OPENSCAD_VERSION with it, which Dependabot cannot do.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    reviewers:
      - "ElanHasson"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels: ["dependencies", "docker"]
    ignore:
      # Node majors are taken by hand, in lockstep with ci.yml's node-version.
      # Odd majors are never LTS and ship no corepack, which this image needs
      # to honour the frontend's `packageManager` pin; corepack cannot even be
      # installed from npm there. #55 (24 -> 25) broke main on 2026-09-23.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "openscad/openscad"
      # The slicer stages run Bambu Studio's ubuntu24.04 AppImage (BAMBU_STUDIO_ASSET),
      # and their runtime libraries were measured on 24.04 (Dockerfile `slicer`). The
      # base moves with that asset, re-measured, never on its own (#4604's review).
      # Dependabot reads 24.04 -> 24.10 as a minor update (#4686, an EOL interim
      # release), so minors are ignored too; 24.04 digest refreshes still come.
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
