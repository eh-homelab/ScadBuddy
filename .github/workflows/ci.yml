---
name: CI

# The required status check on `main` is the job DISPLAY NAME "CI Summary".
# Renaming it silently unsatisfiable-ifies the merge gate, because the gate is
# CODE and lives in ANOTHER repository: eh-homelab/clusters'
# `infra/github/eh-homelab/main.tf` declares a `github_repository_ruleset` whose
# `required_checks` pin the context string, applied by that repo's Tofu CI.
# Nothing in THIS repo will fail if the two drift apart — the PR just stops
# being mergeable with no stated cause. Rename here, change it there, same day.
#
# It is the only job here that is required, which is what lets every other job
# be gated, skipped or reordered freely.
#
# ── Why ubuntu-latest and not the eh-homelab self-hosted pools ────────────────
# ScadBuddy is PUBLIC. Free hosted minutes are the smaller half of the reason;
# the load-bearing half is that `clusters-runner*` are ARC scale sets inside the
# homelab cluster, on the LAN with Hindsight and the Nexus cache. Putting a
# public repo on those pools means a fork PR can execute attacker-controlled
# code in that network — an unreasonable trade for a build that needs nothing on
# the LAN. (GitHub's own guard against this is an org runner group's
# `allows_public_repositories`, default false; the right answer here is not to
# turn it on but to stay off those pools.)
#
# Hosted also gets the `type=gha` buildx cache back, which fails outright on
# the self-hosted pools -- it fails the BUILD, it does not degrade, which is
# what makes it misleading (the image builds fine, then the job dies on the
# cache export). The rule "never buildx `type=gha` on a self-hosted pool" is
# attested and stands on its own.
#
# The MECHANISM is unconfirmed, and is recorded here so it does not harden
# into folklore. It was observed as a TLS cert substitution on
# `results-receiver.actions.githubusercontent.com` (the ACTIONS_RESULTS_URL
# host the exporter talks to) on 2026-08-10 and 2026-09-02 -- but that host's
# chain measured CLEAN from inside a runner pod on 2026-09-23
# (`CN=*.actions.githubusercontent.com`, Let's Encrypt YR2, SAN covering the
# name). Absent-now does not disprove an intermittent fault, and a clean probe
# cannot prove absence of one, so treat it as intermittent rather than settled
# in either direction. Note a separate, similar-looking error -- `Failed to
# resolve action download info ... SSL connection could not be established` --
# is a DIFFERENT host (`pipelines.actions.githubusercontent.com`, measured
# 120/120 clean). That rules out the homelab network -- it reproduced across
# two independent networks on 2026-09-02, and an 880 ms failure is too fast to
# be congestion -- but the cause is UNIDENTIFIED; do not merge the two.
#
# `ubuntu-latest` provides docker + buildx, and QEMU binfmt for the arm64 leg of
# build-image.yml, so no job here needs a bigger or different runner.
on:
  pull_request:
  push:
    branches: [main]
  # Weekly, and on demand, so every template's verify.sh runs against the image
  # even in a week when nothing merged (#229). The template checks are the
  # reason; the rest of CI rides along because it is cheap and it is the same
  # tree. Nothing about the other jobs changes: `freshness` and
  # `dispatch-review` are PR-only already, and `CI Summary` requires
  # `freshness` only on a pull_request.
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

# One run per ref. A newer push supersedes an older one, so cancelling costs
# nothing but the wasted minutes.
#
# `event_name` is in the key so a scheduled or dispatched run on main never
# cancels a push run on main (or the other way round): they share the ref, and
# a cancelled push run is a merge whose CI never reported.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Which halves of the tree exist ──────────────────────────────────────────
  #
  # This repo is being built by four concurrent branches (renderer, frontend,
  # keychain model, and this one). Until they all land, `backend/` and
  # `frontend/` genuinely do not exist on some heads, and a job that assumes
  # they do would red every PR in the bootstrap window.
  #
  # The gate is NOT a fail-open hole, because `CI Summary` re-derives the same
  # two booleans from its own checkout and fails if a directory exists whose
  # job did not succeed. So "the directory is missing" is the ONLY way a check
  # can legitimately be skipped, and the allowance disappears on its own the
  # moment the other branches merge.
  layout:
    name: Detect layout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      agent: ${{ steps.detect.outputs.agent }}
      e2e: ${{ steps.detect.outputs.e2e }}
      models: ${{ steps.detect.outputs.models }}
      image: ${{ steps.detect.outputs.image }}
      app: ${{ steps.detect.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Detect which trees are present
        id: detect
        run: |
          set -euo pipefail

          # `if`, not `[ -f x ] && y=true`. Every `run:` block here is
          # `bash -e {0}`: a bare `[ ... ] && ...` whose test FAILS is a
          # non-zero simple command, which aborts the step. The failure is
          # asymmetric and so invisible in testing — the "present" path passes
          # and only the "absent" path reds, which is exactly the case this
          # job exists to detect.
          backend=false
          if [ -f backend/pyproject.toml ]; then backend=true; fi
          frontend=false
          if [ -f frontend/package.json ]; then frontend=true; fi
          agent=false
          if [ -f agent/package.json ]; then agent=true; fi
          e2e=false
          if [ -d frontend/e2e ]; then e2e=true; fi
          models=false
          if [ -d models ]; then models=true; fi

          # Can the image actually SERVE yet? The Dockerfile's CMD is
          # `uvicorn scadbuddy.main:app`. When this gate was written the API
          # epic had not landed and starting the container died with
          # `exec uvicorn failed`; it has landed since, so this now reads true.
          # Kept because it is the honest precondition for the container smoke
          # test, and because it costs one `[ -f ]`.
          app=false
          if [ -f backend/scadbuddy/main.py ]; then app=true; fi

          # The image needs all THREE trees: the Node stage builds frontend/,
          # the runtime stage installs backend/ and copies models/ as the seed
          # catalogue. A missing `models/` is a `COPY` failure partway through
          # the build, not a skip.
          #
          # Deliberately coarse: presence of `backend/pyproject.toml` is enough
          # to run the image job, even though the build also needs
          # `backend/uv.lock`. If the lockfile is missing the build FAILS —
          # loudly, with the missing file named — which is the right outcome.
          # Testing for every input here would turn a loud build error into a
          # silent skip.
          image=false
          if [ "$backend" = true ] && [ "$frontend" = true ] && [ "$models" = true ]; then image=true; fi

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "agent=$agent"
            echo "e2e=$e2e"
            echo "models=$models"
            echo "image=$image"
            echo "app=$app"
          } | tee -a "$GITHUB_OUTPUT"

  # ── Things that need neither half of the tree ───────────────────────────────
  lint:
    name: Workflow and Dockerfile lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # actionlint catches the two mistakes this repo's workflows are most
      # exposed to: shell-injection via `${{ }}` interpolated straight into a
      # `run:` block, and expressions that reference a job/step/output that does
      # not exist (which GitHub itself accepts silently and evaluates to "").
      # raven-actions/actionlint, not `rhysd/actionlint` — the upstream repo
      # ships no action.yml, so `uses: rhysd/actionlint@...` fails to resolve.
      #
      # The one -ignore is for a stale entry in actionlint's BUNDLED
      # action-metadata database, not a real problem: it still lists
      # create-github-app-token's `app-id` as required and does not know
      # `client-id`. Upstream is the other way round — `client-id` is current
      # and `app-id` carries a deprecationMessage (verified against the action's
      # own action.yml). The pattern is the action name rather than the two
      # message texts because an -ignore regex containing quotes has to survive
      # a shell round-trip through this action's `flags` input.
      #
      # There is no .github/actionlint.yaml. It existed only to declare the
      # self-hosted ARC pool labels (a typo'd pool name queues forever with no
      # error, and actionlint was the only thing that caught it); every job now
      # runs on ubuntu-latest, so there is no custom label left to declare.
      # Bring it back with the file if a job ever moves back onto a pool.
      - name: actionlint
        uses: raven-actions/actionlint@v2.2.0
        with:
          fail-on-error: true
          flags: -ignore create-github-app-token

      # `.github/scripts/fonts-probe.sh` decides whether the image job's
      # install-on-demand e2e test runs at all, and a wrong verdict there is
      # invisible — it skips a test and stays green. Its branches are covered
      # by a stub-driven suite that needs neither docker nor the network, so it
      # belongs in this job rather than behind the image build.
      - name: fonts-probe unit tests
        run: .github/scripts/fonts-probe.test.sh

      # The config lives in .hadolint.yaml so the same rules apply to a local
      # `hadolint Dockerfile` as to this job.
      - name: hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

      # The merge gate's fail-closed check (#123) is a shell script, so it gets
      # shell linting and its own tests. They are pure functions over a comments
      # payload — no network, no `gh` — so they run here in a couple of seconds
      # rather than needing a live PR to exercise.
      #
      # The templates' verify.sh scripts too (#229): they are what the `models`
      # job runs, and a word-splitting bug in one is a check that silently
      # asserts something other than what it says.
      - name: shellcheck the CI scripts and the template verify scripts
        run: shellcheck .github/scripts/*.sh models/*/verify.sh

      - name: Test the template selector
        run: .github/scripts/select-models.test.sh

      # verify-models.sh reaps a timed-out template's containers by the
      # `scadbuddy-verify=<slug>` label (#302). An unlabelled `docker run` that
      # mounts nothing would survive the timeout, so each one fails here.
      # Its own tests first, so a regression in the lint reads as a failing
      # case rather than as a template violation.
      - name: Test the docker run label lint
        run: .github/scripts/lint-verify-labels.test.sh

      - name: Check every template docker run is labelled
        run: .github/scripts/lint-verify-labels.sh

      - name: Test the review-summary lookup
        run: .github/scripts/review-summary-for-sha.test.sh

      - name: Test the issue-intake failure check
        run: .github/scripts/intake-verify.test.sh

      # ScadBuddy's Claude plugin (#299) is Markdown and JSON that nothing else
      # in CI reads: a skill that loses its frontmatter still loads with its
      # description gone, and a malformed marketplace.json only fails when a
      # user runs `/plugin marketplace add`. The lint also enforces the AI
      # spec's citation rule (D10) on every skill. jq is on ubuntu-latest; the
      # Claude Code CLI's `claude plugin validate` is not, so it stays a local
      # check (plugins/scadbuddy/README.md).
      - name: Lint the Claude plugin and marketplace
        run: .github/scripts/lint-plugin.sh

      - name: Test the plugin lint
        run: .github/scripts/lint-plugin.test.sh

  # ── Frontend: no Docker needed, so the cheap pool ───────────────────────────
  frontend:
    name: Frontend lint, typecheck, test, build
    needs: layout
    if: ${{ needs.layout.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Pin the Node major to the one the Dockerfile's Node stage uses, so a
      # `pnpm build` that passes here is the same build the image performs.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # `pnpm gen:api`, which typecheck, test and build run first, exports the
      # backend's spec with uv: the spec and the generated clients are not
      # committed (#492). Same pinned action as the `freshness` job.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # corepack, not a pinned pnpm version: the version comes from
      # frontend/package.json's `packageManager` field, which is also what the
      # Dockerfile's Node stage reads. One source of truth for the pnpm version.
      - name: Enable corepack
        run: corepack enable

      # --frozen-lockfile, never a plain install: a CI run that silently
      # resolves a different dependency tree than the lockfile is testing
      # something nobody will ever ship.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # The MSW-BACKED half of the e2e suite lives here and NOT in the image
      # job, which is where it started. frontend/playwright.config.ts is
      # self-contained without `E2E_BASE_URL`: it runs its own `webServer`
      # (`pnpm build && pnpm preview --port 4173`) against the production
      # bundle with the msw worker mocking the API — by its own comment, "so it
      # exercises the same build the backend will host". Those specs never talk
      # to a backend, so pointing them at the running container was simply
      # wrong, and gating them on the container's entrypoint was wrong for the
      # same reason. Here they also reuse the node_modules this job already
      # installed instead of a second `pnpm install`.
      #
      # `e2e/real-backend.spec.ts` is the other half and skips itself here, by
      # design — it needs a real openscad. The image job runs it against the
      # container it builds; see the e2e steps there.
      - name: Install Playwright browsers
        if: ${{ needs.layout.outputs.e2e == 'true' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright smoke
        if: ${{ needs.layout.outputs.e2e == 'true' }}
        # DEBUG=pw:webserver is load-bearing for diagnosis, not noise.
        # Playwright pipes the webServer's STDERR but IGNORES its stdout, so a
        # server that fails to come up produces only
        # "Timed out waiting 180000ms from config.webServer" with no cause —
        # vite's own startup banner and any build output are discarded. This
        # channel prints the lifecycle instead.
        env:
          DEBUG: pw:webserver
        run: pnpm exec playwright test

      - name: Upload the Playwright report
        if: ${{ failure() && needs.layout.outputs.e2e == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

  # ── Agent service (#261): the AI sidecar in agent/ ──────────────────────────
  #
  # The same shape as `frontend` (same Node major, corepack-pinned pnpm,
  # frozen lockfile), plus the sidecar image: `--target agent` is a separate
  # image with nothing in common with the OpenSCAD stages, so it is built and
  # smoke-tested here rather than in `image`. The build itself asserts the
  # Claude Code version the Agent SDK bundles (the Dockerfile's
  # CLAUDE_CODE_VERSION), so an SDK bump that moves it reds this job on the PR.
  #
  # No test here calls Anthropic: test/run.test.ts points the SDK at a local
  # fake Anthropic-format endpoint as its gateway (ANTHROPIC_BASE_URL, #255).
  # The Postgres service is for test/pg.test.ts (the agent's `ai_*` tables and
  # migrations), reached on the runner's loopback; each test works in a schema
  # of its own, as the backend's `requires_postgres` tests do.
  agent:
    name: Agent lint, typecheck, test, build, image
    needs: layout
    if: ${{ needs.layout.outputs.agent == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scadbuddy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Pinned with the Dockerfile's agent stages and the `frontend` job.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # `pnpm gen:api`, which typecheck, test and build run first, exports the
      # backend's spec with uv: the spec and the generated clients are not
      # committed (#492). Same pinned action as the `freshness` job.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        env:
          SCADBUDDY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/scadbuddy_test
        run: pnpm test

      - name: Build
        run: pnpm build

      - uses: docker/setup-buildx-action@v4

      # `type=gha` only because this is a GitHub-hosted runner (see the header
      # of this file). Its own `scope` so this job and `image`, which run in
      # parallel, do not overwrite each other's cache index; build-image.yml
      # writes the same scope from main, which is what warms it for PRs.
      - name: Build the agent image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: agent
          load: true
          tags: scadbuddy-agent:ci
          cache-from: type=gha,scope=agent
          cache-to: type=gha,scope=agent,mode=max

      # The image's own HEALTHCHECK is the assertion, as in `image`. No
      # database and no backend exist here, so /healthz must say AI is
      # disabled rather than fail: that is the degraded mode spec §9 requires.
      - name: Start the agent container and check /healthz
        run: |
          set -euo pipefail
          docker run -d --name scadbuddy-agent-ci --read-only \
            --tmpfs /tmp --tmpfs /var/lib/scadbuddy-agent:uid=10001,gid=10001 \
            -p 18081:8081 scadbuddy-agent:ci
          status=""
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' scadbuddy-agent-ci 2>/dev/null || true)"
            case "$status" in
              healthy) break ;;
              unhealthy) break ;;
            esac
            sleep 2
          done
          if [ "$status" != "healthy" ]; then
            echo "::error::agent container never became healthy (last status: ${status:-<none>})"
            docker logs scadbuddy-agent-ci
            exit 1
          fi
          body="$(curl --fail --silent --show-error http://127.0.0.1:18081/healthz)"
          echo "$body"
          if ! jq -e '.status == "ok" and .ai == "disabled (no database)"' <<<"$body" >/dev/null; then
            echo "::error::unexpected /healthz body from the agent container"
            exit 1
          fi
          # The tmpfs hides the image's own claude/ and work/, so these exist
          # only if the service recreated them at start (harness/stateDirs.ts).
          if ! docker exec scadbuddy-agent-ci test -d /var/lib/scadbuddy-agent/claude -a -w /var/lib/scadbuddy-agent/claude -a -d /var/lib/scadbuddy-agent/work -a -w /var/lib/scadbuddy-agent/work; then
            echo "::error::the agent did not recreate its state directories on the mounted volume"
            exit 1
          fi

      - name: Tear down
        if: always()
        run: docker rm -f scadbuddy-agent-ci || true

  # ── Image build + everything that needs a real openscad ─────────────────────
  #
  # ONE job, on purpose. The backend's integration tests are marked
  # `requires_openscad` and only run where the binary exists, which is inside
  # this image and nowhere else. Splitting "build" from "test" would mean
  # shuttling a ~1.5 GB image between jobs as an artifact (there is no registry
  # to push a PR image to), which costs far more than it saves.
  image:
    name: Image build, backend checks, container smoke, real-backend e2e
    needs: layout
    if: ${{ needs.layout.outputs.image == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # For the `requires_postgres` tests: the render queue's Postgres store. The
    # test container reaches it on the runner's loopback (`--network host`), and
    # each test works in a schema of its own.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scadbuddy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: docker/setup-buildx-action@v4

      # --target test, and --load so it lands in the local docker daemon.
      #
      # `type=gha` works here only because this is a GitHub-hosted runner — the
      # self-hosted pools' TLS interception breaks the Actions cache protocol
      # outright (it fails the build, it does not degrade). Read AND write:
      # Actions cache scoping lets a PR read the default branch's entries, so a
      # PR gets build-image.yml's layers from main, and writing its own scope
      # means the SECOND push on a PR does not rebuild what the first one
      # already built. A PR's writes land in the PR's own scope and cannot
      # affect main.
      #
      # mode=max caches intermediate stages too, which is the only way the
      # frontend and dependency layers survive; mode=min would keep the final
      # layers and rebuild everything expensive. Watch the repo's 10 GB Actions
      # cache ceiling if this ever starts thrashing — the fallback is
      # `type=registry` against a GHCR `buildcache` tag, which has no ceiling.
      #
      # The `test` stage is a superset of `runtime` (same layers plus the dev
      # dependency group), so building it warms every layer the smoke test
      # below needs and `--target runtime` is then almost free.
      - name: Build the test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          load: true
          tags: scadbuddy:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Exactly the commands the repo contract names, run where the real
      # openscad is. `--no-sync` because the venv was already synced during the
      # build: without it every `uv run` reinstalls the project package first.
      - name: ruff check
        run: docker run --rm -w /app/backend scadbuddy:ci-test uv run --frozen --no-sync ruff check .

      - name: ruff format --check
        run: docker run --rm -w /app/backend scadbuddy:ci-test uv run --frozen --no-sync ruff format --check .

      - name: mypy
        run: docker run --rm -w /app/backend scadbuddy:ci-test uv run --frozen --no-sync mypy

      # No `-m` filter: inside the image `requires_openscad` tests are supposed
      # to run, and the point of building the image at all is that they can.
      # `requires_postgres` ones run against the service container above.
      - name: pytest
        run: >-
          docker run --rm --network host
          -e SCADBUDDY_TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/scadbuddy_test
          -w /app/backend scadbuddy:ci-test uv run --frozen --no-sync pytest

      - name: Build the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          tags: scadbuddy:ci
          # Read-only: the `test` build above already wrote every shared layer.
          cache-from: type=gha

      # The container's OWN healthcheck is the assertion, not a curl we write
      # here: that way CI exercises the same probe Kubernetes will, and a
      # HEALTHCHECK that is broken in the image cannot pass in CI.

      - name: Start the container and wait for its healthcheck
        if: ${{ needs.layout.outputs.app == 'true' }}
        run: |
          set -euo pipefail
          docker run -d --name scadbuddy-ci -p 18080:8080 scadbuddy:ci

          # `|| true` on the inspect: under `bash -e` a failed inspect (the
          # container exited and was reaped, or the image somehow carries no
          # HEALTHCHECK) would abort the step before the diagnostics below ever
          # print. The `{{if .State.Health}}` guard yields an empty string
          # rather than a template error in that second case.
          status=""
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' scadbuddy-ci 2>/dev/null || true)"
            case "$status" in
              healthy) echo "container healthy"; exit 0 ;;
              unhealthy) break ;;
            esac
            sleep 2
          done
          echo "::error::container never became healthy (last status: ${status:-<none>})"
          docker logs scadbuddy-ci
          exit 1

      - name: Probe /healthz from outside the container
        if: ${{ needs.layout.outputs.app == 'true' }}
        run: curl --fail --silent --show-error http://127.0.0.1:18080/healthz

      # ── The real-stack e2e suite ────────────────────────────────────────────
      #
      # `e2e/real-backend.spec.ts` gates itself on `E2E_BASE_URL` (and the msw
      # specs skip themselves when it IS set, so one `playwright test` run
      # covers exactly the half that belongs here). Nothing in CI set that
      # variable, so both of its tests — the two-extruder 3MF download and the
      # install-Pacifico-on-demand acceptance for #82 — had SKIPPED on every
      # run since they were written. A skipped test in a green job is
      # indistinguishable from a passing one on the checks UI, which is the
      # same vacuous-green trap the `freshness` job's comment describes.
      #
      # Run HERE, against the container the two steps above just started, and
      # NOT in a job of its own. A separate job cannot be handed a ~1.5 GB
      # image (there is no registry to push a PR image to), so it would have to
      # rebuild from the `type=gha` cache — and that re-resolves
      # `openscad/openscad:dev`, a ROLLING tag. A nightly that lands between
      # the two jobs gives the e2e job a different image from the one the smoke
      # test passed against: either a full uncached rebuild, or a red
      # OPENSCAD_VERSION assertion, for a suite whose whole point is to
      # exercise the shipped artefact. This way the bytes under test are
      # exactly the bytes that were built and probed.
      #
      # The msw-backed suite stays in the `frontend` job, where its own
      # `webServer` serves the production bundle with no backend at all. The
      # two suites are complements, not duplicates: that one pins the UI
      # against a fixed contract, this one proves a real OpenSCAD renders,
      # splits and packs a 3MF the browser can download.
      - uses: actions/setup-node@v7
        if: ${{ needs.layout.outputs.app == 'true' && needs.layout.outputs.e2e == 'true' }}
        with:
          node-version: "24"

      - name: Enable corepack
        if: ${{ needs.layout.outputs.app == 'true' && needs.layout.outputs.e2e == 'true' }}
        run: corepack enable

      - name: Install frontend dependencies
        if: ${{ needs.layout.outputs.app == 'true' && needs.layout.outputs.e2e == 'true' }}
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: ${{ needs.layout.outputs.app == 'true' && needs.layout.outputs.e2e == 'true' }}
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      # The install-on-demand test is the only thing in this repo that depends
      # on a service outside it, and `CI Summary` — the one required check —
      # asserts this job. Left unguarded that makes a Google-side outage a hard
      # red on somebody else's unrelated PR, and it contradicts the design's own
      # position that a 503 from the catalogue is a SUPPORTED state (§5.4)
      # rather than an error. A fresh container has no Pacifico for that
      # fallback to offer, so an outage does not make the test skip — the row
      # simply never appears and it times out 60s later, naming the wrong
      # culprit.
      #
      # The decision lives in `.github/scripts/fonts-probe.sh` rather than in
      # this file, because it turned out to be the subtle half of this change —
      # only an unreachable DEPENDENCY may skip, everything this application
      # does wrong must red — and a `run:` block cannot be tested. The script
      # explains its own rules, and `fonts-probe.test.sh` (in the `lint` job)
      # drives all thirteen of its branches through a stub, including the ones
      # a healthy CI run never reaches.
      - name: Probe the Google Fonts path from inside the container
        id: fonts-probe
        if: ${{ needs.layout.outputs.app == 'true' && needs.layout.outputs.e2e == 'true' }}
        env:
          CONTAINER: scadbuddy-ci
        run: .github/scripts/fonts-probe.sh

      # No webServer: `E2E_BASE_URL` makes playwright.config.ts use the URL
      # as-is, so this drives the container published on 18080 above — its own
      # bundle, its own API, its own openscad.
      #
      # `E2E_OFFLINE` carries the probe's verdict. Empty is the normal case and
      # is NOT "1", so the spec's `test.skip(process.env.E2E_OFFLINE === '1')`
      # does not fire and the font test runs. The first test — render, generate,
      # download, unpack the two-extruder 3MF — needs nothing outside the
      # container and runs either way.
      - name: Real-backend Playwright suite
        if: ${{ needs.layout.outputs.app == 'true' && needs.layout.outputs.e2e == 'true' }}
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:18080
          E2E_OFFLINE: ${{ steps.fonts-probe.outputs.offline }}
        run: pnpm exec playwright test

      - name: Upload the real-backend Playwright report
        if: ${{ failure() && needs.layout.outputs.app == 'true' && needs.layout.outputs.e2e == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-real-backend
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Container logs on failure
        if: ${{ failure() && needs.layout.outputs.app == 'true' }}
        run: docker logs scadbuddy-ci || true

      - name: Tear down
        if: always()
        run: docker rm -f scadbuddy-ci || true

  # ── Each template's verify.sh (#229) ────────────────────────────────────────
  #
  # Every bundled template ships a `models/<slug>/verify.sh` that renders it
  # across its parameter edge cases and checks the geometry: bounding boxes,
  # one closed part per colour, text on its plate, print-in-place clearances.
  # Before this job nothing ran them, so a README's figures and a PR's
  # "N cases, all PASS" were attested only by whoever ran them locally.
  #
  # WHICH templates: on a pull_request, the ones whose directory the PR
  # changed, plus all of them when the tooling changed (the Dockerfile, this
  # file, the selector, the runner) — see .github/scripts/select-models.sh.
  # On push to main, on the weekly schedule and on a manual dispatch: all of
  # them. The gate fails OPEN, to "all": if the PR's diff cannot be computed,
  # every template runs. It can never make this job skip — the job always
  # runs when models/ exists and `CI Summary` asserts its result — so the only
  # thing the selection can do is make it shorter.
  #
  # WHICH image: the Dockerfile's `base` stage — `openscad/openscad:dev` plus
  # the exact font packages the shipped image carries — rebuilt here from the
  # `type=gha` cache the `image` job writes, and then checked against the
  # Dockerfile's pinned OPENSCAD_VERSION. Not the full `test` image: the
  # scripts need openscad and fonts and nothing else, and `base` has no
  # frontend or Python dependency layers to rebuild on a PR that changes them.
  # Its own job rather than steps in `image`, so it runs beside that job's ~7
  # minutes instead of after them.
  #
  # Timing, measured rather than assumed: on ubuntu-latest (4 vCPU, four
  # templates at a time) the 24 templates then on main took 3.5 min for the
  # whole job, slowest chunky-name-sign at 158 s (#283's own run). flexi-fabric
  # (159 s locally, against chunky-name-sign's 84 s there) and dollhouse-kit
  # landed after, so budget roughly double that on hosted. `timeout-minutes: 30`
  # is headroom for the wall time, and it stays above the runner's 20-minute
  # per-template guard, so a single hung template reds as a named timeout in
  # the summary table rather than as the whole job being killed. Raise both
  # together if the set outgrows it.
  #
  # It runs as root (as `openscad/openscad:dev` does), which is what the
  # scripts assume: they bind-mount the checkout and write their renders into
  # it. The `test` and `runtime` stages run as uid 10001 and could not.
  models:
    name: Template verify scripts
    needs: layout
    if: ${{ needs.layout.outputs.models == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Depth 2: on a pull_request the checkout is GitHub's merge commit, and
      # its first parent is the base branch tip, so `HEAD^1..HEAD` is exactly
      # what this PR changes against the base it would merge into.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Select the templates to verify
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          list="$RUNNER_TEMP/models.txt"
          # The `rev-parse HEAD^2` guard: without a merge commit there is no
          # base parent to diff against, and diffing HEAD^1 of a non-merge
          # would silently compare against the wrong commit. Fail open.
          if [ "$EVENT_NAME" = "pull_request" ] \
            && git rev-parse -q --verify 'HEAD^2' >/dev/null \
            && git diff --name-only 'HEAD^1' HEAD >"$RUNNER_TEMP/changed.txt"; then
            .github/scripts/select-models.sh changed <"$RUNNER_TEMP/changed.txt" >"$list"
          else
            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo "::warning::Could not compute this PR's changed files; verifying every template."
            fi
            .github/scripts/select-models.sh all >"$list"
          fi
          count="$(grep -c . "$list" || true)"
          echo "Selected ${count} template(s):"
          cat "$list"
          echo "count=${count}" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        if: ${{ steps.select.outputs.count != '0' }}

      # Read-only cache. The entries it hits were written by an EARLIER run's
      # `image` job (mode=max exports every `base` layer): this job does not
      # wait for this run's `image` job, and both start as soon as `layout` is
      # done. So on a commit that changes the `base` stage itself (an
      # OPENSCAD_VERSION bump, a font package), there is nothing to hit yet.
      # Both jobs cold-build `base` independently, each on its own hosted VM,
      # and this job does it while selecting every template, because the
      # Dockerfile is tooling. That is accepted rather than serialized behind
      # `image`: a cold `base` is a pull of `openscad/openscad:dev` (~620 MB)
      # plus one apt layer. The apt layer and the build took 19 s locally
      # (`--no-cache`, base image already present), so the cost is that plus
      # one pull. Waiting for `image` would cost its full ~7 minutes on every
      # run. Not exporting
      # from here keeps one writer per scope.
      - name: Build the verify image (Dockerfile `base` stage)
        if: ${{ steps.select.outputs.count != '0' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          target: base
          load: true
          tags: scadbuddy-verify:ci
          cache-from: type=gha

      # `base` sits BELOW the Dockerfile's OPENSCAD_VERSION assertion (that is
      # in the `app` stage), so assert it here too: a template check against an
      # OpenSCAD the rest of the repo has not been verified on proves nothing.
      # `--version` writes to stderr, hence the redirect.
      - name: Assert the pinned OpenSCAD version
        if: ${{ steps.select.outputs.count != '0' }}
        run: |
          set -euo pipefail
          want="$(sed -n 's/^ARG OPENSCAD_VERSION=//p' Dockerfile)"
          got="$(docker run --rm scadbuddy-verify:ci openscad --version 2>&1 | sed -n 's/^OpenSCAD version //p')"
          echo "Dockerfile pins ${want}; image carries ${got}"
          if [ -z "$want" ] || [ "$want" != "$got" ]; then
            echo "::error::verify image carries OpenSCAD '${got}', the Dockerfile pins '${want}'."
            exit 1
          fi

      # wifi-qr-plaque's verify.sh checks its QR matrices against python-qrcode
      # and OpenCV through `uv run --with`; everything else needs only the host
      # python3 the runner already has.
      - name: Set up uv
        if: ${{ steps.select.outputs.count != '0' }}
        uses: astral-sh/setup-uv@v10.2.0

      - name: Run the selected verify.sh scripts
        if: ${{ steps.select.outputs.count != '0' }}
        env:
          SCADBUDDY_OPENSCAD_IMAGE: scadbuddy-verify:ci
          SCADBUDDY_FONTS_IMAGE: scadbuddy-verify:ci
        run: .github/scripts/verify-models.sh <"$RUNNER_TEMP/models.txt"

      - name: Nothing to verify
        if: ${{ steps.select.outputs.count == '0' }}
        run: |
          echo "This change touches no template and no verify tooling; no verify.sh ran." | tee -a "$GITHUB_STEP_SUMMARY"

  # ── The API spec: deterministic export, its diff on the PR, the msw worker ─
  #
  # backend/openapi.json and both schema.d.ts files are generated at build and
  # CI time and are not committed (#492). Committed, any two PRs that changed
  # the API conflicted on them, and GitHub marked both conflicting before this
  # job could regenerate anything. The `frontend` and `agent` jobs now export
  # the spec and generate their clients themselves (`pnpm gen:api`, run by
  # typecheck, test and build), so a backend change that breaks a client reds
  # those jobs directly. This job no longer regenerates or commits anything.
  # It checks two things and reports a third:
  #
  #   1. The export is deterministic. `scadbuddy.tools.export_openapi` builds
  #      the FastAPI app with `frontend_dir=/nonexistent` and dumps
  #      `app.openapi()` with `indent=2, sort_keys=True`, so two exports of one
  #      tree must be byte-identical. The clients, the image's `api-spec` stage
  #      and the diff below all depend on that.
  #
  #   2. frontend/public/mockServiceWorker.js matches the installed msw. It
  #      stays committed: it is a verbatim copy out of the msw package, not
  #      derived from the API. It embeds `PACKAGE_VERSION` and an
  #      `INTEGRITY_CHECKSUM`, and msw refuses to start when the checksum does
  #      not match the library, so an msw bump that does not re-run `msw init`
  #      breaks `pnpm test` and the Playwright suite. A stale worker fails this
  #      job; nothing is pushed.
  #
  #   3. The API diff against the PR's base, posted as one PR comment that is
  #      edited in place on every push. Without a committed spec nothing in the
  #      PR's own diff shows a contract change, and review still needs to see
  #      it. Reported, never a failure: changing the API is allowed.
  #
  # Deliberately NOT covered:
  #   models/<slug>/model.json — hand-authored catalogue metadata (name,
  #     description, tags, source). The design doc calls it a "params schema
  #     cache" because the RENDERER writes a `schema` key into it at runtime,
  #     keyed by the source's SHA-256 (see library/catalogue.py: "The editable
  #     half of model.json. The renderer owns the schema key."). That half is
  #     runtime state produced by a real openscad against a real data dir, not
  #     a committed build product.
  #   frontend/src/api/types.ts — hand-maintained *aliases* into the generated
  #     schema.d.ts ("export type Job = Schemas['JobStatus']"), so adding or
  #     renaming one is a human act. A backend change that breaks an alias reds
  #     the `frontend` job's typecheck.
  #   frontend/pnpm-lock.yaml, backend/uv.lock — owned by Dependabot and by
  #     `--frozen-lockfile` / `--frozen`, which already fail loudly on drift.
  #
  # PR-only, and ALWAYS on a PR. A push has no base to diff against and no PR
  # to comment on. Never path-gated: `CI Summary` counts a SKIPPED job as
  # satisfied, so a path-gated skip is indistinguishable on the checks UI from
  # a real pass — the vacuous-green trap.
  freshness:
    name: API spec determinism and diff
    # NOT `needs: layout`. This job re-derives which trees exist from its own
    # checkout, for the same reason `CI Summary` does: a job gated on an
    # upstream job's outputs turns that job's failure into empty strings, every
    # step skipping, and a green result that asserted nothing.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      # Can this run post the API diff comment?
      #
      # dependabot[bot]: GitHub gives a Dependabot-triggered `pull_request` run
      # NO repository secrets (its anti-exfiltration measure for bot-authored
      # PRs), so the App id/key resolve empty and the token step would fail.
      # Fork PRs get no secrets either. Both still run every check; the diff
      # goes to the job summary instead of a comment.
      CAN_COMMENT: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      # The eh-homelab org caps the default GITHUB_TOKEN's issue-comment write:
      # a POST to the comments API 403s with "Resource not accessible by
      # integration" even with `pull-requests: write` above. The
      # eh-homelab-org-runners App token is not capped. `client-id`, not the
      # deprecated `app-id`, as in issue-intake.yml and claude-code-review.yml.
      - name: Generate app token
        id: app-token
        if: ${{ env.CAN_COMMENT == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RUNNER_APP_ID }}
          private-key: ${{ secrets.RUNNER_APP_PRIVATE_KEY }}

      # The default `pull_request` checkout: the PR merged into its base. That
      # is the API this PR would ship, which is what the diff should show.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Detect which trees are present
        id: detect
        run: |
          # `if`, not `[ ... ] && ...` — every `run:` block here is `bash -e {0}`
          # and a failing bare test aborts the step. Same trap as `layout`.
          backend=false
          if [ -f backend/pyproject.toml ]; then backend=true; fi
          frontend=false
          if [ -f frontend/package.json ]; then frontend=true; fi
          {
            echo "backend=$backend"
            echo "frontend=$frontend"
          } | tee -a "$GITHUB_OUTPUT"

      # uv resolves the environment from backend/uv.lock, so the exported spec
      # depends on the LOCKED FastAPI/pydantic versions and not on whichever uv
      # did the resolving. openscad is not needed: `export_openapi` only builds
      # the app object.
      #
      # Pinned to a full version, not `@v10`: astral-sh stopped publishing
      # floating major tags after v7 (`v10` does not exist and the job fails at
      # "Set up job" with `unable to find version`). Dependabot's
      # github-actions ecosystem bumps this line.
      - name: Set up uv
        if: ${{ steps.detect.outputs.backend == 'true' }}
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Check the export is deterministic
        if: ${{ steps.detect.outputs.backend == 'true' }}
        working-directory: backend
        run: |
          set -euo pipefail
          uv run --frozen python -m scadbuddy.tools.export_openapi "$RUNNER_TEMP/head.json" >/dev/null
          uv run --frozen python -m scadbuddy.tools.export_openapi "$RUNNER_TEMP/head-again.json" >/dev/null
          if ! cmp -s "$RUNNER_TEMP/head.json" "$RUNNER_TEMP/head-again.json"; then
            echo "::error::Two exports of the same tree differ, so the generated clients are not a function of the source."
            diff -u "$RUNNER_TEMP/head.json" "$RUNNER_TEMP/head-again.json" | head -200 || true
            exit 1
          fi
          echo "Two exports are byte-identical."

      # The base's own tree, in a worktree beside this one, exported with the
      # base's own lockfile, so the diff shows what this PR changes and nothing
      # else.
      - name: Export the base's spec
        if: ${{ steps.detect.outputs.backend == 'true' }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          uv run --directory "$RUNNER_TEMP/base/backend" --frozen \
            python -m scadbuddy.tools.export_openapi "$RUNNER_TEMP/base.json" >/dev/null

      - name: Diff the API against the base
        id: diff
        if: ${{ steps.detect.outputs.backend == 'true' }}
        run: |
          set -uo pipefail
          diff -u --label "main (${BASE_SHA:0:7})" --label "this PR" \
            "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" > "$RUNNER_TEMP/api.diff"
          status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::diff failed (exit $status)"
            exit 1
          fi
          lines=$(grep -c '^[-+][^-+]' "$RUNNER_TEMP/api.diff" || true)
          echo "changed_lines=$lines" | tee -a "$GITHUB_OUTPUT"
          {
            echo "### API diff against main"
            if [ "$lines" -eq 0 ]; then
              echo "No API changes."
            else
              echo '```diff'
              head -c 60000 "$RUNNER_TEMP/api.diff"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the API diff
        if: ${{ steps.diff.outputs.changed_lines != '' && steps.diff.outputs.changed_lines != '0' }}
        uses: actions/upload-artifact@v7
        with:
          name: api-diff
          path: ${{ runner.temp }}/api.diff
          retention-days: 14

      # One comment per PR, found by its marker and edited in place, so a PR
      # pushed ten times carries one current diff and not ten stale ones. No
      # comment is created for a PR that never changed the API; one that did
      # and then reverted it is edited to say so.
      - name: Post the API diff on the PR
        if: ${{ env.CAN_COMMENT == 'true' && steps.diff.outputs.changed_lines != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LINES: ${{ steps.diff.outputs.changed_lines }}
        run: |
          set -euo pipefail
          marker='<!-- scadbuddy-api-diff -->'
          existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          body="$RUNNER_TEMP/comment.md"
          {
            echo "$marker"
            echo "### API changes"
            echo
            if [ "$LINES" -eq 0 ]; then
              echo "No API changes against main as of ${HEAD_SHA:0:7}."
            else
              echo "\`backend/openapi.json\` exported from main (${BASE_SHA:0:7}) and from this PR (${HEAD_SHA:0:7}) merged into it: $LINES changed lines."
              echo
              echo "<details><summary>Diff</summary>"
              echo
              echo '```diff'
              head -c 55000 "$RUNNER_TEMP/api.diff"
              echo '```'
              if [ "$(wc -c < "$RUNNER_TEMP/api.diff")" -gt 55000 ]; then
                echo
                echo "Truncated; the full diff is the run's \`api-diff\` artifact."
              fi
              echo
              echo "</details>"
            fi
          } > "$body"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F "body=@$body" >/dev/null
          elif [ "$LINES" -ne 0 ]; then
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F "body=@$body" >/dev/null
          fi

      # Same Node major and the same corepack-driven pnpm as the `frontend`
      # job, so the msw the worker is copied from is the msw the tests run.
      - uses: actions/setup-node@v7
        if: ${{ steps.detect.outputs.frontend == 'true' }}
        with:
          node-version: "24"

      - name: Enable corepack
        if: ${{ steps.detect.outputs.frontend == 'true' }}
        run: corepack enable

      - name: Install frontend dependencies
        if: ${{ steps.detect.outputs.frontend == 'true' }}
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # `--save` is REQUIRED and is not about saving anything here: without it
      # `msw init` opens an @inquirer prompt asking whether to record the
      # worker directory, and on a runner (no TTY) that aborts with
      # `ExitPromptError: User force closed the prompt`. package.json already
      # carries `msw.workerDirectory: ["public"]`, so the flag rewrites it to
      # the value it already has and produces no diff.
      - name: Check frontend/public/mockServiceWorker.js
        if: ${{ steps.detect.outputs.frontend == 'true' }}
        working-directory: frontend
        run: |
          set -euo pipefail
          pnpm exec msw init public --save
          if ! git diff --quiet -- public/mockServiceWorker.js package.json; then
            git --no-pager diff --stat -- public/mockServiceWorker.js package.json
            echo "::error::frontend/public/mockServiceWorker.js does not match the installed msw. Run 'cd frontend && pnpm exec msw init public --save' and commit the result."
            exit 1
          fi

  # ── The required check ──────────────────────────────────────────────────────
  summary:
    # THIS display name is the required status-check context. Renaming it
    # silently unsatisfiable-ifies branch protection.
    name: CI Summary
    needs: [layout, lint, frontend, agent, image, models, freshness]
    # `!cancelled()`, not a bare `needs:`. A bare `needs:` SKIPS this job when
    # an upstream job fails, and GitHub counts a SKIPPED REQUIRED CHECK AS
    # SATISFIED — a failing build would report green on the one check that
    # gates merge. `!cancelled()` overrides the skip-on-failed-dependency
    # default so the assertions below can turn a failure into a real red. A
    # *cancelled* run still skips, which is right: the superseding run brings
    # its own required check.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Checked out so the assertions can re-derive the layout from the TREE
      # rather than trusting the `layout` job's outputs. That is what closes the
      # bootstrap allowance: a skipped `frontend` job is only acceptable if
      # frontend/ really is absent from this commit, and the only way to know
      # that is to look.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Assert every job either succeeded or was legitimately skipped
        env:
          LAYOUT_RESULT: ${{ needs.layout.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          AGENT_RESULT: ${{ needs.agent.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          MODELS_RESULT: ${{ needs.models.result }}
          FRESHNESS_RESULT: ${{ needs.freshness.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          failed=0

          # $1 job label, $2 its result, $3 "true" when the job was REQUIRED to
          # run on this tree. A skip is accepted only when $3 is false.
          assert() {
            local label="$1" result="$2" required="$3"
            if [ "$result" = "success" ]; then
              echo "  ok       ${label}"
              return 0
            fi
            if [ "$result" = "skipped" ] && [ "$required" != "true" ]; then
              echo "  skipped  ${label} (its source tree is not on this commit yet)"
              return 0
            fi
            echo "::error::${label} concluded '${result}'"
            failed=1
          }

          # Re-derived here, NOT read from needs.layout.outputs: an assertion
          # that trusts the thing it is checking asserts nothing. `if` rather
          # than `[ ... ] && ...` for the `bash -e` reason spelled out in the
          # `layout` job.
          has_backend=false
          if [ -f backend/pyproject.toml ]; then has_backend=true; fi
          has_frontend=false
          if [ -f frontend/package.json ]; then has_frontend=true; fi
          has_agent=false
          if [ -f agent/package.json ]; then has_agent=true; fi
          has_models=false
          if [ -d models ]; then has_models=true; fi
          has_image=false
          if [ "$has_backend" = true ] && [ "$has_frontend" = true ] && [ "$has_models" = true ]; then has_image=true; fi

          # `app` is reported, not asserted: it gates STEPS inside the image
          # job, not a job of its own. It needs no assertion — when the API
          # entrypoint lands, those steps run, and any failure reds the image
          # job, which IS asserted below.
          has_app=false
          if [ -f backend/scadbuddy/main.py ]; then has_app=true; fi

          echo "Tree on this commit: backend=${has_backend} frontend=${has_frontend} agent=${has_agent} models=${has_models} image=${has_image}"
          echo "Container smoke gated on the API entrypoint: app=${has_app}"
          echo "Job results:"
          assert "Detect layout"                          "$LAYOUT_RESULT"   true
          assert "Workflow and Dockerfile lint"           "$LINT_RESULT"     true
          assert "Frontend lint, typecheck, test, build"  "$FRONTEND_RESULT" "$has_frontend"
          assert "Agent lint, typecheck, test, build, image" "$AGENT_RESULT" "$has_agent"
          assert "Image build, backend checks, container smoke, real-backend e2e" "$IMAGE_RESULT" "$has_image"
          assert "Template verify scripts"                "$MODELS_RESULT"   "$has_models"

          # `freshness` is PR-only — it diffs the API against the PR's base and
          # comments on the PR, and a push to main has neither. It is therefore
          # REQUIRED on a pull_request and legitimately skipped on a push, and
          # it is never path-gated: a skip that this job counts as satisfied is
          # indistinguishable from a real pass, which is the whole reason the
          # third argument exists.
          is_pr=false
          if [ "$EVENT_NAME" = "pull_request" ]; then is_pr=true; fi
          assert "API spec determinism and diff"         "$FRESHNESS_RESULT" "$is_pr"

          if [ "$failed" -ne 0 ]; then
            echo "::error::CI Summary failed — see the job results above."
            exit 1
          fi
          echo "All required jobs succeeded."

  # ── Hand off to the Claude review merge gate ────────────────────────────────
  #
  # `needs:` cannot cross workflow files, so claude-code-review.yml is
  # `workflow_dispatch`-only and this job dispatches it. Ordering it behind the
  # CI jobs means the review reads a tree whose tests have already reported,
  # and keeps a ~$1-2 agent run from starting on a push that a later push in
  # the same minute supersedes. It is NOT a quality gate — a red CI still gets
  # a review, because that is exactly when a review is most useful.
  #
  # Dispatch, never poll. A polling job burns wall-clock holding a runner for
  # something it cannot influence; on a capped self-hosted pool that is a real
  # deadlock, and even on hosted runners it is just a job that does nothing.
  dispatch-review:
    name: Dispatch Claude Code Review
    needs: [lint, frontend, agent, image, models, summary]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A job-level `permissions:` block REPLACES the workflow default rather than
    # extending it, so every scope this job uses is listed.
    permissions:
      # workflow_dispatch of claude-code-review.yml.
      actions: write
      # The `claude-review` COMMIT STATUS seeded below. That context is the
      # repo's second required check; claude-code-review.yml publishes its
      # terminal value. It has to be a commit status and not a check run:
      # branch protection evaluates the PR's status rollup, and a
      # workflow_dispatch run's check suite is not associated with the PR, so
      # its check runs never reach that rollup — green on the commit, invisible
      # to the gate, read as never reported.
      statuses: write
      # Resolving the LIVE head sha, rather than trusting the event payload.
      pull-requests: read
    steps:
      # Seeded BEFORE the dispatch, and the order is load-bearing rather than
      # stylistic: statuses are last-write-wins per context, so seeding after
      # `gh workflow run` could overwrite the dispatched review's terminal
      # `success` with `pending` and leave the PR blocked until something
      # dispatched again.
      - name: Seed the claude-review status as pending
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq .head.sha)"
          gh api -X POST "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f context=claude-review \
            -f description="Review dispatched; waiting for the merge gate." \
            -f target_url="$RUN_URL" >/dev/null

      - name: Dispatch Claude Code Review
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # PR-author-controlled values go through env, never interpolated into
          # the script: a branch name can contain shell metacharacters.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail

          if gh workflow run claude-code-review.yml \
               --repo "$REPO" \
               --ref "$HEAD_REF" \
               -f pr_number="$PR_NUMBER"; then
            echo "dispatched=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # BOOTSTRAP ONLY. workflow_dispatch requires the workflow to exist on
          # the DEFAULT BRANCH, so on the very PR that introduces
          # claude-code-review.yml the dispatch necessarily 404s. Distinguish
          # that one case from a real dispatch failure by asking whether the
          # file is on the default branch; anything else is a genuine error.
          # This branch stops being reachable the moment this PR merges.
          if gh api "repos/${REPO}/contents/.github/workflows/claude-code-review.yml?ref=${DEFAULT_BRANCH}" \
               --silent >/dev/null 2>&1; then
            echo "::error::Dispatch of claude-code-review.yml failed even though it exists on ${DEFAULT_BRANCH}."
            exit 1
          fi

          echo "::warning::claude-code-review.yml is not on ${DEFAULT_BRANCH} yet, so it cannot be dispatched. This is the bootstrap PR that adds it."
          echo "dispatched=false" >> "$GITHUB_OUTPUT"

      # Only reachable on the bootstrap PR described above. Left green
      # deliberately: the merge gate cannot review a workflow that the default
      # branch has never seen, and the `ScadBuddy/main` ruleset is not declared
      # in eh-homelab/clusters' `infra/github/eh-homelab/main.tf` until after
      # this PR merges.
      - name: Clear the claude-review status on the bootstrap PR
        if: ${{ steps.dispatch.outputs.dispatched == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq .head.sha)"
          gh api -X POST "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context=claude-review \
            -f description="Bootstrap: claude-code-review.yml is not on the default branch yet." \
            -f target_url="$RUN_URL" >/dev/null

      # Without this the required `claude-review` context would sit pending
      # forever whenever the dispatch itself died — blocking, with nothing to
      # point at. Not best-effort: a status POST that fails silently is the
      # failure mode this exists to remove.
      - name: Red the claude-review status when no review was dispatched
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq .head.sha)"
          gh api -X POST "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state=failure \
            -f context=claude-review \
            -f description="No review was dispatched (see Dispatch Claude Code Review)." \
            -f target_url="$RUN_URL" >/dev/null
