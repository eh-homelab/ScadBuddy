# The agent-durable plugin pin is a commit that only an open draft PR
# (temporalio/ai-integrations#33) references, so a force-push or close can make
# it unreachable and GitHub may collect it (spec 2026-10-01 §6.2). Images already
# built keep the package; a vanished commit stops rebuilds. Remedy: a reviewed
# bump to the PR's new head, or to the PyPI release.
name: agent-durable pin

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Fetch the pinned commit
        id: lock
        run: .github/scripts/agent-durable-pin.sh agent-durable
      - name: Open an issue
        if: failure() && steps.lock.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="agent-durable: the ai-integrations pin no longer resolves"
          if gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number' | grep -q .; then
            echo "already open"; exit 0
          fi
          gh issue create --title "$title" --label dependencies --body \
            "The weekly pin check (\`.github/scripts/agent-durable-pin.sh\`: \`uv lock --check\`, then a no-cache \`uv sync\` that fetches the pinned commit) failed: $RUN_URL. The pinned commit of temporalio/ai-integrations#33 may have been force-pushed away. Running images are unaffected; rebuilds fail. Bump the pin to the PR's current head (or the PyPI release) in a reviewed PR that carries the diff of \`python/claude_agent_sdk\` (spec 2026-10-01 §6.2)."
