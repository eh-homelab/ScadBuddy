# Markdown links in docs/, README.md, each CLAUDE.md and every SKILL.md must resolve
# (#1926, from #259). Weekly and on demand only, never on a PR, so an external
# site going down never blocks a merge; it is not a required check. A failure
# opens (or leaves open) one issue. Fix the link, or exclude it in the args
# below with a comment saying why. A GitHub comment anchor (#issuecomment-) is
# already excluded from lychee and checked by the "GitHub comment anchors" step:
# fix the link, or skip its repository in that step's `grep -vE`. The `release-asset-pins` job, on the same
# schedule, checks the second URLs the release downloads fall back to (#5706).
name: Link check

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # v2.9.0, which runs lychee v0.24.2. --include-fragments also checks
      # #anchors, in-repo ones included. 429 is a rate limit, not a dead link.
      # Excluded, each a live page that answers a bot with an error (#2622):
      #   npmjs.com and makerworld.com answer 403 to any client without a
      #   browser's cookies (bot protection), whatever the page. Nothing checks
      #   those links now, so a renamed package or a removed MakerWorld model
      #   goes unflagged: check them by hand when editing a file that has one,
      #   in docs/ (docs/user-guide.md and the AI integration spec today) or
      #   elsewhere;
      #   github.com/eh-homelab/clusters is a private repository, a 404 to an
      #   unauthenticated request. Only that repository: the pattern ends at a
      #   path, query or fragment, so an eh-homelab/clusters-* one is checked;
      #   the WonderForgeLabs organisation is private too (its discussions, the
      #   fleet's testing handoff, answer 404 to an unauthenticated request, #4365);
      #   *.internal.nullreference.io are the homelab's LAN-only hosts, which a
      #   GitHub runner cannot reach (every one times out);
      #   developer.paypal.com API reference links with a #fragment: the page
      #   builds its anchors in the browser, so the served HTML has none and
      #   --include-fragments reports "Cannot find fragment" for a live anchor
      #   (#5856; checked 2026-11-11, the orders v2 page's HTML has no
      #   orders_patch). Other PayPal links, apart from the help articles below,
      #   are still checked, and the next two steps check the excluded API pages
      #   themselves, without their fragments (#6084);
      #   www.paypal.com help articles (/<country>/cshelp/) answer 403 to any
      #   client without a browser's cookies, a browser User-Agent included
      #   (#6518; checked 2026-11-17 with curl, the eCheck article in README.md).
      #   Nothing checks those links now: check them by hand when editing a file
      #   that has one (README.md today);
      #   GitHub issue and PR comment anchors (#issuecomment-<id>): on a long
      #   thread GitHub serves the first and last comments and loads the rest in
      #   the browser, so a live comment's anchor is not in the HTML (#6518;
      #   checked 2026-11-17, #5283 has 31 comments and its page has no
      #   issuecomment-6757727525, which the API still serves). Other links to
      #   those threads, with no comment anchor, are still checked, and the
      #   "GitHub comment anchors" step below checks each excluded comment on a
      #   public repository with the REST API (#6551).
      - name: lychee
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --include-fragments
            --max-concurrency 16
            --accept '100..=103,200..=299,429'
            --exclude '^https://www\.npmjs\.com/'
            --exclude '^https://makerworld\.com/'
            --exclude '^https://github\.com/eh-homelab/clusters([/?#]|$)'
            --exclude '^https://github\.com/(orgs/)?WonderForgeLabs([/?#]|$)'
            --exclude '^https?://[^/]*\.internal\.nullreference\.io'
            --exclude '^https://developer\.paypal\.com/docs/api/[^#]*#'
            --exclude '^https://www\.paypal\.com/[a-z]{2}/cshelp/'
            --exclude '^https://github\.com/[^#]+#issuecomment-[0-9]+$'
            'docs/**/*.md' README.md CLAUDE.md '**/SKILL.md'
            backend/CLAUDE.md frontend/CLAUDE.md agent/CLAUDE.md agent-durable/CLAUDE.md
            tools/go/CLAUDE.md workers/rust/CLAUDE.md e2e-stack/CLAUDE.md models/CLAUDE.md
            deploy/CLAUDE.md plugins/CLAUDE.md
          fail: true
      # The pages behind the PayPal links excluded above, each once and without its
      # fragment, so a page that moved or answers 404 still fails the check (#6084).
      # The list comes from the files lychee reads above, so a new such link is
      # covered. `:(glob)` makes `**/` match zero or more directories, as lychee's
      # globs do; without it, git's pathspec skips docs/*.md.
      - name: Collect the excluded PayPal pages
        id: paypal_pages
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git ls-files -z -- ':(glob)docs/**/*.md' README.md CLAUDE.md ':(glob)**/SKILL.md' \
            backend/CLAUDE.md frontend/CLAUDE.md agent/CLAUDE.md agent-durable/CLAUDE.md \
            tools/go/CLAUDE.md workers/rust/CLAUDE.md e2e-stack/CLAUDE.md models/CLAUDE.md \
            deploy/CLAUDE.md plugins/CLAUDE.md \
            | xargs -0 grep -hoE 'https://developer\.paypal\.com/docs/api/[^#)> ]*#' \
            | sed 's/#$//' | sort -u > paypal-pages.txt || true
          cat paypal-pages.txt
          if [ -s paypal-pages.txt ]; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
      - name: lychee (the excluded PayPal pages, no fragments)
        id: lychee_paypal
        if: ${{ !cancelled() && steps.paypal_pages.outputs.found == 'true' }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --accept '100..=103,200..=299,429'
            paypal-pages.txt
          # Its own report, so the first pass's lychee/out.md stays.
          output: lychee/paypal.md
          fail: true
      # The GitHub comment anchors excluded above (#6551): each comment must still
      # exist on the thread its link names. The REST API serves a comment by id
      # whatever the thread's length; its issue_url names the thread, so an anchor
      # copied onto the wrong thread fails too. The private repositories lychee
      # excludes are skipped: the job's token cannot read them. Only a 404 fails the
      # step. Any other API error (a 5xx, a rate limit) is a warning, as lychee
      # accepts a 429, so an outage does not open a "broken links" issue. Each
      # result also goes to the job summary.
      - name: GitHub comment anchors
        id: comment_anchors
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git ls-files -z -- ':(glob)docs/**/*.md' README.md CLAUDE.md ':(glob)**/SKILL.md' \
            backend/CLAUDE.md frontend/CLAUDE.md agent/CLAUDE.md agent-durable/CLAUDE.md \
            tools/go/CLAUDE.md workers/rust/CLAUDE.md e2e-stack/CLAUDE.md models/CLAUDE.md \
            deploy/CLAUDE.md plugins/CLAUDE.md \
            | xargs -0 grep -hoE 'https://github\.com/[^/ )>#]+/[^/ )>#]+/(issues|pull)/[0-9]+#issuecomment-[0-9]+' \
            | grep -vE '^https://github\.com/(eh-homelab/clusters|WonderForgeLabs)/' \
            | sort -u > comment-anchors.txt || true
          summary=${GITHUB_STEP_SUMMARY:-/dev/null}
          bad=0
          report() { echo "::$1::$2"; echo "- $1: $2" >> "$summary"; }
          [ -s comment-anchors.txt ] && echo "### GitHub comment anchors" >> "$summary"
          while read -r url; do
            repo=$(cut -d/ -f4,5 <<<"$url")
            thread=$(sed -E 's,.*/(issues|pull)/([0-9]+)#.*,\2,' <<<"$url")
            id=${url##*issuecomment-}
            if on=$(gh api "repos/$repo/issues/comments/$id" --jq '.issue_url | split("/") | last' </dev/null 2>gh-err.txt); then
              if [ "$on" = "$thread" ]; then
                echo "ok $url"
              else
                report error "$url: the comment is on #$on, not #$thread"; bad=1
              fi
            elif grep -q 'HTTP 404' gh-err.txt; then
              report error "$url: no such comment"; bad=1
            else
              report warning "$url: not checked, the API failed: $(head -c 200 gh-err.txt)"
            fi
          done < comment-anchors.txt
          exit "$bad"
      - name: Open an issue
        if: failure() && (steps.lychee.outcome == 'failure' || steps.lychee_paypal.outcome == 'failure' || steps.comment_anchors.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Link check: broken Markdown links"
          if gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number' | grep -q .; then
            echo "already open"; exit 0
          fi
          gh issue create --title "$title" --label documentation --body \
            "The weekly link check (\`.github/workflows/link-check.yml\`) found broken links in \`docs/\`, \`README.md\`, a \`CLAUDE.md\` or a \`SKILL.md\`: $RUN_URL (the job summary lists them). Fix each link, or exclude it in the workflow's lychee args with a comment giving the reason. A failing GitHub comment anchor (\`#issuecomment-\`) is already excluded from lychee: fix the link, or skip its repository in the \`grep -vE\` of the \"GitHub comment anchors\" step."

  # The release downloads fall back to a REST API asset URL (#5706), pinned by asset id
  # beside each version and sha256, or for the amd64 Temporal CLI to temporal.download.
  # The fallback runs only in an outage, so an id a bump left behind, or an archive path
  # that moved, would show up only then: this fetches each one weekly and checks its
  # sha256.
  release-asset-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Check the pinned release asset ids
        id: pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-asset-pins.sh .
      - name: Open an issue
        if: failure() && steps.pins.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Release asset pins: a fallback URL no longer serves its sha256"
          if gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number' | grep -q .; then
            echo "already open"; exit 0
          fi
          gh issue create --title "$title" --body \
            "The weekly check (\`.github/scripts/release-asset-pins.sh\`, from \`link-check.yml\`) found a fallback URL that does not serve its pinned sha256: $RUN_URL. For a REST API asset, set the asset id beside that version in the Dockerfile or ci.yml (\`gh api repos/<owner>/<repo>/releases/tags/<tag>\` lists them). For temporal.download, find where Temporal now serves the archive."
