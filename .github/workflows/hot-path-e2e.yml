# The native hot path against a real stack (#3818 tier A, plan 2026-10-18 Task 13,
# #4593): e2e-stack/run.sh --mode both brings up ScadBuddy with the S3 store, its own
# library and the native slicer worker, a fake LAN printer and a Bambuddy that fails
# every call, and runs frontend/e2e/real-hot-path.spec.ts twice: with the recorder as
# bambuddy_url (AC1: it sees no call) and with none (AC2). A recorder pass that fails
# names the calls it saw: that is AC1's check working, not a flake (#4629 removed the
# last ones, from the dialog's analyzers and the Prints page).
#
# No job here is a required check: none is in ci.yml's `CI Summary` needs (plan
# decision 6). The `stack` job runs weekly and on demand, never on a PR: it builds three
# images and prints twice. On a PR that touches e2e-stack/, the native path's code, its
# tests or this file only the `fakes` and `native` jobs run: the two fakes' own tests and ruff over e2e-stack/ (#4187, below), a
# minute's work, and the backend's tests that drive a native run against the fake
# printer (#4541, below).
#
# #4541: those tests (`tests/test_print_native_workflow.py`, `tests/api/test_hot_path_native.py`,
# among them the AC1 check that a native run builds no Bambuddy client) need the fake
# printer, and so mosquitto and e2e-stack/, as well as Postgres and Temporal: every
# backend-pytest shard skips them, for #4187's reason. The `native` job runs them here,
# on a runner with all four, and fails if any skips.
#
# #4187, settled here rather than in backend-pytest: the fake printer's test needs
# mosquitto, which the test image does not carry, and mounting e2e-stack/ into the four
# backend-pytest shards would still skip it. Installing mosquitto on this runner keeps
# the test image, and so every backend-pytest shard and its cache, unchanged, at the cost
# of the tests running only here: on a PR that touches what they test, weekly, and on
# demand.
name: Hot path e2e

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 3"
  pull_request:
    paths:
      - e2e-stack/**
      - backend/tests/printers/test_fake_printer.py
      - backend/tests/test_bambuddy_recorder.py
      - .github/workflows/hot-path-e2e.yml
      # What a native run reads and the tests that drive one (`native`, #4541).
      - backend/scadbuddy/printers/**
      - backend/scadbuddy/slicing/**
      - backend/scadbuddy/spools/**
      - backend/scadbuddy/print_library/**
      - backend/scadbuddy/bambuddy/**
      - backend/scadbuddy/analyzers/**
      - backend/scadbuddy/api/analyzers.py
      - backend/scadbuddy/api/printing.py
      - backend/scadbuddy/api/printers.py
      - backend/scadbuddy/api/prints.py
      - backend/scadbuddy/api/library_print.py
      - backend/scadbuddy/workflows/client.py
      - backend/scadbuddy/workflows/print*.py
      - backend/scadbuddy/workflows/slicing*.py
      - backend/tests/support/fake_lan.py
      - backend/tests/test_print_native_workflow.py
      - backend/tests/api/test_hot_path_native.py

permissions:
  contents: read

concurrency:
  group: hot-path-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fakes:
    name: The stack's fakes, tested and linted
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Ubuntu's mosquitto 2, as the fake printer's image has Debian's.
      - name: Install mosquitto
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends mosquitto

      - name: ruff over e2e-stack
        working-directory: backend
        run: |
          uv run --frozen ruff check --config pyproject.toml ../e2e-stack
          uv run --frozen ruff format --check --config pyproject.toml ../e2e-stack

      - name: mypy over the fakes
        working-directory: backend
        run: >-
          uv run --frozen mypy --strict --ignore-missing-imports
          ../e2e-stack/fake-printer/printer.py ../e2e-stack/bambuddy-recorder/recorder.py

      # Both files skip when what they need is missing; here nothing may.
      - name: The fakes' tests
        working-directory: backend
        run: |
          set -euo pipefail
          uv run --frozen pytest -p no:cacheprovider -rs \
            tests/printers/test_fake_printer.py tests/test_bambuddy_recorder.py | tee "$RUNNER_TEMP/fakes.txt"
          if grep -qiE '[0-9]+ skipped' "$RUNNER_TEMP/fakes.txt"; then
            echo "::error::a fake's test skipped: each one must run here"
            exit 1
          fi

  native:
    name: Native runs against the fake printer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scadbuddy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install mosquitto
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends mosquitto

      # The same CLI as ci.yml's `agent` job and the Dockerfile's `test` stage
      # (TEMPORAL_CLI_VERSION, TEMPORAL_CLI_SHA256_AMD64); bump together. The tests start
      # their own dev servers from it.
      - name: Install the Temporal CLI
        env:
          TEMPORAL_CLI_VERSION: 1.9.1
          TEMPORAL_CLI_SHA256: 09a0326a51db84d02735e53542b9ebd8c4758daf47482a9ab0abce15844e60d5
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/temporal-cli.tar.gz" \
            "https://github.com/temporalio/cli/releases/download/v${TEMPORAL_CLI_VERSION}/temporal_cli_${TEMPORAL_CLI_VERSION}_linux_amd64.tar.gz"
          echo "${TEMPORAL_CLI_SHA256}  $RUNNER_TEMP/temporal-cli.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/temporal-cli.tar.gz" -C "$RUNNER_TEMP" temporal
          "$RUNNER_TEMP/temporal" --version

      # Each file skips when what it needs is missing; here nothing may. Counted from the
      # JUnit report, which does not depend on how pytest words its summary line.
      - name: The native tests
        working-directory: backend
        env:
          SCADBUDDY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/scadbuddy_test
          SCADBUDDY_TEST_TEMPORAL_DEV_SERVER: ${{ runner.temp }}/temporal
        run: |
          set -euo pipefail
          uv run --frozen pytest -p no:cacheprovider -rs -n 4 --junitxml="$RUNNER_TEMP/native.xml" \
            tests/test_print_native_workflow.py tests/api/test_hot_path_native.py
          skipped=$(grep -c '<skipped' "$RUNNER_TEMP/native.xml" || true)
          if [ "$skipped" != 0 ]; then
            echo "::error::$skipped native test(s) skipped: each one must run here"
            exit 1
          fi

  stack:
    name: The hot path on a real stack (recorder, then unset)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: docker/setup-buildx-action@v4
        # Google's Docker Hub mirror: Docker Hub refuses some anonymous pulls (#3370).
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      # Read the scopes ci.yml and build-image.yml write (the default one for the app's
      # layers, `slicer` for the Rust build), and write this workflow's own at mode=min:
      # the repo's Actions cache is at its ceiling (#743).
      - name: Build the app image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          tags: scadbuddy:hot-path-app
          cache-from: |
            type=gha
            type=gha,scope=hot-path-app
          cache-to: type=gha,scope=hot-path-app,mode=min

      # The Temporal dev server and moto. A superset of `runtime`, so almost free after it.
      - name: Build the test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          load: true
          tags: scadbuddy:hot-path-test
          cache-from: |
            type=gha
            type=gha,scope=hot-path-app

      - name: Build the slicer image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: slicer
          load: true
          tags: scadbuddy-slicer:hot-path
          cache-from: |
            type=gha,scope=slicer
            type=gha,scope=hot-path-slicer
          cache-to: type=gha,scope=hot-path-slicer,mode=min

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # `pnpm install` needs no spec; Playwright never runs `gen:api`.
      - name: Enable corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: run.sh --mode both
        run: e2e-stack/run.sh --mode both --no-build

      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-hot-path
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore
