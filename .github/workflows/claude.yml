---
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Serialize per issue/PR. This agent has `contents: write` and can push commits
# to a PR branch, so two @claude mentions on the same thread (a review with
# several comments submits several events at once) must not run concurrently —
# they would race on the same branch. cancel-in-progress:false because
# cancelling mid-run can leave a half-applied edit committed but not pushed;
# queueing costs a few minutes and is always safe.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # The trust gate is a JOB, not an `if:` on the agent job, and that split is the
  # whole point. A job skipped by `if:` leaves NO logs — GitHub keeps job-condition
  # expression logs (the Evaluating/Expanded/Result lines in system.txt) only for
  # jobs that actually ran, and the log archive for a skipped job downloads as an
  # empty zip. So a gate that silently mis-evaluates is undiagnosable after the
  # fact. This job runs whenever a mention is present and prints what it saw.
  #
  # Why that matters: in eh-homelab/clusters the previous single-`if:` gate keyed
  # entirely on `author_association`, and on 2026-08-15 an `@claude` in a *review*
  # comment (PR #986 — an org MEMBER per the REST API) skipped silently, while the
  # identical mention as a top-level comment had worked. That field is not
  # populated the same way across event shapes, and `contains(array, null)` is
  # false with no error. Every skipped run's evidence was already gone.
  #
  # `author_association` has a second, independent blind spot this gate sidesteps:
  # it under-reports a member whose org membership is PRIVATE as `NONE`. The
  # collaborator-permission endpoint below does not, and needs no `members:read`
  # to get it right (verified live in eh-homelab 2026-09-19), which is why the
  # permission path is the one that actually decides.
  gate:
    # Mention only — deliberately NOT the trust check. Trust is decided in a step
    # below so its inputs are logged.
    if: |
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude')
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude')
      ) || (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude')
      ) || (
        github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.trust.outputs.allowed }}
    steps:
      - name: Decide whether the actor may drive the agent
        id: trust
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          ASSOC_COMMENT: ${{ github.event.comment.author_association }}
          ASSOC_REVIEW: ${{ github.event.review.author_association }}
          ASSOC_ISSUE: ${{ github.event.issue.author_association }}
        run: |
          # NOTE: Actions runs every `run:` block as `bash -e {0}`; `set -uo
          # pipefail` only ADDS flags and cannot remove that -e. Any command
          # whose non-zero exit is expected must carry `|| true`.
          set -uo pipefail

          echo "event=${EVENT} actor=${ACTOR}"
          echo "author_association: comment='${ASSOC_COMMENT}' review='${ASSOC_REVIEW}' issue='${ASSOC_ISSUE}'"

          assoc=""
          case "$EVENT" in
            issue_comment|pull_request_review_comment) assoc="$ASSOC_COMMENT" ;;
            pull_request_review)                      assoc="$ASSOC_REVIEW" ;;
            issues)                                   assoc="$ASSOC_ISSUE" ;;
          esac

          by_assoc=false
          case "$assoc" in
            OWNER|MEMBER|COLLABORATOR) by_assoc=true ;;
          esac

          # Second, independent path. author_association is absent or empty in
          # some event payloads; repo permission is not, so it covers the shapes
          # the association check cannot. A 403/404 here (the token may lack the
          # scope) leaves this false rather than failing the job — the
          # association path still stands on its own.
          perm="$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" --jq .permission 2>/dev/null || true)"
          by_perm=false
          case "$perm" in
            admin|maintain|write) by_perm=true ;;
          esac

          echo "resolved association='${assoc}' -> ${by_assoc}"
          echo "repo permission='${perm}' -> ${by_perm}"

          if [ "$by_assoc" = true ] || [ "$by_perm" = true ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@claude accepted for ${ACTOR} (association=${by_assoc} permission=${by_perm})"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::@claude ignored: ${ACTOR} is not a repo owner/member/collaborator (association='${assoc}' permission='${perm}')."
          fi

  claude:
    needs: gate
    # Trust gate: only repo owners/members/collaborators can invoke the
    # write-capable agent (the @claude mention alone is not enough). Stops an
    # unprivileged commenter from driving the elevated bot.
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Enable creating commits and pushing changes
      pull-requests: write # Enable creating and modifying PRs
      issues: write # Enable creating and modifying issues
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@0a8d3c9443bbff909ab973b6a17a340b913f229f # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # issues: write + gh / github-MCP issue tools, so @claude can create
          # and modify GitHub issues from a PR comment.
          #
          # Standing repo instructions ride along via --append-system-prompt:
          # claude-code-action v1 removed the `custom_instructions` input
          # (WonderForgeLabs/forge#2663 — same action, different repo), so a `custom_instructions:` key now
          # only emits an "Unexpected input" warning and silently drops the
          # instructions. The single-quoted block below carries what
          # `custom_instructions` used to. NOTE: the claude_args parser strips
          # any line whose first non-whitespace char is '#', so keep this plain
          # text with no Markdown '#' headings.
          claude_args: |
            --max-turns 50 --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,mcp__github__update_issue,mcp__github__create_issue,Bash(git:*),Bash(gh:*),Bash(shellcheck:*),Bash(jq:*),Bash(yq:*),Bash(ls:*),Bash(find:*)" --model "claude-sonnet-5"
            --append-system-prompt 'This is ScadBuddy: a self-hosted OpenSCAD customizer that reproduces MakerWorld Parametric Model Maker inside Bambuddy. One container, one pod, one PVC. No database.

            Layout:
            - backend/ - Python 3.12, FastAPI, Pydantic v2, managed with uv. Package `scadbuddy`. Serves the API under /api/v1 and the built frontend bundle.
            - frontend/ - TypeScript, React 19, Vite, react-three-fiber, Tailwind, managed with pnpm.
            - models/ - example .scad models shipped with the repo.
            - docs/superpowers/specs/2026-09-22-scadbuddy-design.md - the approved design spec. Read it before changing behaviour; its section 3 records facts MEASURED against one OpenSCAD build.

            Conventions:
            - Backend checks: cd backend && uv sync --frozen && uv run ruff check . && uv run ruff format --check . && uv run mypy && uv run pytest
            - Frontend checks: cd frontend && pnpm install --frozen-lockfile && pnpm lint && pnpm typecheck && pnpm test && pnpm build
            - Integration tests that need a real openscad binary are marked requires_openscad and only run inside the container image.
            - Only the script font family "Lobster Two" exists in the image; there is no family called "Lobster".
            - CI runs on GitHub-hosted ubuntu-latest on purpose. This repo is public and the eh-homelab self-hosted pools are on the homelab LAN, so never move a job onto clusters-runner*.
            - Every GitHub Actions run: block is bash -e, so a no-match grep aborts the step. Any grep in a change gate needs || true.'
