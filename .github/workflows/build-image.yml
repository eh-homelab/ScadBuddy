---
name: Build Image

# Publishes ghcr.io/eh-homelab/scadbuddy for the cluster to pull, and the AI
# agent sidecar as ghcr.io/eh-homelab/scadbuddy-agent (the `agent` job below), and
# its durable-sessions twin as ghcr.io/eh-homelab/scadbuddy-agent-durable (the
# `agent-durable` job). Every one of these packages must be made public, like the
# first (see below): a new package starts private.
#
# THE PACKAGE MUST BE PUBLIC. Nodes on the target cluster pull ghcr.io through
# an ANONYMOUS Nexus proxy (`ghcr-proxy`), so a per-pod imagePullSecret
# authenticates the wrong hop and cannot pull a private package — the same
# reason `actions-runner` and `dind-preload` are public. Package visibility is
# a one-time GitHub UI step (Packages -> scadbuddy -> Package settings ->
# Change visibility); it cannot be set from a workflow. If a node ever reports
# `denied` / `unauthorized` pulling this image, check visibility FIRST.
#
# The publish jobs do not run on pull_request: a PR has no GHCR write token,
# and ci.yml already builds the same Dockerfile (both targets) on every PR. But
# ci.yml builds amd64 only, so the one PR-time job here, `openscad-lsp-arm64`,
# builds the arm64 leg of the `openscad-lsp` stage under QEMU and runs the
# binary (#199). It is not a required check (the required one is ci.yml's
# "CI Summary", which cannot `needs:` a job in another workflow), so a red run
# is visible on the PR but does not block the merge by itself.
#
# This workflow only PUBLISHES. Deploying is a separate step so it can be
# switched off without touching the build: deploy-main.yml (workflow_run on
# this workflow) deploys every default-branch build, deploy-release.yml
# (release: published) deploys tagged releases. Both call
# deploy.reusable.yml, which pins the digest in eh-homelab/clusters.

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Only the `openscad-lsp-arm64` job runs for a PR. The stage copies nothing
  # from the build context, so the Dockerfile and this file are all it reads.
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/build-image.yml
  workflow_dispatch:

# Never cancel a publish. Two concurrent pushes to main would otherwise race on
# the `main` tag and the shared buildcache, and a cancelled push leaves a
# half-written manifest list behind. A PR run publishes nothing, so a newer
# push to the PR cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and push (amd64 + arm64)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    # No job outputs on purpose: the only downstream consumer, deploy-main.yml,
    # is triggered by `workflow_run`, which cannot read another run's outputs.
    # It re-derives `sha-<short>` from the run's head_sha under the 7-character
    # contract pinned and asserted below, and reads the digest off GHCR.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # arm64 is emulated: ubuntu-latest is amd64, so binfmt handlers are what
      # make the second architecture possible at all. The spec pins the workload
      # to amd64 nodes today, but the base image is multi-arch and the estate
      # has arm64 hardware (wingnut), so building both keeps that door open at
      # the cost of build minutes, not of correctness.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        env:
          # The `sha-<short>` tag is the contract with the deploy pipeline:
          # "Pick the deploy label" below and deploy-main.yml both take the
          # first 7 characters of the commit. Pin the action's short length to
          # the same 7 rather than inherit its default, and the step below
          # asserts the two agree on every build. The variable is documented
          # in docker/metadata-action's README ("Environment variables":
          # "Specifies the length of the short commit SHA … Default is 7").
          DOCKER_METADATA_SHORT_SHA_LENGTH: "7"
        with:
          images: ghcr.io/eh-homelab/scadbuddy
          # `sha-<short>` is the one tag the cluster manifests should pin to —
          # it is immutable, unlike `main`. `main` exists for humans and for
          # `docker run` convenience. The semver tags come from `v*` pushes.
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=ScadBuddy
            org.opencontainers.image.description=Self-hosted OpenSCAD customizer for Bambuddy
            org.opencontainers.image.licenses=Apache-2.0

      # The label the deploy pipeline pins, and what /healthz reports as
      # `version`: `X.Y.Z` for a `vX.Y.Z` tag, `sha-<short>` for anything
      # else. Not metadata-action's `version` output — that is the PRIMARY
      # tag, which on the default branch is the constant `main`, so every
      # continuous deploy would stamp the same value while clusters pinned
      # `sha-<short>`, and the two could never be compared.
      - name: Pick the deploy label
        id: label
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          if [[ "$REF" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
          elif [[ "$REF" == refs/tags/* ]]; then
            # The trigger is `v*`, which also admits `v1.2.3-rc1` or `v2`.
            # Those are not releases deploy-release.yml would accept, and
            # labelling them `sha-<short>` would hide the mismatch — refuse.
            echo "::error::tag '${REF#refs/tags/}' is not vX.Y.Z; only strict semver tags are built"; exit 1
          else
            version="sha-${SHA:0:7}"
          fi
          # The label must be one of the tags about to be pushed, or the
          # deploy pipeline would look for an image that does not exist.
          grep -qxF "ghcr.io/eh-homelab/scadbuddy:${version}" <<<"$TAGS" \
            || { echo "::error::deploy label '$version' is not among the tags metadata-action produced:"; echo "$TAGS"; exit 1; }
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          # `runtime`, explicitly. The Dockerfile's last stage IS runtime, so
          # this is belt and braces — but a future stage appended below it would
          # otherwise silently become the published image.
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamped into the image and reported by /healthz: the commit, and
          # the same label the deploy pipeline pins (see "Pick the deploy
          # label" above).
          build-args: |
            SCADBUDDY_REVISION=${{ github.sha }}
            SCADBUDDY_VERSION=${{ steps.label.outputs.version }}
          provenance: false
          # `type=gha`, viable only because this is a GitHub-hosted runner —
          # the Actions cache protocol fails outright on the eh-homelab
          # self-hosted pools (it fails the build, it does not degrade).
          # Mechanism unconfirmed; see ci.yml's header for the measurements
          # either way. Writing from the default branch is what gives
          # PRs a warm cache, since Actions cache scoping lets a PR read the
          # default branch's entries.
          #
          # mode=max caches intermediate stages, which is what makes the
          # frontend and dependency layers survive between runs. Two
          # architectures at mode=max is the biggest consumer of the repo's
          # 10 GB Actions cache ceiling — if entries start evicting before they
          # are reused, move this one leg to
          # `type=registry,ref=ghcr.io/eh-homelab/scadbuddy:buildcache`, which
          # has no ceiling and sits next to the image being pushed anyway.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The digest is what a GitOps manifest should pin, and it is otherwise
      # buried in the build log. Printed to the step summary so it can be
      # copied straight into eh-homelab/clusters.
      - name: Report the published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          {
            echo "### Published \`ghcr.io/eh-homelab/scadbuddy\`"
            echo
            echo "**Digest:** \`${DIGEST}\`"
            echo
            echo "**Tags:**"
            echo '```'
            printf '%s\n' "$TAGS"
            echo '```'
            echo
            echo "Pin the digest in \`eh-homelab/clusters\`:"
            echo '```'
            echo "ghcr.io/eh-homelab/scadbuddy@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The AI agent sidecar (#261): the Dockerfile's `agent` target, published as
  # its own package, ghcr.io/eh-homelab/scadbuddy-agent, and deployed as a
  # second container in the ScadBuddy pod (AI design spec §4.1,
  # docs/superpowers/specs/2026-09-27-ai-integration-design.md). Same tag
  # scheme as the backend image, so one `sha-<short>` names both halves of a
  # commit.
  #
  # Its OWN job, and `continue-on-error`, until the cluster manifest runs the
  # sidecar: deploy-main.yml deploys only when this whole workflow succeeds,
  # and a first publish of a new package (which starts private — the same
  # visibility step as the header describes) must not be able to hold back a
  # backend deploy that does not use it yet. Drop `continue-on-error` in the
  # change that pins this image in eh-homelab/clusters.
  agent:
    name: Build and push agent (amd64 + arm64)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: "7"
        with:
          images: ghcr.io/eh-homelab/scadbuddy-agent
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=ScadBuddy agent
            org.opencontainers.image.description=AI agent service sidecar for ScadBuddy

      # The same label the `build` job stamps into the API image (see "Pick the
      # deploy label" there): `X.Y.Z` for a `vX.Y.Z` tag, `sha-<short>` otherwise.
      # It becomes the agent's trace `service.version` (#988).
      - name: Pick the version label
        id: label
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$REF" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            version="sha-${SHA:0:7}"
          fi
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"

      # The build runs the Dockerfile's CLAUDE_CODE_VERSION assertion once per
      # platform, against that platform's bundled binary (arm64 under QEMU).
      #
      # `type=gha` on a hosted runner only, as above; `scope=agent` is the
      # scope ci.yml's `agent` job reads, so PRs start from main's layers.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SCADBUDDY_REVISION=${{ github.sha }}
            SCADBUDDY_VERSION=${{ steps.label.outputs.version }}
          provenance: false
          cache-from: type=gha,scope=agent
          cache-to: type=gha,scope=agent,mode=max

      - name: Report the published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          {
            echo "### Published \`ghcr.io/eh-homelab/scadbuddy-agent\`"
            echo
            echo "**Digest:** \`${DIGEST}\`"
            echo
            echo "**Tags:**"
            echo '```'
            printf '%s\n' "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Durable agent sessions (#1056): the Dockerfile's `agent-durable` target,
  # published as ghcr.io/eh-homelab/scadbuddy-agent-durable, a sidecar like
  # `agent`. THE PACKAGE MUST BE MADE PUBLIC after its first publish (a new
  # package starts private), as for the others. `continue-on-error` for the same
  # reason as `agent`: until the cluster manifest runs it, a first publish must
  # not hold back a backend deploy. Drop it in the change that pins this image
  # in eh-homelab/clusters.
  agent-durable:
    name: Build and push agent-durable (amd64 + arm64)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: "7"
        with:
          images: ghcr.io/eh-homelab/scadbuddy-agent-durable
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=ScadBuddy agent-durable
            org.opencontainers.image.description=Durable agent sessions worker (Temporal) for ScadBuddy

      # The build runs the Dockerfile's CLAUDE_CODE_VERSION assertion once per
      # platform, against that platform's bundled binary (arm64 under QEMU).
      # `scope=agent-durable` is the scope ci.yml's `agent-durable` job reads;
      # `mode=min` because the Actions cache is full (CLAUDE.md).
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: agent-durable
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=agent-durable
          cache-to: type=gha,scope=agent-durable,mode=min

      - name: Report the published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          {
            echo "### Published \`ghcr.io/eh-homelab/scadbuddy-agent-durable\`"
            echo
            echo "**Digest:** \`${DIGEST}\`"
            echo
            echo "**Tags:**"
            echo '```'
            printf '%s\n' "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The arm64 leg of the Dockerfile's `openscad-lsp` stage (#199): its
  # `TARGETARCH` case picks the aarch64 release and checksum, which the amd64
  # PR build in ci.yml never exercises. Only that stage (and `base` under it)
  # is built, not the image. `base` is OpenSCAD's arm64 image plus an apt
  # install, which QEMU manages in minutes; the stage itself already runs
  # `openscad-lsp --version` at build time, and the step below runs it again
  # from the loaded image so the check does not depend on that RUN line.
  #
  # PRs only, and only those the trigger's paths filter lets in (a Dockerfile or
  # workflow change): main's `build` job already writes this stage's arm64 layers
  # to the default cache scope, which the cache below reads.
  openscad-lsp-arm64:
    name: Build and run openscad-lsp (arm64)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      # `type=gha` on a hosted runner only, as above. Its own scope, so it
      # never overwrites the backend's (default) or the agent's index. It also
      # reads the default scope, where the `build` job's mode=max cache holds
      # main's arm64 `base` layers.
      - name: Build the openscad-lsp stage for arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          target: openscad-lsp
          platforms: linux/arm64
          load: true
          tags: scadbuddy-openscad-lsp:arm64
          provenance: false
          cache-from: |
            type=gha,scope=openscad-lsp-arm64
            type=gha
          # mode=min: only the final stage's layers. The repo's Actions cache sits at its
          # ~10 GB ceiling, and every intermediate arm64 layer this PR-only job wrote
          # pushed the backend image's cache out sooner (#743).
          cache-to: type=gha,scope=openscad-lsp-arm64,mode=min

      # `uname -m` proves the container really is arm64 (binfmt runs it under
      # QEMU); a silently amd64 image would print x86_64 and fail here.
      - name: Run openscad-lsp --version on arm64
        run: |
          set -euo pipefail
          arch=$(docker run --rm --platform linux/arm64 --entrypoint uname scadbuddy-openscad-lsp:arm64 -m)
          echo "container arch: $arch"
          [[ "$arch" == aarch64 ]] || { echo "::error::expected aarch64, got $arch"; exit 1; }
          version=$(docker run --rm --platform linux/arm64 --entrypoint /usr/local/bin/openscad-lsp scadbuddy-openscad-lsp:arm64 --version)
          echo "$version"
          echo "### openscad-lsp (arm64): \`$version\`" >> "$GITHUB_STEP_SUMMARY"
