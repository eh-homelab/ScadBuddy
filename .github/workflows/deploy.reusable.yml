---
name: Deploy (reusable)

# The one deploy mechanism, shared by deploy-main.yml and deploy-release.yml:
# pin an already-published image digest in eh-homelab/clusters and let GitOps
# take it from there.
#
#   1. Mint an eh-homelab-org-runners App token scoped to `clusters`
#      (contents + pull_requests). Not GITHUB_TOKEN: it cannot write to another
#      repo, and a PR authored by GITHUB_TOKEN would not trigger clusters' own
#      CI, so the required checks that gate auto-merge would never report.
#   2. Rewrite applications/scadbuddy/scadbuddy.yaml (the API) and, once it
#      exists in clusters, applications/scadbuddy/scadbuddy-render.yaml (the
#      render worker, same image; #547): in each, the image line to
#      `ghcr.io/eh-homelab/scadbuddy:<version>@sha256:<digest>` and the three
#      `scadbuddy.eh-homelab.io/*` annotations that record what was deployed.
#      The agent sidecar's line in the API manifest (#738) is pinned to
#      `ghcr.io/eh-homelab/scadbuddy-agent:<version>@sha256:<its digest>`, the
#      same build's agent image, so the two containers never drift apart.
#      Digest-pinned on purpose — nodes pull ghcr.io through a Nexus proxy that
#      caches tag metadata for 24 h, so a tag alone can serve yesterday's image.
#      And, once clusters#1596 Phase 5 adds it, the `ref=` of the remote
#      resource line in clusters/prod/scadbuddy/kustomization.yaml that pulls
#      in this repo's deploy/grafana dashboard (#988), to the same `revision`,
#      so the dashboard shown is the one written for the build that serves.
#   3. Open ONE PR, "deploy(scadbuddy): <version>", on the fixed branch
#      `deploy/scadbuddy`, and arm `gh pr merge --auto --squash`. A newer deploy
#      supersedes an older open one: it closes that PR and replaces the branch.
#      The clusters ruleset (CI Summary + claude-review) is the safety net; the
#      merge is the deploy.
#   4. On merge ArgoCD syncs the `scadbuddy` Application, and clusters'
#      scadbuddy-verify-deploy.yml waits for /healthz to report the pinned
#      `revision`, then reports back here (release notes or a commit comment).
#
# Nothing in this file talks to the cluster: GitHub-hosted runners cannot reach
# it, and they do not need to — verification runs on a LAN runner in clusters.

on:
  workflow_call:
    inputs:
      digest:
        description: "Image digest to pin, `sha256:<64 hex>`"
        required: true
        type: string
      version:
        description: "Tag label to show next to the digest (`X.Y.Z` or `sha-<short>`)"
        required: true
        type: string
      revision:
        description: "Full commit SHA the image was built from (what /healthz must report)"
        required: true
        type: string
      source_url:
        description: "Where this deploy came from (release page or commit URL)"
        required: true
        type: string
      source_kind:
        description: "`release` or `main`"
        required: true
        type: string
    outputs:
      pr_url:
        description: "The clusters deploy PR (empty when nothing changed)"
        value: ${{ jobs.pin.outputs.pr_url }}
      pr_number:
        description: "Its number (empty when nothing changed)"
        value: ${{ jobs.pin.outputs.pr_number }}
      unchanged:
        description: "`true` when clusters already pins this exact digest"
        value: ${{ jobs.pin.outputs.unchanged }}
      armed:
        description: "`true` when auto-merge was armed on the PR; `false` means the PR exists but needs a manual merge"
        value: ${{ jobs.pin.outputs.armed }}

permissions:
  contents: read

env:
  CLUSTERS_REPO: eh-homelab/clusters
  MANIFEST: applications/scadbuddy/scadbuddy.yaml
  # The render worker's Deployment (#547, clusters#1454): same image, same pin.
  # Optional until that file lands in clusters; pinned whenever it exists.
  MANIFEST_WORKER: applications/scadbuddy/scadbuddy-render.yaml
  DEPLOY_BRANCH: deploy/scadbuddy
  IMAGE: ghcr.io/eh-homelab/scadbuddy
  # The agent sidecar (#261), built by the same Build Image run under the same
  # tags, and pinned in $MANIFEST beside the API (#738).
  AGENT_IMAGE: ghcr.io/eh-homelab/scadbuddy-agent
  # The overlay that pulls in deploy/grafana as a remote kustomize resource,
  # and that resource without its `?ref=` (spec 2026-10-01 §7, #988).
  KUSTOMIZATION: clusters/prod/scadbuddy/kustomization.yaml
  DASHBOARD_RESOURCE: https://github.com/eh-homelab/ScadBuddy//deploy/grafana

jobs:
  pin:
    name: Pin ${{ inputs.version }} in clusters
    runs-on: ubuntu-latest
    # The agent wait below can take up to 10 of these.
    timeout-minutes: 25
    # The one place the two callers can race: this job closes the previous
    # deploy PR, replaces the `deploy/scadbuddy` branch and opens a new PR.
    # Job-level, so only these few seconds serialise — deploy-release's image
    # wait and deploy-main's digest lookup run concurrently. Never cancel: a
    # run cut off between the push and `gh pr merge --auto` leaves an orphan.
    #
    # GitHub keeps ONE running and ONE pending job per group; a third request
    # cancels the pending one (it never runs) and takes its place. So the
    # newest request always runs, and a deploy dropped from the queue is one
    # a newer request overtook before it started — the same outcome its own
    # supersession logic would have produced, minus the PR. The callers
    # report that case (`needs.deploy.result == 'cancelled'`) so it is never
    # silent; re-running the dropped run deploys it.
    concurrency:
      group: scadbuddy-deploy
      cancel-in-progress: false
    outputs:
      pr_url: ${{ steps.pr.outputs.pr_url }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      unchanged: ${{ steps.edit.outputs.unchanged }}
      armed: ${{ steps.pr.outputs.armed }}
    steps:
      - name: Validate inputs
        env:
          DIGEST: ${{ inputs.digest }}
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
          KIND: ${{ inputs.source_kind }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::digest must be sha256:<64 hex>, got '$DIGEST'"; exit 1; }
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::revision must be a full SHA, got '$REVISION'"; exit 1; }
          # A tag label: what docker/metadata-action emits for a semver tag or
          # a short sha. Anything else would produce an unpullable image ref.
          [[ "$VERSION" =~ ^[A-Za-z0-9._-]{1,128}$ ]] || { echo "::error::version '$VERSION' is not a valid image tag"; exit 1; }
          [[ "$KIND" == "release" || "$KIND" == "main" ]] || { echo "::error::source_kind must be release or main"; exit 1; }
          # A github.com URL over a conservative charset: it is interpolated
          # into a sed replacement below, where `&`, `\` and `|` are special.
          [[ "$SOURCE_URL" =~ ^https://github\.com/[A-Za-z0-9._/-]+$ ]] || { echo "::error::source_url must be a plain https://github.com/... URL, got '$SOURCE_URL'"; exit 1; }

      # The digest must be pullable before it is pinned: a typo here would
      # merge cleanly in clusters and then ImagePullBackOff in production.
      - name: Confirm the image exists on GHCR
        env:
          DIGEST: ${{ inputs.digest }}
        run: docker buildx imagetools inspect "${IMAGE}@${DIGEST}" > /dev/null

      # The agent is tagged like the API by the same Build Image run, so its
      # digest is resolved from the tag rather than passed in. Its job runs
      # beside the API's: a release deploy, which waits for the API image only,
      # can get here first, so this waits up to 10 minutes for it.
      - name: Resolve the agent image
        id: agent
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ref="${AGENT_IMAGE}:${VERSION}"
          digest=""
          for _ in $(seq 60); do
            # Parsed from the human output, as deploy-main.yml does; `|| true`
            # so an unpublished tag means "keep waiting", not an aborted step.
            digest=$(docker buildx imagetools inspect "$ref" 2>/dev/null | awk '/^Digest:/ {print $2; exit}' || true)
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] && break
            echo "$(date -u +%H:%M:%S) $ref not published yet; waiting"
            sleep 10
          done
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::could not resolve $ref (got '$digest')"; exit 1; }
          echo "$ref -> $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Mint an App token for clusters
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RUNNER_APP_ID }}
          private-key: ${{ secrets.RUNNER_APP_PRIVATE_KEY }}
          owner: eh-homelab
          repositories: clusters
          permission-contents: write
          permission-pull-requests: write

      - name: Check out clusters main
        uses: actions/checkout@v7
        with:
          repository: eh-homelab/clusters
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          path: clusters

      # The dashboard's ref= may only move to a revision that has the
      # kustomization it points at: one without it fails the whole overlay's
      # sync, the images included.
      - name: Check deploy/grafana exists at the revision
        id: grafana
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/contents/deploy/grafana/kustomization.yaml?ref=${REVISION}" --silent 2>/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # sed against anchored lines rather than a YAML rewrite: yq would
      # reflow the whole document and bury the one-line change in noise. Each
      # target must match exactly once, before and after, or the edit aborts.
      - name: Pin the digest and record provenance
        id: edit
        working-directory: clusters
        env:
          DIGEST: ${{ inputs.digest }}
          AGENT_DIGEST: ${{ steps.agent.outputs.digest }}
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
          SOURCE_URL: ${{ inputs.source_url }}
          DASHBOARD_AT_REVISION: ${{ steps.grafana.outputs.present }}
        run: |
          set -euo pipefail
          expect_one() { # manifest pattern description
            local n; n=$(grep -cE "$2" "$1" || true)
            [ "$n" -eq 1 ] || { echo "::error file=$1::expected exactly one $3 line, found $n"; exit 1; }
          }

          # One manifest, one Deployment: every guard below is per file.
          pin() { # manifest deployment
            local target=$1 deployment=$2
            # `[:@]` ends the repository name, so the pattern matches this image
            # and never a sibling package that shares its prefix: the agent
            # sidecar, ghcr.io/eh-homelab/scadbuddy-agent, runs in the same pod
            # and has its own image line in the same manifest.
            # A bare `image: ghcr.io/eh-homelab/scadbuddy` with no tag or digest
            # therefore no longer matches, and the run fails "found 0". That is
            # deliberate: clusters pins by digest (an untagged ref would pull
            # the Nexus proxy's day-old `latest`), and deploy-pin.test.sh pins it.
            local image_line="^(\s*)image: ${IMAGE//./\\.}[:@][^[:space:]]*\$"
            expect_one "$target" "$image_line" "image"
            expect_one "$target" '^\s*scadbuddy\.eh-homelab\.io/version: ' "version annotation"
            expect_one "$target" '^\s*scadbuddy\.eh-homelab\.io/revision: ' "revision annotation"
            expect_one "$target" '^\s*scadbuddy\.eh-homelab\.io/source: ' "source annotation"

            # `|` as the sed delimiter: none of the substituted values (an image
            # ref, a tag, a SHA, a github.com URL) can contain it.
            # The `unverifiable` line is an escape hatch for a HAND-written pin
            # of an image that cannot report its commit; this pipeline always
            # writes a full-SHA revision, so a leftover one would make every
            # later verify run warn about a pin that no longer exists. Drop it.
            sed -i -E \
              -e "s|${image_line}|\1image: ${IMAGE}:${VERSION}@${DIGEST}|" \
              -e "s|^(\s*)scadbuddy\.eh-homelab\.io/version: .*\$|\1scadbuddy.eh-homelab.io/version: \"${VERSION}\"|" \
              -e "s|^(\s*)scadbuddy\.eh-homelab\.io/revision: .*\$|\1scadbuddy.eh-homelab.io/revision: \"${REVISION}\"|" \
              -e "s|^(\s*)scadbuddy\.eh-homelab\.io/source: .*\$|\1scadbuddy.eh-homelab.io/source: \"${SOURCE_URL}\"|" \
              -e '/^\s*scadbuddy\.eh-homelab\.io\/unverifiable: /d' \
              "$target"

            # Round-trip every rewritten line, not just the image: a sed that
            # silently matched nothing would otherwise merge stale provenance.
            expect_one "$target" "^\s*image: ${IMAGE//./\\.}:${VERSION//./\\.}@${DIGEST}\$" "pinned image"
            expect_one "$target" "^\s*scadbuddy\.eh-homelab\.io/version: \"${VERSION//./\\.}\"\$" "rewritten version annotation"
            expect_one "$target" "^\s*scadbuddy\.eh-homelab\.io/revision: \"${REVISION}\"\$" "rewritten revision annotation"
            expect_one "$target" "^\s*scadbuddy\.eh-homelab\.io/source: \"${SOURCE_URL//./\\.}\"\$" "rewritten source annotation"
            if grep -qE '^\s*scadbuddy\.eh-homelab\.io/unverifiable: ' "$target"; then
              echo "::error file=$target::an unverifiable annotation survived the rewrite; a pipeline pin must not carry one"; exit 1
            fi
            # Scoped to the container just pinned, not a file-wide grep: a
            # second container with the right policy must not mask drift here.
            # Selected by the pinned image rather than by container name, so
            # the worker's container needs no agreed name.
            # Counted after parsing, not only as text: a YAML alias (`image: *img`)
            # gives a second container the pinned image without a second line.
            local selector='select(.kind == "Deployment" and .metadata.name == strenv(DEPLOYMENT)) | .spec.template.spec.containers[] | select(.image == strenv(PINNED))'
            local count policy
            count=$(DEPLOYMENT="$deployment" PINNED="${IMAGE}:${VERSION}@${DIGEST}" yq eval-all -N \
              "[${selector}] | length" "$target" | awk '{ n += $1 } END { print n + 0 }')
            [ "$count" -eq 1 ] \
              || { echo "::error file=$target::expected exactly one container with the pinned image in the ${deployment} Deployment, found ${count}"; exit 1; }
            policy=$(DEPLOYMENT="$deployment" PINNED="${IMAGE}:${VERSION}@${DIGEST}" yq eval-all -N \
              "${selector} | .imagePullPolicy // \"\"" "$target")
            [ "$policy" = "IfNotPresent" ] \
              || { echo "::error file=$target::the ${deployment} Deployment's pinned container must set imagePullPolicy: IfNotPresent once the image is digest-pinned (found '${policy:-<unset>}')"; exit 1; }
          }

          # The agent sidecar's line (#738). Required: clusters runs the agent
          # in the API's pod, so a manifest without its line is a dropped
          # sidecar to catch, not a layout to deploy around. The provenance
          # annotations are the Deployment's and are already written above.
          pin_agent() { # manifest
            local target=$1
            local agent_line="^(\s*)image: ${AGENT_IMAGE//./\\.}[:@][^[:space:]]*\$"
            expect_one "$target" "$agent_line" "agent image"
            sed -i -E "s|${agent_line}|\1image: ${AGENT_IMAGE}:${VERSION}@${AGENT_DIGEST}|" "$target"
            expect_one "$target" "^\s*image: ${AGENT_IMAGE//./\\.}:${VERSION//./\\.}@${AGENT_DIGEST}\$" "pinned agent image"
          }

          # True when transformers[] holds a NamespaceTransformer with
          # `unsetOnly` the YAML boolean true: as a map, as an inline YAML
          # string, or as a relative path to a file (resolved against the
          # overlay's directory) that parses to the same.
          ns_check='select(.kind == "NamespaceTransformer" and (.unsetOnly | tag) == "!!bool" and .unsetOnly == true)'
          ns_transformer_ok() { # kustomization
            local target=$1 dir entry s
            dir=$(dirname "$target")
            while IFS= read -r entry; do
              if printf '%s\n' "$entry" | yq -p=json -e 'tag == "!!map"' > /dev/null 2>&1; then
                printf '%s\n' "$entry" | yq -p=json -e "$ns_check" > /dev/null 2>&1 && return 0
              else
                s=$(printf '%s\n' "$entry" | yq -p=json '.' 2>/dev/null) || continue
                case "$s" in
                  *$'\n'* | *:* | /* | *..*) printf '%s\n' "$s" | yq -e "$ns_check" > /dev/null 2>&1 && return 0 ;;
                  *) [ -f "$dir/$s" ] && yq -e "$ns_check" "$dir/$s" > /dev/null 2>&1 && return 0 ;;
                esac
              fi
            done < <(yq -o=json -I=0 '(.transformers // [])[]' "$target" 2>/dev/null)
            return 1
          }

          # The dashboard's `ref=` (#988, spec 2026-10-01 §7). Optional, unlike
          # the agent: until clusters#1596 Phase 5 adds the line, the overlay
          # does not mention deploy/grafana at all and the images deploy alone.
          # A line that mentions it but does not match the anchor exactly (a
          # short SHA, a branch, a trailing comment, other casing or spacing,
          # commented out) is an error, never "not configured": read that way,
          # the dashboard would stay pinned to an old build without a word.
          # Sets $dashboard to `pinned` when it rewrote the line; a global, not
          # a printed value, so its ::error lines reach the log instead of a
          # command substitution.
          dashboard=none
          pin_dashboard() { # kustomization
            local target=$1 n mentions
            local line="^(\s*)- ${DASHBOARD_RESOURCE//./\\.}\?ref=[0-9a-f]{40}\$"
            [ -f "$target" ] || { echo "::error::${target} is not in clusters; cannot tell whether it pins the dashboard"; exit 1; }
            # Only an entry of `.resources[]` is the pin: the same text under
            # transformers: or elsewhere is a mention, which the count below
            # turns into the near-miss error.
            n=$(DRE="^${DASHBOARD_RESOURCE//./\\.}\\?ref=[0-9a-f]{40}\$" yq '[(.resources // [])[] | select(tag == "!!str") | select(test(strenv(DRE)))] | length' "$target")
            # YAML ignores a trailing comment and extra spacing, but the
            # rewrite below is by line: an entry that is not also exactly the
            # line is a near miss, not a pin.
            [ "$n" -eq 0 ] || [ "$(grep -cE "$line" "$target" || true)" -eq "$n" ] || n=0
            mentions=$(grep -ciE 'eh-homelab/scadbuddy(\.git)?/+deploy/grafana' "$target" || true)
            if [ "$n" -eq 0 ]; then
              if [ "$mentions" -gt 0 ]; then
                echo "::error file=$target::mentions eh-homelab/ScadBuddy//deploy/grafana but no line is exactly '- ${DASHBOARD_RESOURCE}?ref=<40-hex revision>'"; exit 1
              fi
              echo "::notice::${target} has no dashboard pin yet (clusters#1596 Phase 5); pinning the images only"
              return 0
            fi
            [ "$n" -eq 1 ] || { echo "::error file=$target::expected at most one dashboard line, found $n"; exit 1; }
            # A second, unpinned mention beside the exact line is a near miss too.
            if [ "$mentions" -ne "$n" ]; then
              echo "::error file=$target::mentions eh-homelab/ScadBuddy//deploy/grafana $mentions times but only $n line is exactly '- ${DASHBOARD_RESOURCE}?ref=<40-hex revision>'"; exit 1
            fi
            # A top-level namespace: would move the ConfigMap out of
            # cattle-dashboards, where the sidecar never sees it.
            if yq -e '.namespace' "$target" > /dev/null 2>&1; then
              echo "::error file=$target::has a top-level namespace:, which moves the dashboard ConfigMap out of cattle-dashboards; use a NamespaceTransformer with unsetOnly: true (clusters#1596 Phase 5)"; exit 1
            fi
            if ! ns_transformer_ok "$target"; then
              echo "::error file=$target::pins the dashboard but has no NamespaceTransformer with unsetOnly: true (a YAML boolean; the string \"true\" does not count) in transformers, inline or as a file (clusters#1596 Phase 5)"; exit 1
            fi
            if [ "${DASHBOARD_AT_REVISION:-}" != true ]; then
              echo "::error file=$target::${REVISION} has no deploy/grafana/kustomization.yaml; pinning the dashboard to it would fail the overlay's sync"; exit 1
            fi
            sed -i -E "s|${line}|\1- ${DASHBOARD_RESOURCE}?ref=${REVISION}|" "$target"
            expect_one "$target" "^\s*- ${DASHBOARD_RESOURCE//./\\.}\?ref=${REVISION}\$" "pinned dashboard"
            dashboard=pinned
          }

          manifests=("$MANIFEST")
          pin "$MANIFEST" scadbuddy
          pin_agent "$MANIFEST"
          pin_dashboard "$KUSTOMIZATION"
          echo "dashboard=$dashboard" >> "$GITHUB_OUTPUT"
          if [ "$dashboard" = pinned ]; then
            manifests+=("$KUSTOMIZATION")
          fi
          # Conditional until clusters#1454 adds the worker's file: without it
          # this still deploys the API alone, as before #547.
          if [ -f "$MANIFEST_WORKER" ]; then
            pin "$MANIFEST_WORKER" scadbuddy-render
            manifests+=("$MANIFEST_WORKER")
          else
            echo "::notice::${MANIFEST_WORKER} is not in clusters yet; pinning ${MANIFEST} only"
          fi

          if git diff --quiet -- "${manifests[@]}"; then
            echo "clusters already pins ${IMAGE}:${VERSION}@${DIGEST}; nothing to deploy"
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
          else
            echo "unchanged=false" >> "$GITHUB_OUTPUT"
            # Only the files this run changed: the commit and the PR name them.
            echo "files=$(git diff --name-only -- "${manifests[@]}" | paste -sd ' ' -)" >> "$GITHUB_OUTPUT"
            git --no-pager diff -- "${manifests[@]}"
          fi

      - name: Open the deploy PR and arm auto-merge
        id: pr
        if: steps.edit.outputs.unchanged == 'false'
        working-directory: clusters
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ env.CLUSTERS_REPO }}
          DIGEST: ${{ inputs.digest }}
          AGENT_DIGEST: ${{ steps.agent.outputs.digest }}
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
          SOURCE_URL: ${{ inputs.source_url }}
          KIND: ${{ inputs.source_kind }}
          FILES: ${{ steps.edit.outputs.files }}
          DASHBOARD: ${{ steps.edit.outputs.dashboard }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "eh-homelab-org-runners[bot]"
          git config user.email "287522375+eh-homelab-org-runners[bot]@users.noreply.github.com"

          # One deploy branch, one open deploy PR. A newer deploy supersedes
          # the older one: close it (with a pointer) and replace the branch.
          gh pr list --head "$DEPLOY_BRANCH" --state open --json number --jq '.[].number' \
            | while read -r old; do
                gh pr close "$old" --comment "Superseded by a newer ScadBuddy deploy (${VERSION}, ${RUN_URL})."
              done
          git push origin --delete "$DEPLOY_BRANCH" 2>/dev/null || true

          read -ra manifest_files <<< "$FILES"
          listed=""
          for f in "${manifest_files[@]}"; do listed+="\`${f}\` "; done
          # The dashboard moves with the image, or the overlay has no pin yet.
          case "$DASHBOARD" in
            pinned) dashboard_note="deploy/grafana at ${REVISION}" ;;
            *)      dashboard_note="not pinned in clusters yet (clusters#1596 Phase 5)" ;;
          esac
          git checkout -B "$DEPLOY_BRANCH"
          git add -- "${manifest_files[@]}"
          git commit -q -F - <<EOF
          deploy(scadbuddy): ${VERSION}

          Pin ${IMAGE}:${VERSION}@${DIGEST}
          and ${AGENT_IMAGE}:${VERSION}@${AGENT_DIGEST}
          (dashboard: ${dashboard_note})
          built from eh-homelab/ScadBuddy@${REVISION} (${KIND}),
          in ${manifest_files[*]}.

          Source: ${SOURCE_URL}
          Deploy run: ${RUN_URL}
          EOF
          git push -u origin "$DEPLOY_BRANCH"

          case "$KIND" in
            release) report="the release notes of ${SOURCE_URL}" ;;
            *)       report="a comment on eh-homelab/ScadBuddy@${REVISION:0:7}" ;;
          esac
          pr_url=$(gh pr create \
            --title "deploy(scadbuddy): ${VERSION}" \
            --body "$(cat <<EOF
          Automated by eh-homelab/ScadBuddy \`deploy.reusable.yml\` — [run](${RUN_URL}).

          - **Image:** \`${IMAGE}:${VERSION}@${DIGEST}\`
          - **Agent:** \`${AGENT_IMAGE}:${VERSION}@${AGENT_DIGEST}\`
          - **Dashboard:** ${dashboard_note}
          - **Files:** ${listed}
          - **Built from:** ${SOURCE_URL} (\`${REVISION}\`)
          - **Path:** ${KIND}

          Auto-merge is armed; this repo's ruleset (CI Summary + claude-review) gates it. On merge ArgoCD syncs the \`scadbuddy\` Application and \`scadbuddy-verify-deploy.yml\` waits for the pod's \`/healthz\` to report revision \`${REVISION:0:7}\`, then posts the result here and on ${report}.
          EOF
          )")
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "pr_number=${pr_url##*/}" >> "$GITHUB_OUTPUT"
          # The PR exists from here on, whatever happens next: record whether
          # auto-merge armed so a caller can say "merge it by hand" rather
          # than "no PR was opened" when this fails.
          if gh pr merge "$pr_url" --auto --squash; then
            armed=true
          else
            armed=false
            echo "::error::opened ${pr_url} but could not arm auto-merge; it needs a manual merge"
          fi
          echo "armed=$armed" >> "$GITHUB_OUTPUT"
          {
            echo "### Deploy PR opened"
            echo
            if [ "$armed" = true ]; then
              echo "- ${pr_url} — auto-merge armed"
            else
              echo "- ${pr_url} — **auto-merge could not be armed; merge it by hand**"
            fi
            echo "- \`${IMAGE}:${VERSION}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$armed" = true ]

      - name: Note an unchanged pin
        if: steps.edit.outputs.unchanged == 'true'
        env:
          DIGEST: ${{ inputs.digest }}
          VERSION: ${{ inputs.version }}
        run: |
          echo "### Nothing to deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "clusters already pins \`${IMAGE}:${VERSION}@${DIGEST}\`." >> "$GITHUB_STEP_SUMMARY"
