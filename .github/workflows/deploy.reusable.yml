---
name: Deploy (reusable)

# The one deploy mechanism, shared by deploy-main.yml and deploy-release.yml:
# pin an already-published image digest in eh-homelab/clusters and let GitOps
# take it from there.
#
#   1. Mint an eh-homelab-org-runners App token scoped to `clusters`
#      (contents + pull_requests). Not GITHUB_TOKEN: it cannot write to another
#      repo, and a PR authored by GITHUB_TOKEN would not trigger clusters' own
#      CI, so the required checks that gate auto-merge would never report.
#   2. Rewrite applications/scadbuddy/scadbuddy.yaml (the API) and, once it
#      exists in clusters, applications/scadbuddy/scadbuddy-render.yaml (the
#      render worker, same image; #547), scadbuddy-print.yaml (the print
#      worker, same image; #1060), scadbuddy-projects.yaml (the flow runs'
#      worker, same image; #1057) and scadbuddy-storefront.yaml (the
#      storefront, same image; #5284): in each, the image line to
#      `ghcr.io/eh-homelab/scadbuddy:<version>@sha256:<digest>` and the three
#      `scadbuddy.eh-homelab.io/*` annotations that record what was deployed.
#      The agent sidecar's line in the API manifest (#738) is pinned to
#      `ghcr.io/eh-homelab/scadbuddy-agent:<version>@sha256:<its digest>`, the
#      same build's agent image, so the two containers never drift apart; so
#      is every other file that runs the agent image, found by the image (the
#      agent's worker Deployment, scadbuddy-agent-worker.yaml, #5037).
#      Once clusters runs it, the durable sessions worker's line (#1056) is
#      pinned the same way, to
#      `ghcr.io/eh-homelab/scadbuddy-agent-durable:<version>@sha256:<its digest>`,
#      in scadbuddy-agent-durable.yaml (its own Deployment) or, before that
#      file exists, in the API's manifest (where it first ran as a sidecar).
#      The slicer worker's line (#3822) is pinned the same way, to
#      `ghcr.io/eh-homelab/scadbuddy-slicer:<version>@sha256:<its digest>`, in
#      scadbuddy-slicer.yaml, once that file exists. Unlike the others, a build
#      that published no slicer image (its job is continue-on-error) keeps the
#      pin clusters has and warns; the rest of the deploy goes ahead.
#      The sessions' shell sandbox (#5864) is pinned the same way, to
#      `ghcr.io/eh-homelab/scadbuddy-sandbox:<version>@sha256:<its digest>`, in
#      every line of every scanned file that names it (the agent worker's
#      SCADBUDDY_SANDBOX_IMAGE value and the egress proxy's image line), so the
#      agent's sandbox client and the pods' server never drift apart. As for
#      the slicer, a build that published no sandbox image keeps the pins.
#      The profile-fetch worker's line (#6625) is pinned like the slicer's, to
#      `ghcr.io/eh-homelab/scadbuddy-profile-fetch:<version>@sha256:<its digest>`,
#      in scadbuddy-profile-fetch.yaml, once that file exists; a build that
#      published no profile-fetch image keeps the pin and warns.
#      The agent's Playwright MCP browser (#7027, #7546) is pinned the same way,
#      to `ghcr.io/eh-homelab/scadbuddy-playwright-mcp:<version>@sha256:<its
#      digest>`, in playwright-mcp.yaml, once that file exists; a build
#      that published no playwright-mcp image keeps the pin and warns.
#      The agent fleet chat server (#7903) is pinned the same way, to
#      `ghcr.io/eh-homelab/scadbuddy-fleet:<version>@sha256:<its digest>`, in
#      scadbuddy-fleet.yaml, once that file exists. build-go-image.yml, not
#      Build Image, publishes it, and only for a push that touches Go, so it is
#      looked up once with no wait; a build with no fleet image keeps the pin
#      and warns.
#      The API in Go (#7667), the `core` container in the API's pod, is pinned
#      like the slicer's, to
#      `ghcr.io/eh-homelab/scadbuddy-core:<version>@sha256:<its digest>`, in
#      scadbuddy.yaml, once that file names it; a build that published no core
#      image keeps the pin and warns.
#      The printer camera relay, recorder and live edge (#7328, #7330, #7997)
#      are pinned the same way, to
#      `ghcr.io/eh-homelab/scadbuddy-camera-<part>:<version>@sha256:<its digest>`,
#      in applications/scadbuddy-camera/camera-<part>.yaml, once that file
#      exists. Each file runs its image in two containers (MediaMTX and the
#      controller), so it must have exactly two image lines, equal to each
#      other; both move, and so does the comment that names the API build they
#      came from ("the build of the API's <version>"). Their `camera` job is
#      continue-on-error, so a build that published no image for a part keeps
#      that file's pins and warns.
#      Digest-pinned on purpose — nodes pull ghcr.io through a Nexus proxy that
#      caches tag metadata for 24 h, so a tag alone can serve yesterday's image.
#      And, when clusters has it, the vendored copy of this repo's
#      deploy/grafana dashboards (#988) in clusters/prod/scadbuddy/grafana/
#      (eh-homelab/clusters#3734): its kustomization.yaml and *.json are
#      replaced with the files at the same `revision`, and its `.revision`
#      file names that revision, so the dashboard shown is the one written
#      for the build that serves. The overlay no longer pulls deploy/grafana
#      in as a remote resource (Argo CD's repo-server failed to fetch it), and
#      an overlay that still names it fails the deploy.
#      Last, every ScadBuddy image named anywhere under applications/scadbuddy/,
#      applications/scadbuddy-camera/ or the overlay's directory must be one
#      this run pinned, or the deploy
#      fails: no Deployment stays behind on an old build unnoticed (#5037).
#      The check parses every *.yaml/*.yml there, so a file that is not
#      valid YAML (a template, say) fails every deploy, closed on purpose:
#      what it runs cannot be checked.
#   3. Open ONE PR, "deploy(scadbuddy): <version>", on the fixed branch
#      `deploy/scadbuddy`, and arm `gh pr merge --auto --squash`. A newer deploy
#      first waits up to 90 minutes, in two 45 minute rounds, for an older open
#      one to land (#5168, #6368); it
#      closes that PR and replaces the branch only when it cannot land (checks
#      failed, a conflict, auto-merge off) or is still open after the wait.
#      The clusters ruleset (CI Summary + claude-review) is the safety net; the
#      merge is the deploy.
#   4. On merge ArgoCD syncs the `scadbuddy` Application, and clusters'
#      scadbuddy-verify-deploy.yml waits for /healthz to report the pinned
#      `revision`, then reports back here (release notes or a commit comment).
#
# Nothing in this file talks to the cluster: GitHub-hosted runners cannot reach
# it, and they do not need to — verification runs on a LAN runner in clusters.

on:
  workflow_call:
    inputs:
      digest:
        description: "Image digest to pin, `sha256:<64 hex>`"
        required: true
        type: string
      version:
        description: "Tag label to show next to the digest (`X.Y.Z` or `sha-<short>`)"
        required: true
        type: string
      revision:
        description: "Full commit SHA the image was built from (what /healthz must report)"
        required: true
        type: string
      source_url:
        description: "Where this deploy came from (release page or commit URL)"
        required: true
        type: string
      source_kind:
        description: "`release` or `main`"
        required: true
        type: string
    outputs:
      pr_url:
        description: "The clusters deploy PR (empty when nothing changed)"
        value: ${{ jobs.pin.outputs.pr_url }}
      pr_number:
        description: "Its number (empty when nothing changed)"
        value: ${{ jobs.pin.outputs.pr_number }}
      unchanged:
        description: "`true` when clusters already pins this exact digest"
        value: ${{ jobs.pin.outputs.unchanged }}
      armed:
        description: "`true` when auto-merge was armed on the PR; `false` means the PR exists but needs a manual merge"
        value: ${{ jobs.pin.outputs.armed }}

permissions:
  contents: read

env:
  CLUSTERS_REPO: eh-homelab/clusters
  MANIFEST: applications/scadbuddy/scadbuddy.yaml
  # The render worker's Deployment (#547, clusters#1454): same image, same pin.
  # Optional until that file lands in clusters; pinned whenever it exists.
  MANIFEST_WORKER: applications/scadbuddy/scadbuddy-render.yaml
  # The print worker's Deployment (#1060): same image, same pin.
  MANIFEST_PRINT: applications/scadbuddy/scadbuddy-print.yaml
  # The flow runs' worker's Deployment (#1057, `--queue projects`): same image, same pin.
  MANIFEST_PROJECTS: applications/scadbuddy/scadbuddy-projects.yaml
  # The storefront's Deployment (#5284, `python -m scadbuddy.storefront`): same
  # image, same pin. Optional until that file lands in clusters.
  MANIFEST_STOREFRONT: applications/scadbuddy/scadbuddy-storefront.yaml
  # The intake worker's Deployment (#6133, `python -m scadbuddy.intake_worker`):
  # same image, same pin. Its sandbox's Deployment has no image line of its own
  # (clusters copies the worker's with a kustomize replacement). Optional until
  # that file lands in clusters (clusters#3573).
  MANIFEST_INTAKE: applications/scadbuddy/scadbuddy-intake.yaml
  # The slicer worker (#3821, #3822), same run, same tags, its own Deployment.
  # Optional until that file lands in clusters (clusters#2549), and the only
  # image whose absence for a build is not an error: see the pin step.
  SLICER_IMAGE: ghcr.io/eh-homelab/scadbuddy-slicer
  MANIFEST_SLICER: applications/scadbuddy/scadbuddy-slicer.yaml
  # The sessions' shell sandbox (#5864), same run, same tags: the image the
  # agent worker creates each session's sandbox pod from (its
  # SCADBUDDY_SANDBOX_IMAGE value) and the egress proxy's. Pinned wherever a
  # scanned file names it; like the slicer, its absence for a build keeps the pins.
  SANDBOX_IMAGE: ghcr.io/eh-homelab/scadbuddy-sandbox
  # The 3DFP profile-fetch worker (#6625), same run, same tags, its own
  # Deployment. Optional until that file lands in clusters; resolved and pinned
  # like the slicer, so its absence for a build keeps the pin.
  PROFILE_FETCH_IMAGE: ghcr.io/eh-homelab/scadbuddy-profile-fetch
  MANIFEST_PROFILE_FETCH: applications/scadbuddy/scadbuddy-profile-fetch.yaml
  # The agent's Playwright MCP browser (#7027, #7546), same run, same tags, its
  # own Deployment (eh-homelab/clusters#4237). Resolved and pinned like the
  # profile-fetch worker, so its absence for a build keeps the pin.
  PLAYWRIGHT_MCP_IMAGE: ghcr.io/eh-homelab/scadbuddy-playwright-mcp
  MANIFEST_PLAYWRIGHT_MCP: applications/scadbuddy/playwright-mcp.yaml
  # The agent fleet chat server (#7903), its own Deployment
  # (eh-homelab/clusters, scadbuddy-fleet.yaml), under the same tags but from
  # build-go-image.yml. Pinned like playwright-mcp; its absence keeps the pin.
  FLEET_IMAGE: ghcr.io/eh-homelab/scadbuddy-fleet
  MANIFEST_FLEET: applications/scadbuddy/scadbuddy-fleet.yaml
  # The API in Go (#7667), same run, same tags: the `core` container in
  # $MANIFEST. Optional until that file names it; resolved and pinned like the
  # slicer, so its absence for a build keeps the pin.
  CORE_IMAGE: ghcr.io/eh-homelab/scadbuddy-core
  # The printer camera relay, recorder and live edge (#7328, #7330, #7997),
  # same run, same tags, each its own Deployment in a directory of their own
  # (eh-homelab/clusters#4331, #4367). Optional until clusters has the files;
  # resolved and pinned like the slicer, so a part with no image keeps its pins.
  CAMERA_DIR: applications/scadbuddy-camera
  CAMERA_RELAY_IMAGE: ghcr.io/eh-homelab/scadbuddy-camera-relay
  MANIFEST_CAMERA_RELAY: applications/scadbuddy-camera/camera-relay.yaml
  CAMERA_RECORDER_IMAGE: ghcr.io/eh-homelab/scadbuddy-camera-recorder
  MANIFEST_CAMERA_RECORDER: applications/scadbuddy-camera/camera-recorder.yaml
  CAMERA_EDGE_IMAGE: ghcr.io/eh-homelab/scadbuddy-camera-edge
  MANIFEST_CAMERA_EDGE: applications/scadbuddy-camera/camera-edge.yaml
  DEPLOY_BRANCH: deploy/scadbuddy
  IMAGE: ghcr.io/eh-homelab/scadbuddy
  # The agent sidecar (#261), built by the same Build Image run under the same
  # tags, and pinned in $MANIFEST beside the API (#738) and in every other
  # file that runs it (scadbuddy-agent-worker.yaml, #5037).
  AGENT_IMAGE: ghcr.io/eh-homelab/scadbuddy-agent
  # The durable sessions worker (#1056), same run, same tags, pinned once
  # clusters runs it: in its own Deployment's file, or in $MANIFEST while it
  # is still a sidecar there. Never both.
  AGENT_DURABLE_IMAGE: ghcr.io/eh-homelab/scadbuddy-agent-durable
  MANIFEST_AGENT_DURABLE: applications/scadbuddy/scadbuddy-agent-durable.yaml
  # The overlay, and the directory in it that holds a vendored copy of
  # deploy/grafana with its `.revision` (spec 2026-10-01 §7, #988,
  # eh-homelab/clusters#3734).
  KUSTOMIZATION: clusters/prod/scadbuddy/kustomization.yaml
  DASHBOARD_DIR: clusters/prod/scadbuddy/grafana

jobs:
  pin:
    name: Pin ${{ inputs.version }} in clusters
    runs-on: ubuntu-latest
    # The agent wait below can take up to 10 of these, the open deploy PR's
    # 45 (90 when the first round times out, #6368), the agent-durable one
    # 20, the slicer 10, the profile-fetch worker 10, playwright-mcp 10, core 10,
    # the camera images 10 (one wait for all three).
    timeout-minutes: 180
    # The one place the two callers can race: this job waits for the open
    # deploy PR, closes it if it cannot land, replaces the `deploy/scadbuddy`
    # branch and opens a new PR. Job-level, so deploy-release's image wait and
    # deploy-main's digest lookup run concurrently. Never cancel: a run cut
    # off between the push and `gh pr merge --auto` leaves an orphan.
    #
    # GitHub keeps ONE running and ONE pending job per group; a third request
    # cancels the pending one (it never runs) and takes its place. So the
    # newest request always runs, and a deploy dropped from the queue is one
    # a newer request overtook while the running one waited for its PR to
    # land: only the newest build of a burst needs to deploy. The callers
    # report that case (`needs.deploy.result == 'cancelled'`) so it is never
    # silent; re-running the dropped run deploys it.
    concurrency:
      group: scadbuddy-deploy
      cancel-in-progress: false
    outputs:
      pr_url: ${{ steps.pr.outputs.pr_url }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      unchanged: ${{ steps.edit.outputs.unchanged }}
      armed: ${{ steps.pr.outputs.armed }}
    steps:
      - name: Validate inputs
        env:
          DIGEST: ${{ inputs.digest }}
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
          KIND: ${{ inputs.source_kind }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::digest must be sha256:<64 hex>, got '$DIGEST'"; exit 1; }
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::revision must be a full SHA, got '$REVISION'"; exit 1; }
          # A tag label: what docker/metadata-action emits for a semver tag or
          # a short sha. Anything else would produce an unpullable image ref.
          [[ "$VERSION" =~ ^[A-Za-z0-9._-]{1,128}$ ]] || { echo "::error::version '$VERSION' is not a valid image tag"; exit 1; }
          [[ "$KIND" == "release" || "$KIND" == "main" ]] || { echo "::error::source_kind must be release or main"; exit 1; }
          # A github.com URL over a conservative charset: it is interpolated
          # into a sed replacement below, where `&`, `\` and `|` are special.
          [[ "$SOURCE_URL" =~ ^https://github\.com/[A-Za-z0-9._/-]+$ ]] || { echo "::error::source_url must be a plain https://github.com/... URL, got '$SOURCE_URL'"; exit 1; }

      # The digest must be pullable before it is pinned: a typo here would
      # merge cleanly in clusters and then ImagePullBackOff in production.
      - name: Confirm the image exists on GHCR
        env:
          DIGEST: ${{ inputs.digest }}
        run: docker buildx imagetools inspect "${IMAGE}@${DIGEST}" > /dev/null

      # The agent is tagged like the API by the same Build Image run, so its
      # digest is resolved from the tag rather than passed in. Its job runs
      # beside the API's: a release deploy, which waits for the API image only,
      # can get here first, so this waits up to 10 minutes for it.
      - name: Resolve the agent image
        id: agent
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ref="${AGENT_IMAGE}:${VERSION}"
          digest=""
          for _ in $(seq 60); do
            # Parsed from the human output, as deploy-main.yml does; `|| true`
            # so an unpublished tag means "keep waiting", not an aborted step.
            digest=$(docker buildx imagetools inspect "$ref" 2>/dev/null | awk '/^Digest:/ {print $2; exit}' || true)
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] && break
            echo "$(date -u +%H:%M:%S) $ref not published yet; waiting"
            sleep 10
          done
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::could not resolve $ref (got '$digest')"; exit 1; }
          echo "$ref -> $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Its own token: the wait below can outlast an App token's hour, and
      # the write token is minted after it. Read-only. Actions, not checks:
      # the App has no `checks` or `statuses` permission, so on the private
      # clusters repo the PR's check runs cannot be read; its workflow runs
      # can (checked 2026-11-03 with `gh api /orgs/eh-homelab/installations`).
      - name: Mint an App token to watch the open deploy PR
        id: watch-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RUNNER_APP_ID }}
          private-key: ${{ secrets.RUNNER_APP_PRIVATE_KEY }}
          owner: eh-homelab
          repositories: clusters
          permission-pull-requests: read
          permission-actions: read

      # Let an open deploy PR land before this run replaces it (#5168). Its
      # checks take 15 to 40 minutes; when each merge to main closed the open
      # PR, merges more often than that kept prod on one build for hours. So
      # this waits while the open PR can still land by itself: auto-merge
      # armed, no conflict, no workflow run on its head failed or cancelled
      # (clusters' CI, whose job is CI Summary, and whatever else runs on
      # that commit, of any event). It stops waiting when the PR is gone
      # (merged, or closed by hand), and gives up on one that cannot land or
      # is still open after WAIT_SECONDS, which gets one more round below
      # (#6368); the PR step then supersedes it as before. WAIT_SECONDS stays well inside the watch token's hour: a
      # read after it expires would fail. Meanwhile the concurrency group
      # keeps only the newest request pending, so a burst deploys its first
      # and its last build, and prod moves at every PR cycle.
      - name: Wait for the open deploy PR to land
        id: wait
        env:
          GH_TOKEN: ${{ steps.watch-token.outputs.token }}
          GH_REPO: ${{ env.CLUSTERS_REPO }}
          WAIT_SECONDS: "2700"
          POLL_SECONDS: "30"
        run: |
          set -euo pipefail
          start=$SECONDS
          outcome=""
          pr=""
          while :; do
            # Checked before any read, so no read runs past the deadline.
            if [ $((SECONDS - start)) -ge "$WAIT_SECONDS" ]; then outcome=timeout; break; fi
            # A failed read (a 5xx, say) is retried, never a failed deploy.
            if ! open=$(gh pr list --head "$DEPLOY_BRANCH" --state open --json number --jq '.[0].number // empty'); then
              sleep "$POLL_SECONDS"; continue
            fi
            if [ -z "$open" ]; then outcome=none; break; fi
            pr=$open
            # Merged or closed since the list: look again.
            view=$(gh pr view "$pr" --json autoMergeRequest,mergeStateStatus,headRefOid \
              --jq '[(.autoMergeRequest != null), .mergeStateStatus, .headRefOid] | @tsv') \
              || { sleep "$POLL_SECONDS"; continue; }
            IFS=$'\t' read -r armed state head <<< "$view"
            if [ "$armed" != true ]; then outcome=unarmed; break; fi
            if [ "$state" = DIRTY ]; then outcome=conflict; break; fi
            # BEHIND waits: clusters' ruleset does not require an up-to-date
            # branch (strict_required_status_checks_policy false, 2026-11-03).
            # A run still going, or none started yet, means "keep waiting";
            # a success too, until the merge. Only each workflow's newest run
            # counts, so a duplicate cancelled by its newer run does not.
            # Skipped runs (another event's trigger that did nothing) are
            # dropped first, so they never hide an earlier failure.
            # A failed read is not a failure.
            failed=$(gh run list --commit "$head" --json workflowName,conclusion,createdAt \
              --jq 'map(select(.conclusion != "skipped")) | group_by(.workflowName) | map(max_by(.createdAt))
                | map(select(.conclusion | IN("failure", "cancelled", "timed_out", "startup_failure"))) | length' \
              || true)
            if [ "${failed:-0}" != 0 ]; then outcome=failed; break; fi
            echo "$(date -u +%H:%M:%S) waiting for #${pr} (${state}) to land"
            sleep "$POLL_SECONDS"
          done
          case "$outcome" in
            none)     echo "no open deploy PR (or it has landed)" ;;
            *)        echo "::warning::stopped waiting for deploy PR #${pr:-?}: ${outcome}" ;;
          esac
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      # A second round when the first timed out on a PR that can still land
      # (#6368). Prime node image cache alone took 30 to 56 min on
      # 2026-11-15 under node IO contention, so the 45 min round closed PRs
      # about to merge: clusters#3620 went green at 07:25:05 and was closed
      # at 07:25:30, #3623 timed out the same way, and prod stayed on one
      # build for hours. Its own token, as the first round's: one token's
      # hour cannot cover both. The script is the first round's, character
      # for character (deploy-wait.test.sh checks it).
      - name: Mint an App token to watch the open deploy PR again
        id: watch-token-more
        if: steps.wait.outputs.outcome == 'timeout'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RUNNER_APP_ID }}
          private-key: ${{ secrets.RUNNER_APP_PRIVATE_KEY }}
          owner: eh-homelab
          repositories: clusters
          permission-pull-requests: read
          permission-actions: read

      - name: Wait one more round for the open deploy PR
        id: wait-more
        if: steps.wait.outputs.outcome == 'timeout'
        env:
          GH_TOKEN: ${{ steps.watch-token-more.outputs.token }}
          GH_REPO: ${{ env.CLUSTERS_REPO }}
          WAIT_SECONDS: "2700"
          POLL_SECONDS: "30"
        run: |
          set -euo pipefail
          start=$SECONDS
          outcome=""
          pr=""
          while :; do
            # Checked before any read, so no read runs past the deadline.
            if [ $((SECONDS - start)) -ge "$WAIT_SECONDS" ]; then outcome=timeout; break; fi
            # A failed read (a 5xx, say) is retried, never a failed deploy.
            if ! open=$(gh pr list --head "$DEPLOY_BRANCH" --state open --json number --jq '.[0].number // empty'); then
              sleep "$POLL_SECONDS"; continue
            fi
            if [ -z "$open" ]; then outcome=none; break; fi
            pr=$open
            # Merged or closed since the list: look again.
            view=$(gh pr view "$pr" --json autoMergeRequest,mergeStateStatus,headRefOid \
              --jq '[(.autoMergeRequest != null), .mergeStateStatus, .headRefOid] | @tsv') \
              || { sleep "$POLL_SECONDS"; continue; }
            IFS=$'\t' read -r armed state head <<< "$view"
            if [ "$armed" != true ]; then outcome=unarmed; break; fi
            if [ "$state" = DIRTY ]; then outcome=conflict; break; fi
            # BEHIND waits: clusters' ruleset does not require an up-to-date
            # branch (strict_required_status_checks_policy false, 2026-11-03).
            # A run still going, or none started yet, means "keep waiting";
            # a success too, until the merge. Only each workflow's newest run
            # counts, so a duplicate cancelled by its newer run does not.
            # Skipped runs (another event's trigger that did nothing) are
            # dropped first, so they never hide an earlier failure.
            # A failed read is not a failure.
            failed=$(gh run list --commit "$head" --json workflowName,conclusion,createdAt \
              --jq 'map(select(.conclusion != "skipped")) | group_by(.workflowName) | map(max_by(.createdAt))
                | map(select(.conclusion | IN("failure", "cancelled", "timed_out", "startup_failure"))) | length' \
              || true)
            if [ "${failed:-0}" != 0 ]; then outcome=failed; break; fi
            echo "$(date -u +%H:%M:%S) waiting for #${pr} (${state}) to land"
            sleep "$POLL_SECONDS"
          done
          case "$outcome" in
            none)     echo "no open deploy PR (or it has landed)" ;;
            *)        echo "::warning::stopped waiting for deploy PR #${pr:-?}: ${outcome}" ;;
          esac
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      - name: Mint an App token for clusters
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RUNNER_APP_ID }}
          private-key: ${{ secrets.RUNNER_APP_PRIVATE_KEY }}
          owner: eh-homelab
          repositories: clusters
          permission-contents: write
          permission-pull-requests: write

      - name: Check out clusters main
        uses: actions/checkout@v7
        with:
          repository: eh-homelab/clusters
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          path: clusters

      # The durable sessions worker (#1056), resolved like the agent, but only
      # when a manifest runs it: one without its line needs no image,
      # so a build from before 5e, or a still-private package, costs no wait.
      # Its job can finish after the API's, so it waits up to 20 minutes. The pin step fails when
      # the manifest names the image and this found nothing.
      - name: Resolve the agent-durable image
        id: agent-durable
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! grep -sqE "^\s*(- )?image:.*${AGENT_DURABLE_IMAGE//./\\.}" "clusters/${MANIFEST}" "clusters/${MANIFEST_AGENT_DURABLE}"; then
            echo "neither clusters/${MANIFEST} nor clusters/${MANIFEST_AGENT_DURABLE} runs agent-durable; not resolving it"
            echo "digest=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref="${AGENT_DURABLE_IMAGE}:${VERSION}"
          digest=""
          for _ in $(seq 120); do
            digest=$(docker buildx imagetools inspect "$ref" 2>/dev/null | awk '/^Digest:/ {print $2; exit}' || true)
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] && break
            echo "$(date -u +%H:%M:%S) $ref not published yet; waiting"
            sleep 10
          done
          if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "$ref -> $digest"
          else
            echo "::warning::could not resolve $ref (got '$digest')"
            digest=""
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The slicer worker (#3822), resolved like agent-durable but only when
      # its manifest exists and names the image. Its `slicer` job is
      # continue-on-error, so a build can legitimately have no image: this
      # waits up to 10 minutes, then warns and outputs an empty digest, and
      # the pin step keeps the current pin rather than failing the deploy.
      - name: Resolve the slicer image
        id: slicer
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! grep -sqE "^\s*(- )?image:.*${SLICER_IMAGE//./\\.}" "clusters/${MANIFEST_SLICER}"; then
            echo "clusters/${MANIFEST_SLICER} is absent or does not run the slicer; not resolving it"
            echo "digest=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref="${SLICER_IMAGE}:${VERSION}"
          digest=""
          for _ in $(seq 60); do
            digest=$(docker buildx imagetools inspect "$ref" 2>/dev/null | awk '/^Digest:/ {print $2; exit}' || true)
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] && break
            echo "$(date -u +%H:%M:%S) $ref not published yet; waiting"
            sleep 10
          done
          if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "$ref -> $digest"
          else
            echo "::warning::could not resolve $ref (got '$digest'); the slicer pin stays as it is"
            digest=""
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The profile-fetch worker (#6625), resolved like the slicer: only when its
      # manifest exists and names the image, and an image its continue-on-error
      # job did not publish is a warning and an empty digest.
      - name: Resolve the profile-fetch image
        id: profile-fetch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! grep -sqE "^\s*(- )?image:.*${PROFILE_FETCH_IMAGE//./\\.}" "clusters/${MANIFEST_PROFILE_FETCH}"; then
            echo "clusters/${MANIFEST_PROFILE_FETCH} is absent or does not run the profile-fetch worker; not resolving it"
            echo "digest=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref="${PROFILE_FETCH_IMAGE}:${VERSION}"
          digest=""
          for _ in $(seq 60); do
            digest=$(docker buildx imagetools inspect "$ref" 2>/dev/null | awk '/^Digest:/ {print $2; exit}' || true)
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] && break
            echo "$(date -u +%H:%M:%S) $ref not published yet; waiting"
            sleep 10
          done
          if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "$ref -> $digest"
          else
            echo "::warning::could not resolve $ref (got '$digest'); the profile-fetch pin stays as it is"
            digest=""
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The agent's Playwright MCP browser (#7027, #7546), resolved like the
      # profile-fetch worker: only when its manifest exists and names the image,
      # and an image its continue-on-error job did not publish is a warning and
      # an empty digest.
      - name: Resolve the playwright-mcp image
        id: playwright-mcp
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! grep -sqE "^\s*(- )?image:.*${PLAYWRIGHT_MCP_IMAGE//./\\.}" "clusters/${MANIFEST_PLAYWRIGHT_MCP}"; then
            echo "clusters/${MANIFEST_PLAYWRIGHT_MCP} is absent or does not run ${PLAYWRIGHT_MCP_IMAGE}; not resolving it"
            echo "digest=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref="${PLAYWRIGHT_MCP_IMAGE}:${VERSION}"
          digest=""
          for _ in $(seq 60); do
            digest=$(docker buildx imagetools inspect "$ref" 2>/dev/null | awk '/^Digest:/ {print $2; exit}' || true)
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] && break
            echo "$(date -u +%H:%M:%S) $ref not published yet; waiting"
            sleep 10
          done
          if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "$ref -> $digest"
          else
            echo "::warning::could not resolve $ref (got '$digest'); the playwright-mcp pin stays as it is"
            digest=""
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The agent fleet chat server (#7903): only when its manifest exists and
      # names the image. build-go-image.yml publishes it, only for a push that
      # touches Go and in a few minutes, well before Build Image ends, so it is
      # looked up once with no wait: a version with no fleet image is a
      # warning and an empty digest, and the pin stays.
      - name: Resolve the fleet image
        id: fleet
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! grep -sqE "^\s*(- )?image:.*${FLEET_IMAGE//./\\.}" "clusters/${MANIFEST_FLEET}"; then
            echo "clusters/${MANIFEST_FLEET} is absent or does not run ${FLEET_IMAGE}; not resolving it"
            echo "digest=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref="${FLEET_IMAGE}:${VERSION}"
          digest=$(docker buildx imagetools inspect "$ref" 2>/dev/null | awk '/^Digest:/ {print $2; exit}' || true)
          if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "$ref -> $digest"
          else
            echo "::warning::no $ref (got '$digest'); the fleet pin stays as it is"
            digest=""
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The API in Go (#7667), resolved like the slicer: only when the API's
      # manifest names the image, and an image its continue-on-error job did
      # not publish is a warning and an empty digest.
      - name: Resolve the core image
        id: core
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! grep -sqE "^\s*(- )?image:.*${CORE_IMAGE//./\\.}" "clusters/${MANIFEST}"; then
            echo "clusters/${MANIFEST} does not run ${CORE_IMAGE}; not resolving it"
            echo "digest=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref="${CORE_IMAGE}:${VERSION}"
          digest=""
          for _ in $(seq 60); do
            digest=$(docker buildx imagetools inspect "$ref" 2>/dev/null | awk '/^Digest:/ {print $2; exit}' || true)
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] && break
            echo "$(date -u +%H:%M:%S) $ref not published yet; waiting"
            sleep 10
          done
          if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "$ref -> $digest"
          else
            echo "::warning::could not resolve $ref (got '$digest'); the core pin stays as it is"
            digest=""
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The printer camera relay, recorder and live edge (#7997), resolved like
      # the slicer: each only when its file exists and names its image, and an
      # image their continue-on-error `camera` job did not publish is a warning
      # and an empty digest. The three legs of that job build side by side, so
      # they share one wait of up to 10 minutes.
      - name: Resolve the camera images
        id: camera
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          declare -A image=([relay]=$CAMERA_RELAY_IMAGE [recorder]=$CAMERA_RECORDER_IMAGE [edge]=$CAMERA_EDGE_IMAGE)
          declare -A manifest=([relay]=$MANIFEST_CAMERA_RELAY [recorder]=$MANIFEST_CAMERA_RECORDER [edge]=$MANIFEST_CAMERA_EDGE)
          declare -A digest=([relay]="" [recorder]="" [edge]="")
          wanted=()
          for part in relay recorder edge; do
            if grep -sqE "^\s*(- )?image:.*${image[$part]//./\\.}" "clusters/${manifest[$part]}"; then
              wanted+=("$part")
            else
              echo "clusters/${manifest[$part]} is absent or does not run ${image[$part]}; not resolving it"
            fi
          done
          for _ in $(seq 60); do
            left=()
            for part in "${wanted[@]}"; do
              [[ "${digest[$part]}" =~ ^sha256:[0-9a-f]{64}$ ]] && continue
              ref="${image[$part]}:${VERSION}"
              d=$(docker buildx imagetools inspect "$ref" 2>/dev/null | awk '/^Digest:/ {print $2; exit}' || true)
              if [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                digest[$part]=$d
                echo "$ref -> $d"
              else
                left+=("$part")
              fi
            done
            [ "${#left[@]}" -gt 0 ] || break
            echo "$(date -u +%H:%M:%S) not published yet for ${VERSION}: ${left[*]}; waiting"
            sleep 10
          done
          for part in "${wanted[@]}"; do
            [[ "${digest[$part]}" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || echo "::warning::could not resolve ${image[$part]}:${VERSION}; the camera-${part} pins stay as they are"
          done
          for part in relay recorder edge; do
            echo "${part}=${digest[$part]}" >> "$GITHUB_OUTPUT"
          done

      # The sessions' shell sandbox (#5864), resolved like the slicer, but only
      # when a file under the manifests' or the overlay's directory names it.
      - name: Resolve the sandbox image
        id: sandbox
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! grep -rsqF "${SANDBOX_IMAGE}" "clusters/$(dirname "$MANIFEST")" "clusters/$(dirname "$KUSTOMIZATION")" "clusters/${CAMERA_DIR}"; then
            echo "clusters does not run ${SANDBOX_IMAGE}; not resolving it"
            echo "digest=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref="${SANDBOX_IMAGE}:${VERSION}"
          digest=""
          for _ in $(seq 60); do
            digest=$(docker buildx imagetools inspect "$ref" 2>/dev/null | awk '/^Digest:/ {print $2; exit}' || true)
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] && break
            echo "$(date -u +%H:%M:%S) $ref not published yet; waiting"
            sleep 10
          done
          if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "$ref -> $digest"
          else
            echo "::warning::could not resolve $ref (got '$digest'); the sandbox pins stay as they are"
            digest=""
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The dashboards clusters vendors (eh-homelab/clusters#3734) may only be
      # refreshed from a revision that has them: one without deploy/grafana (a
      # rollback to a build from before #988) keeps the copy clusters has.
      # Only a 404 of its kustomization.yaml means "absent". With it, every
      # entry of the directory is fetched into a scratch directory (`dir`) for
      # the edit step, each file checked against its git blob sha, so the bytes
      # are the ones at REVISION. A subdirectory or other non-file entry becomes
      # an empty directory there, and a file whose name is not
      # kustomization.yaml or `[a-z0-9-]+.json` an empty file, which the edit
      # step rejects. Any other failure is retried with a backoff, and one that
      # persists (or a hash that does not match) is `unknown`: the edit step
      # fails on it only when clusters vendors the dashboards, so until then a
      # GitHub API error cannot stop an image deploy (#1179).
      # deploy-pin.test.sh runs this.
      - name: Fetch deploy/grafana at the revision
        id: grafana
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/grafana-at-revision"
          rm -rf "$dir" && mkdir -p "$dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          api="repos/${GITHUB_REPOSITORY}/contents/deploy/grafana"
          # `fetch <out> <gh api args>...`: 0 when fetched into <out>, 2 on a
          # 404, 1 when it still fails after five tries; $err holds the error.
          fetch() {
            local out=$1 attempt; shift
            for attempt in 1 2 3 4 5; do
              if err=$(gh api "$@" 2>&1 > "$out"); then
                return 0
              elif grep -q 'HTTP 404' <<< "$err"; then
                return 2
              fi
              echo "attempt ${attempt}: ${err}"
              [ "$attempt" -eq 5 ] || sleep $((attempt * 10))
            done
            return 1
          }
          unknown() { # reason
            echo "::warning::could not tell whether ${REVISION} has deploy/grafana, or read it: $1"
            echo "present=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          }
          rc=0
          fetch /dev/null "${api}/kustomization.yaml?ref=${REVISION}" --silent || rc=$?
          case "$rc" in
            0) ;;
            2) echo "present=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            *) unknown "$err" ;;
          esac
          listing="${RUNNER_TEMP}/grafana-listing.json"
          fetch "$listing" "${api}?ref=${REVISION}" || unknown "the listing: $err"
          jq -e 'type == "array"' "$listing" > /dev/null 2>&1 || unknown "the listing is not a directory's"
          # The contents API lists at most 1,000 entries; a listing that long
          # may be cut short, and a partial copy must not deploy.
          jq -e 'length < 1000' "$listing" > /dev/null || unknown "the listing has 1,000 entries or more, the contents API's cap"
          # A tab or newline in a name would be escaped by @tsv below and
          # reach the checks under another name: refuse it here, by name.
          jq -e 'all(.[]; .name | test("^[^\t\n/]+$"))' "$listing" > /dev/null 2>&1 \
            || unknown "the listing names an entry with a tab, newline or slash: $(jq -c '[.[].name | select(test("^[^\t\n/]+$") | not)]' "$listing")"
          jq -e 'all(.[]; .sha | type == "string" and test("^[0-9a-f]{40}$"))' "$listing" > /dev/null 2>&1 \
            || unknown "the listing has an entry without a 40-hex blob sha"
          while IFS=$'\t' read -r type sha name; do
            case "$name" in . | ..) unknown "the listing names '${name}'" ;; esac
            if [ "$type" != file ]; then
              mkdir "$dir/$name"
            elif [[ "$name" =~ ^(kustomization\.yaml|[a-z0-9-]+\.json)$ ]]; then
              fetch "$dir/$name" -H "Accept: application/vnd.github.raw+json" "${api}/${name}?ref=${REVISION}" \
                || unknown "${name}: $err"
              [ "$(git hash-object "$dir/$name")" = "$sha" ] \
                || unknown "${name} as fetched does not hash to its blob ${sha}"
            else
              : > "$dir/$name"
            fi
          done < <(jq -r '.[] | [.type, .sha, .name] | @tsv' "$listing")
          echo "present=true" >> "$GITHUB_OUTPUT"

      # sed against anchored lines rather than a YAML rewrite: yq would
      # reflow the whole document and bury the one-line change in noise. Each
      # target must match exactly once, before and after, or the edit aborts.
      - name: Pin the digest and record provenance
        id: edit
        working-directory: clusters
        env:
          DIGEST: ${{ inputs.digest }}
          AGENT_DIGEST: ${{ steps.agent.outputs.digest }}
          AGENT_DURABLE_DIGEST: ${{ steps.agent-durable.outputs.digest }}
          SLICER_DIGEST: ${{ steps.slicer.outputs.digest }}
          PROFILE_FETCH_DIGEST: ${{ steps.profile-fetch.outputs.digest }}
          PLAYWRIGHT_MCP_DIGEST: ${{ steps.playwright-mcp.outputs.digest }}
          FLEET_DIGEST: ${{ steps.fleet.outputs.digest }}
          CORE_DIGEST: ${{ steps.core.outputs.digest }}
          CAMERA_RELAY_DIGEST: ${{ steps.camera.outputs.relay }}
          CAMERA_RECORDER_DIGEST: ${{ steps.camera.outputs.recorder }}
          CAMERA_EDGE_DIGEST: ${{ steps.camera.outputs.edge }}
          SANDBOX_DIGEST: ${{ steps.sandbox.outputs.digest }}
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
          SOURCE_URL: ${{ inputs.source_url }}
          DASHBOARD_AT_REVISION: ${{ steps.grafana.outputs.present }}
          DASHBOARD_SOURCE: ${{ steps.grafana.outputs.dir }}
        run: |
          set -euo pipefail
          expect_one() { # manifest pattern description
            local n; n=$(grep -cE "$2" "$1" || true)
            [ "$n" -eq 1 ] || { echo "::error file=$1::expected exactly one $3 line, found $n"; exit 1; }
          }

          # One manifest, one Deployment: every guard below is per file.
          pin() { # manifest deployment
            local target=$1 deployment=$2
            # `[:@]` ends the repository name, so the pattern matches this image
            # and never a sibling package that shares its prefix: the agent
            # sidecar, ghcr.io/eh-homelab/scadbuddy-agent, runs in the same pod
            # and has its own image line in the same manifest.
            # A bare `image: ghcr.io/eh-homelab/scadbuddy` with no tag or digest
            # therefore no longer matches, and the run fails "found 0". That is
            # deliberate: clusters pins by digest (an untagged ref would pull
            # the Nexus proxy's day-old `latest`), and deploy-pin.test.sh pins it.
            local image_line="^(\s*)image: ${IMAGE//./\\.}[:@][^[:space:]]*\$"
            expect_one "$target" "$image_line" "image"
            expect_one "$target" '^\s*scadbuddy\.eh-homelab\.io/version: ' "version annotation"
            expect_one "$target" '^\s*scadbuddy\.eh-homelab\.io/revision: ' "revision annotation"
            expect_one "$target" '^\s*scadbuddy\.eh-homelab\.io/source: ' "source annotation"

            # `|` as the sed delimiter: none of the substituted values (an image
            # ref, a tag, a SHA, a github.com URL) can contain it.
            # The `unverifiable` line is an escape hatch for a HAND-written pin
            # of an image that cannot report its commit; this pipeline always
            # writes a full-SHA revision, so a leftover one would make every
            # later verify run warn about a pin that no longer exists. Drop it.
            sed -i -E \
              -e "s|${image_line}|\1image: ${IMAGE}:${VERSION}@${DIGEST}|" \
              -e "s|^(\s*)scadbuddy\.eh-homelab\.io/version: .*\$|\1scadbuddy.eh-homelab.io/version: \"${VERSION}\"|" \
              -e "s|^(\s*)scadbuddy\.eh-homelab\.io/revision: .*\$|\1scadbuddy.eh-homelab.io/revision: \"${REVISION}\"|" \
              -e "s|^(\s*)scadbuddy\.eh-homelab\.io/source: .*\$|\1scadbuddy.eh-homelab.io/source: \"${SOURCE_URL}\"|" \
              -e '/^\s*scadbuddy\.eh-homelab\.io\/unverifiable: /d' \
              "$target"

            # Round-trip every rewritten line, not just the image: a sed that
            # silently matched nothing would otherwise merge stale provenance.
            expect_one "$target" "^\s*image: ${IMAGE//./\\.}:${VERSION//./\\.}@${DIGEST}\$" "pinned image"
            expect_one "$target" "^\s*scadbuddy\.eh-homelab\.io/version: \"${VERSION//./\\.}\"\$" "rewritten version annotation"
            expect_one "$target" "^\s*scadbuddy\.eh-homelab\.io/revision: \"${REVISION}\"\$" "rewritten revision annotation"
            expect_one "$target" "^\s*scadbuddy\.eh-homelab\.io/source: \"${SOURCE_URL//./\\.}\"\$" "rewritten source annotation"
            if grep -qE '^\s*scadbuddy\.eh-homelab\.io/unverifiable: ' "$target"; then
              echo "::error file=$target::an unverifiable annotation survived the rewrite; a pipeline pin must not carry one"; exit 1
            fi
            # Scoped to the container just pinned, not a file-wide grep: a
            # second container with the right policy must not mask drift here.
            # Selected by the pinned image rather than by container name, so
            # the worker's container needs no agreed name.
            # Counted after parsing, not only as text: a YAML alias (`image: *img`)
            # gives a second container the pinned image without a second line.
            local selector='select(.kind == "Deployment" and .metadata.name == strenv(DEPLOYMENT)) | .spec.template.spec.containers[] | select(.image == strenv(PINNED))'
            local count policy
            count=$(DEPLOYMENT="$deployment" PINNED="${IMAGE}:${VERSION}@${DIGEST}" yq eval-all -N \
              "[${selector}] | length" "$target" | awk '{ n += $1 } END { print n + 0 }')
            [ "$count" -eq 1 ] \
              || { echo "::error file=$target::expected exactly one container with the pinned image in the ${deployment} Deployment, found ${count}"; exit 1; }
            policy=$(DEPLOYMENT="$deployment" PINNED="${IMAGE}:${VERSION}@${DIGEST}" yq eval-all -N \
              "${selector} | .imagePullPolicy // \"\"" "$target")
            [ "$policy" = "IfNotPresent" ] \
              || { echo "::error file=$target::the ${deployment} Deployment's pinned container must set imagePullPolicy: IfNotPresent once the image is digest-pinned (found '${policy:-<unset>}')"; exit 1; }
          }

          # The agent sidecar's line (#738). Required: clusters runs the agent
          # in the API's pod, so a manifest without its line is a dropped
          # sidecar to catch, not a layout to deploy around. The provenance
          # annotations are the Deployment's and are already written above.
          pin_agent() { # manifest
            local target=$1
            local agent_line="^(\s*)image: ${AGENT_IMAGE//./\\.}[:@][^[:space:]]*\$"
            expect_one "$target" "$agent_line" "agent image"
            sed -i -E "s|${agent_line}|\1image: ${AGENT_IMAGE}:${VERSION}@${AGENT_DIGEST}|" "$target"
            expect_one "$target" "^\s*image: ${AGENT_IMAGE//./\\.}:${VERSION//./\\.}@${AGENT_DIGEST}\$" "pinned agent image"
          }

          # The durable sessions worker's line (#1056). Optional until clusters
          # runs it: a manifest with no line deploys without it. A manifest that
          # names it gets this build's image or fails, never a stale pin beside
          # a new agent. Sets $durable to
          # `pinned` when it rewrote the line.
          durable=none
          pin_agent_durable() { # manifest
            local target=$1 n
            local durable_line="^(\s*)image: ${AGENT_DURABLE_IMAGE//./\\.}[:@][^[:space:]]*\$"
            n=$(grep -cE "$durable_line" "$target" || true)
            if [ "$n" -eq 0 ]; then
              # An image line for it that the pattern misses (no tag or
              # digest, a trailing comment) is a near miss, not "not run yet".
              if grep -qE "^\s*(- )?image:.*${AGENT_DURABLE_IMAGE//./\\.}" "$target"; then
                echo "::error file=$target::has an image line for ${AGENT_DURABLE_IMAGE} that is not exactly 'image: ${AGENT_DURABLE_IMAGE}:<tag>@<digest>'"; exit 1
              fi
              echo "::notice::${target} does not run agent-durable yet; not pinning it"
              return 0
            fi
            expect_one "$target" "$durable_line" "agent-durable image"
            [[ "${AGENT_DURABLE_DIGEST:-}" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || { echo "::error file=$target::runs ${AGENT_DURABLE_IMAGE}, but no image was published for ${VERSION}"; exit 1; }
            sed -i -E "s|${durable_line}|\1image: ${AGENT_DURABLE_IMAGE}:${VERSION}@${AGENT_DURABLE_DIGEST}|" "$target"
            expect_one "$target" "^\s*image: ${AGENT_DURABLE_IMAGE//./\\.}:${VERSION//./\\.}@${AGENT_DURABLE_DIGEST}\$" "pinned agent-durable image"
            durable=pinned
          }

          # The slicer worker's line (#3822), in its own Deployment's file.
          # Optional until clusters has the file. Once it does, the file must
          # carry exactly one line for the image, but a build that published no
          # slicer image keeps whatever the file pins and warns: the slicer is
          # idle until slices are routed to it and its job may fail on its own.
          # Sets $slicer to `pinned`, `kept` or (file absent) `none`.
          slicer=none
          pin_slicer() { # manifest
            local target=$1
            local slicer_line="^(\s*)image: ${SLICER_IMAGE//./\\.}[:@][^[:space:]]*\$"
            expect_one "$target" "$slicer_line" "slicer image"
            if [[ ! "${SLICER_DIGEST:-}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::warning file=$target::no ${SLICER_IMAGE} image was published for ${VERSION}; keeping the slicer pin as it is"
              slicer=kept
              return 0
            fi
            sed -i -E "s|${slicer_line}|\1image: ${SLICER_IMAGE}:${VERSION}@${SLICER_DIGEST}|" "$target"
            expect_one "$target" "^\s*image: ${SLICER_IMAGE//./\\.}:${VERSION//./\\.}@${SLICER_DIGEST}\$" "pinned slicer image"
            slicer=pinned
          }

          # The profile-fetch worker's line (#6625), in its own Deployment's file,
          # exactly as the slicer's: optional until clusters has the file, then
          # exactly one line, and a build with no image keeps the pin and warns.
          # Sets $profile_fetch to `pinned`, `kept` or (file absent) `none`.
          profile_fetch=none
          pin_profile_fetch() { # manifest
            local target=$1
            local pf_line="^(\s*)image: ${PROFILE_FETCH_IMAGE//./\\.}[:@][^[:space:]]*\$"
            expect_one "$target" "$pf_line" "profile-fetch image"
            if [[ ! "${PROFILE_FETCH_DIGEST:-}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::warning file=$target::no ${PROFILE_FETCH_IMAGE} image was published for ${VERSION}; keeping the profile-fetch pin as it is"
              profile_fetch=kept
              return 0
            fi
            sed -i -E "s|${pf_line}|\1image: ${PROFILE_FETCH_IMAGE}:${VERSION}@${PROFILE_FETCH_DIGEST}|" "$target"
            expect_one "$target" "^\s*image: ${PROFILE_FETCH_IMAGE//./\\.}:${VERSION//./\\.}@${PROFILE_FETCH_DIGEST}\$" "pinned profile-fetch image"
            profile_fetch=pinned
          }

          # The Playwright MCP browser's line (#7027, #7546), in its own
          # Deployment's file (eh-homelab/clusters#4237), exactly as the
          # profile-fetch worker's: optional until clusters has the file, then
          # exactly one line, and a build with no image keeps the pin and warns.
          # Sets $playwright_mcp to `pinned`, `kept` or (file absent) `none`.
          playwright_mcp=none
          pin_playwright_mcp() { # manifest
            local target=$1
            local pm_line="^(\s*)image: ${PLAYWRIGHT_MCP_IMAGE//./\\.}[:@][^[:space:]]*\$"
            expect_one "$target" "$pm_line" "playwright-mcp image"
            if [[ ! "${PLAYWRIGHT_MCP_DIGEST:-}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::warning file=$target::no ${PLAYWRIGHT_MCP_IMAGE} image was published for ${VERSION}; keeping the playwright-mcp pin as it is"
              playwright_mcp=kept
              return 0
            fi
            sed -i -E "s|${pm_line}|\1image: ${PLAYWRIGHT_MCP_IMAGE}:${VERSION}@${PLAYWRIGHT_MCP_DIGEST}|" "$target"
            expect_one "$target" "^\s*image: ${PLAYWRIGHT_MCP_IMAGE//./\\.}:${VERSION//./\\.}@${PLAYWRIGHT_MCP_DIGEST}\$" "pinned playwright-mcp image"
            playwright_mcp=pinned
          }

          # The fleet chat server's line (#7903), in its own Deployment's file,
          # exactly as playwright-mcp's. Sets $fleet to `pinned`, `kept` or
          # (file absent) `none`.
          fleet=none
          pin_fleet() { # manifest
            local target=$1
            local fl_line="^(\s*)image: ${FLEET_IMAGE//./\\.}[:@][^[:space:]]*\$"
            expect_one "$target" "$fl_line" "fleet image"
            if [[ ! "${FLEET_DIGEST:-}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::warning file=$target::no ${FLEET_IMAGE} image was published for ${VERSION}; keeping the fleet pin as it is"
              fleet=kept
              return 0
            fi
            sed -i -E "s|${fl_line}|\1image: ${FLEET_IMAGE}:${VERSION}@${FLEET_DIGEST}|" "$target"
            expect_one "$target" "^\s*image: ${FLEET_IMAGE//./\\.}:${VERSION//./\\.}@${FLEET_DIGEST}\$" "pinned fleet image"
            fleet=pinned
          }

          # The API in Go's line (#7667), the `core` container in the API's
          # manifest, as the slicer's: optional until the manifest names it,
          # then exactly one line, and a build with no image keeps the pin and
          # warns. Sets $core to `pinned`, `kept` or (no line) `none`.
          core=none
          pin_core() { # manifest
            local target=$1 n
            local core_line="^(\s*)image: ${CORE_IMAGE//./\\.}[:@][^[:space:]]*\$"
            n=$(grep -cE "$core_line" "$target" || true)
            if [ "$n" -eq 0 ]; then
              # An image line for it that the pattern misses (no tag or
              # digest, a trailing comment) is a near miss, not "not run yet".
              if grep -qE "^\s*(- )?image:.*${CORE_IMAGE//./\\.}" "$target"; then
                echo "::error file=$target::has an image line for ${CORE_IMAGE} that is not exactly 'image: ${CORE_IMAGE}:<tag>@<digest>'"; exit 1
              fi
              echo "::notice::${target} does not run core yet; not pinning it"
              return 0
            fi
            expect_one "$target" "$core_line" "core image"
            if [[ ! "${CORE_DIGEST:-}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::warning file=$target::no ${CORE_IMAGE} image was published for ${VERSION}; keeping the core pin as it is"
              core=kept
              return 0
            fi
            sed -i -E "s|${core_line}|\1image: ${CORE_IMAGE}:${VERSION}@${CORE_DIGEST}|" "$target"
            expect_one "$target" "^\s*image: ${CORE_IMAGE//./\\.}:${VERSION//./\\.}@${CORE_DIGEST}\$" "pinned core image"
            core=pinned
          }

          # The camera relay's, recorder's and live edge's lines (#7997), each in
          # its own Deployment's file under $CAMERA_DIR: optional until clusters
          # has the file, then exactly two lines (MediaMTX and the controller run
          # one image), equal to each other, and a build with no image keeps the
          # pins and warns. A comment that names the API build the pins came
          # from ("the build of the API's sha-<7>") moves with them, so it stays
          # true. Sets $camera to `pinned` or `kept`.
          camera=none
          pin_camera() { # manifest image digest part
            local target=$1 cam_image=$2 cam_digest=$3 part=$4 n
            local cam_line="^(\s*)image: ${cam_image//./\\.}[:@][^[:space:]]*\$"
            n=$(grep -cE "$cam_line" "$target" || true)
            [ "$n" -eq 2 ] \
              || { echo "::error file=$target::expected exactly two camera-${part} image lines (mediamtx and controller), found $n"; exit 1; }
            n=$(grep -E "$cam_line" "$target" | sed -E 's/^\s*image: //' | sort -u | wc -l)
            [ "$n" -eq 1 ] \
              || { echo "::error file=$target::its two camera-${part} image lines differ; both containers must run one image"; exit 1; }
            if [[ ! "$cam_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::warning file=$target::no ${cam_image} image was published for ${VERSION}; keeping the camera-${part} pins as they are"
              camera=kept
              return 0
            fi
            # The version ends at the first character a tag cannot hold, and
            # never at a dot: a sentence's full stop follows it.
            sed -i -E \
              -e "s|${cam_line}|\1image: ${cam_image}:${VERSION}@${cam_digest}|" \
              -e "s|^(\s*#.*the build of the API's )[A-Za-z0-9._-]*[A-Za-z0-9_-]|\1${VERSION}|" \
              "$target"
            n=$(grep -cE "^\s*image: ${cam_image//./\\.}:${VERSION//./\\.}@${cam_digest}\$" "$target" || true)
            [ "$n" -eq 2 ] \
              || { echo "::error file=$target::expected exactly two pinned camera-${part} image lines, found $n"; exit 1; }
            camera=pinned
          }

          # True when transformers[] holds a NamespaceTransformer with
          # `unsetOnly` the YAML boolean true: as a map, as an inline YAML
          # string, or as a relative path (resolved against the overlay's
          # directory) to a file that parses to the same or to a directory
          # whose kustomization lists one in its resources (#1210).
          ns_check='select(.kind == "NamespaceTransformer" and (.unsetOnly | tag) == "!!bool" and .unsetOnly == true)'
          ns_path_ok() { # path
            local path=$1 k r
            if [ -f "$path" ]; then
              yq -e "$ns_check" "$path" > /dev/null 2>&1; return
            fi
            for k in kustomization.yaml kustomization.yml Kustomization; do
              [ -f "$path/$k" ] || continue
              while IFS= read -r r; do
                case "$r" in /* | *..* | *:*) continue ;; esac
                ns_path_ok "$path/$r" && return 0
              done < <(yq '(.resources // [])[] | select(tag == "!!str")' "$path/$k" 2>/dev/null)
              return 1
            done
            return 1
          }
          ns_transformer_ok() { # kustomization
            local target=$1 dir entry s
            dir=$(dirname "$target")
            while IFS= read -r entry; do
              if printf '%s\n' "$entry" | yq -p=json -e 'tag == "!!map"' > /dev/null 2>&1; then
                printf '%s\n' "$entry" | yq -p=json -e "$ns_check" > /dev/null 2>&1 && return 0
              else
                s=$(printf '%s\n' "$entry" | yq -p=json '.' 2>/dev/null) || continue
                case "$s" in
                  *$'\n'* | *:* | /* | *..*) printf '%s\n' "$s" | yq -e "$ns_check" > /dev/null 2>&1 && return 0 ;;
                  *) ns_path_ok "$dir/$s" && return 0 ;;
                esac
              fi
            done < <(yq -o=json -I=0 '(.transformers // [])[]' "$target" 2>/dev/null)
            return 1
          }

          # The dashboards (#988, spec 2026-10-01 §7), vendored in clusters
          # (eh-homelab/clusters#3734): $DASHBOARD_DIR holds a byte-for-byte
          # copy of this repo's deploy/grafana (kustomization.yaml and every
          # *.json) and `.revision`, the 40-hex revision it was copied from,
          # and the overlay lists that directory. Argo CD's repo-server fetching
          # the old remote resource (`deploy/grafana?ref=<sha>`) failed in prod
          # and wedged syncs, so an overlay that still names it in any form
          # fails the deploy. Optional, unlike the agent: an overlay with no
          # such directory deploys the images alone. Sets $dashboard to
          # `vendored` when it refreshed the copy, or `kept` when REVISION has
          # no deploy/grafana; a global, not a printed value, so its ::error
          # lines reach the log instead of a command substitution.
          dashboard=none
          vendor_dashboard() { # kustomization
            local target=$1 dir=$DASHBOARD_DIR src=${DASHBOARD_SOURCE:-} rel n f name stripped
            local name_re='^(kustomization\.yaml|[a-z0-9-]+\.json)$'
            [ -f "$target" ] || { echo "::error::${target} is not in clusters; cannot tell whether it vendors the dashboards"; exit 1; }
            # Comments stripped first: a note about where the copy came from is
            # not the remote line. Captured first: `sed | grep -q` under
            # pipefail fails with 141 when grep exits on a match while sed is
            # still writing, and the `if` would read a match as none.
            stripped=$(sed -E 's/(^|[[:space:]])#.*$//' "$target")
            if grep -qiE 'eh-homelab/scadbuddy(\.git)?/+deploy/grafana' <<< "$stripped"; then
              echo "::error file=$target::still names eh-homelab/ScadBuddy//deploy/grafana, the remote resource Argo CD's repo-server failed to fetch; clusters vendors the dashboards in ${dir}/ with a .revision file instead (eh-homelab/clusters#3734)"; exit 1
            fi
            if [ ! -e "$dir" ]; then
              echo "::notice::${dir} is not in clusters; pinning the images only"
              return 0
            fi
            [ -f "$dir/.revision" ] \
              || { echo "::error file=$dir::exists but has no .revision, so it is not the vendored copy this deploy refreshes (eh-homelab/clusters#3734)"; exit 1; }
            # Nothing but the copy and .revision: any other entry would survive
            # the refresh, and the directory would no longer be deploy/grafana.
            while IFS= read -r -d '' f; do
              name=${f##*/}
              if [ -L "$f" ] || [ ! -f "$f" ] || ! [[ "$name" == .revision || "$name" =~ $name_re ]]; then
                echo "::error file=$f::is not kustomization.yaml, a [a-z0-9-]+.json dashboard or .revision; the vendored copy must hold only deploy/grafana's files (eh-homelab/clusters#3734)"; exit 1
              fi
            done < <(find "$dir" -mindepth 1 -maxdepth 1 -print0)
            rel=${dir#"$(dirname "$target")/"}
            n=$(REL="$rel" yq '[(.resources // [])[] | select(tag == "!!str") | sub("^\./"; "") | sub("/$"; "") | select(. == strenv(REL))] | length' "$target")
            [ "$n" -eq 1 ] \
              || { echo "::error file=$target::lists ${rel}/ (or ${rel}, ./${rel}/) ${n} time(s) in resources, not once, so the vendored dashboards would not deploy as one copy"; exit 1; }
            # A top-level namespace: would move the ConfigMaps out of
            # cattle-dashboards, where the sidecar never sees them.
            if yq -e '.namespace' "$target" > /dev/null 2>&1; then
              echo "::error file=$target::has a top-level namespace:, which moves the dashboard ConfigMaps out of cattle-dashboards; use a NamespaceTransformer with unsetOnly: true (clusters#1596 Phase 5)"; exit 1
            fi
            if ! ns_transformer_ok "$target"; then
              echo "::error file=$target::vendors the dashboards but has no NamespaceTransformer with unsetOnly: true (a YAML boolean; the string \"true\" does not count) in transformers, inline, as a file or as a directory (clusters#1596 Phase 5)"; exit 1
            fi
            if [ "${DASHBOARD_AT_REVISION:-}" = unknown ]; then
              echo "::error file=$dir::could not tell whether ${REVISION} has deploy/grafana, or read it (see the step before), so the vendored dashboards cannot be refreshed"; exit 1
            fi
            # A rollback past #988: the images move, the dashboards stay as they are.
            if [ "${DASHBOARD_AT_REVISION:-}" != true ]; then
              echo "::warning file=$dir::${REVISION} has no deploy/grafana/kustomization.yaml; the vendored dashboards stay at their .revision"
              dashboard=kept
              return 0
            fi
            if [ -z "$src" ] || [ ! -f "$src/kustomization.yaml" ]; then
              echo "::error::the step before fetched no deploy/grafana/kustomization.yaml at ${REVISION}"; exit 1
            fi
            # Only kustomization.yaml and `[a-z0-9-]+.json`, all regular files:
            # anything else (a subdirectory, a README) would be dropped or
            # half-copied, and the copy would no longer be deploy/grafana.
            while IFS= read -r -d '' f; do
              name=${f##*/}
              if [ -L "$f" ] || [ ! -f "$f" ]; then
                echo "::error::deploy/grafana/${name} at ${REVISION} is not a regular file (a subdirectory?); only kustomization.yaml and *.json files are vendored"; exit 1
              fi
              [[ "$name" =~ $name_re ]] \
                || { echo "::error::deploy/grafana/${name} at ${REVISION} is not kustomization.yaml or a [a-z0-9-]+.json dashboard, so it cannot be vendored"; exit 1; }
            done < <(find "$src" -mindepth 1 -maxdepth 1 -print0)
            # Replace, not merge: a dashboard the revision dropped goes too.
            # "$src"/* never stays a literal `*`: $src holds kustomization.yaml
            # (checked above).
            find "$dir" -maxdepth 1 -type f \( -name '*.json' -o -name kustomization.yaml \) -delete
            cp -- "$src"/* "$dir/"
            for f in "$src"/*; do
              cmp -s "$f" "$dir/${f##*/}" \
                || { echo "::error file=$dir/${f##*/}::is not byte-identical to deploy/grafana/${f##*/} at ${REVISION}"; exit 1; }
            done
            if [ "$(find "$dir" -maxdepth 1 -type f \( -name '*.json' -o -name kustomization.yaml \) -printf '%f\n' | sort)" \
              != "$(find "$src" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)" ]; then
              echo "::error file=$dir::does not hold exactly deploy/grafana's files at ${REVISION}"; exit 1
            fi
            printf '%s\n' "$REVISION" > "$dir/.revision"
            dashboard=vendored
          }

          # Every string in a YAML file that names a ScadBuddy image (any
          # ghcr.io/eh-homelab/scadbuddy* package), one per line. Parsed, not
          # grepped: a comment that quotes an image line does not count, and an
          # alias counts where it is used.
          scadbuddy_refs() { # file
            REF_RE="^${IMAGE//./\\.}([-:@]|\$)" yq eval-all -N \
              'explode(.) | .. | select(tag == "!!str") | select(test(strenv(REF_RE)))' "$1"
          }
          # The files the final check reads: the manifests' directory, the
          # overlay's, where a kustomize `images:` entry could also name one,
          # and the camera Deployments' (#7997) once clusters has it.
          scanned() {
            local dirs=("$(dirname "$MANIFEST")" "$(dirname "$KUSTOMIZATION")")
            [ ! -d "$CAMERA_DIR" ] || dirs+=("$CAMERA_DIR")
            find "${dirs[@]}" -type f \( -name '*.yaml' -o -name '*.yml' \) | sort -u
          }

          manifests=("$MANIFEST")
          pin "$MANIFEST" scadbuddy
          pin_agent "$MANIFEST"
          pin_core "$MANIFEST"
          echo "core=$core" >> "$GITHUB_OUTPUT"
          # Every other file that runs the agent image, found by the image
          # rather than by name (#5037): scadbuddy-agent-worker.yaml, the
          # agent's Temporal workers in a Deployment of their own (#2726 Step
          # 6.2), runs it beside the API's sidecar on the same queues, so the
          # two must move together. Each such file gets exactly one line.
          while IFS= read -r f; do
            [ "$f" != "$MANIFEST" ] || continue
            # Captured first: `yq | grep -q` under pipefail fails with 141
            # when grep exits on a match while yq is still writing. A file
            # that does not parse is the final check's error, not this one's.
            refs=$(scadbuddy_refs "$f" 2>/dev/null) || continue
            if grep -qE "^${AGENT_IMAGE//./\\.}([:@]|\$)" <<< "$refs"; then
              pin_agent "$f"
              manifests+=("$f")
            fi
          done < <(scanned)
          pin_agent_durable "$MANIFEST"
          # Its own Deployment (it first ran as a sidecar in $MANIFEST). Once
          # the file exists it must run agent-durable, and $MANIFEST must not:
          # two pollers of one queue from two places is a half-done move.
          if [ -f "$MANIFEST_AGENT_DURABLE" ]; then
            if [ "$durable" = pinned ]; then
              echo "::error file=$MANIFEST::runs agent-durable, but ${MANIFEST_AGENT_DURABLE} exists; it belongs in one of them"; exit 1
            fi
            pin_agent_durable "$MANIFEST_AGENT_DURABLE"
            if [ "$durable" != pinned ]; then
              echo "::error file=$MANIFEST_AGENT_DURABLE::has no image line for ${AGENT_DURABLE_IMAGE}"; exit 1
            fi
            manifests+=("$MANIFEST_AGENT_DURABLE")
          fi
          echo "durable=$durable" >> "$GITHUB_OUTPUT"
          if [ -f "$MANIFEST_SLICER" ]; then
            pin_slicer "$MANIFEST_SLICER"
            [ "$slicer" != pinned ] || manifests+=("$MANIFEST_SLICER")
          else
            echo "::notice::${MANIFEST_SLICER} is not in clusters yet; not pinning it"
          fi
          echo "slicer=$slicer" >> "$GITHUB_OUTPUT"
          if [ -f "$MANIFEST_PROFILE_FETCH" ]; then
            pin_profile_fetch "$MANIFEST_PROFILE_FETCH"
            [ "$profile_fetch" != pinned ] || manifests+=("$MANIFEST_PROFILE_FETCH")
          else
            echo "::notice::${MANIFEST_PROFILE_FETCH} is not in clusters yet; not pinning it"
          fi
          echo "profile_fetch=$profile_fetch" >> "$GITHUB_OUTPUT"
          if [ -f "$MANIFEST_PLAYWRIGHT_MCP" ]; then
            pin_playwright_mcp "$MANIFEST_PLAYWRIGHT_MCP"
            [ "$playwright_mcp" != pinned ] || manifests+=("$MANIFEST_PLAYWRIGHT_MCP")
          else
            echo "::notice::${MANIFEST_PLAYWRIGHT_MCP} is not in clusters yet; not pinning it"
          fi
          echo "playwright_mcp=$playwright_mcp" >> "$GITHUB_OUTPUT"
          if [ -f "$MANIFEST_FLEET" ]; then
            pin_fleet "$MANIFEST_FLEET"
            [ "$fleet" != pinned ] || manifests+=("$MANIFEST_FLEET")
          else
            echo "::notice::${MANIFEST_FLEET} is not in clusters yet; not pinning it"
          fi
          echo "fleet=$fleet" >> "$GITHUB_OUTPUT"
          camera_relay=none camera_recorder=none camera_edge=none
          for part in relay recorder edge; do
            case "$part" in
              relay)    f=$MANIFEST_CAMERA_RELAY;    img=$CAMERA_RELAY_IMAGE;    dg=${CAMERA_RELAY_DIGEST:-} ;;
              recorder) f=$MANIFEST_CAMERA_RECORDER; img=$CAMERA_RECORDER_IMAGE; dg=${CAMERA_RECORDER_DIGEST:-} ;;
              edge)     f=$MANIFEST_CAMERA_EDGE;     img=$CAMERA_EDGE_IMAGE;     dg=${CAMERA_EDGE_DIGEST:-} ;;
            esac
            if [ -f "$f" ]; then
              pin_camera "$f" "$img" "$dg" "$part"
              printf -v "camera_${part}" '%s' "$camera"
              [ "$camera" != pinned ] || manifests+=("$f")
            else
              echo "::notice::${f} is not in clusters yet; not pinning it"
            fi
          done
          {
            echo "camera_relay=$camera_relay"
            echo "camera_recorder=$camera_recorder"
            echo "camera_edge=$camera_edge"
          } >> "$GITHUB_OUTPUT"
          # The sessions' shell sandbox (#5864): every scanned file that names
          # it, each such line an `image:` or a `value:` (the agent worker's
          # SCADBUDDY_SANDBOX_IMAGE) holding the image alone. A build with no
          # sandbox image keeps the pins and warns. Sets $sandbox to `pinned`,
          # `kept` or (no file names it) `none`.
          sandbox=none
          sandbox_line="^(\s*(- )?(image|value): )${SANDBOX_IMAGE//./\\.}[:@][^[:space:]]*\$"
          while IFS= read -r f; do
            refs=$(scadbuddy_refs "$f" 2>/dev/null) || continue
            grep -qE "^${SANDBOX_IMAGE//./\\.}([:@]|\$)" <<< "$refs" || continue
            n_refs=$(grep -cE "^${SANDBOX_IMAGE//./\\.}([:@]|\$)" <<< "$refs")
            n_lines=$(grep -cE "$sandbox_line" "$f" || true)
            if [ "$n_refs" -ne "$n_lines" ]; then
              echo "::error file=$f::names ${SANDBOX_IMAGE} ${n_refs} time(s), but ${n_lines} of them on an image: or value: line of its own"; exit 1
            fi
            if [[ ! "${SANDBOX_DIGEST:-}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::warning file=$f::no ${SANDBOX_IMAGE} image was published for ${VERSION}; keeping the sandbox pins as they are"
              sandbox=kept
              continue
            fi
            # `#` as the delimiter: the pattern's alternation holds a `|`.
            sed -i -E "s#${sandbox_line}#\1${SANDBOX_IMAGE}:${VERSION}@${SANDBOX_DIGEST}#" "$f"
            sandbox=pinned
            manifests+=("$f")
          done < <(scanned)
          echo "sandbox=$sandbox" >> "$GITHUB_OUTPUT"
          vendor_dashboard "$KUSTOMIZATION"
          echo "dashboard=$dashboard" >> "$GITHUB_OUTPUT"
          if [ "$dashboard" = vendored ]; then
            # The new files as intent-to-add, so the diff below (and the PR's
            # `git add`) sees a dashboard the revision added. Only those: a
            # plain `git add -N` of the directory would also stage a removed
            # dashboard's deletion, which the diff would then no longer show.
            git ls-files -z --others --exclude-standard -- "$DASHBOARD_DIR" | xargs -0 -r git add -N --
            manifests+=("$DASHBOARD_DIR")
          fi
          # Conditional until clusters#1454 adds the worker's file: without it
          # this still deploys the API alone, as before #547.
          if [ -f "$MANIFEST_WORKER" ]; then
            pin "$MANIFEST_WORKER" scadbuddy-render
            manifests+=("$MANIFEST_WORKER")
          else
            echo "::notice::${MANIFEST_WORKER} is not in clusters yet; pinning ${MANIFEST} only"
          fi
          # Conditional until clusters adds the print worker's file (#1060).
          if [ -f "$MANIFEST_PRINT" ]; then
            pin "$MANIFEST_PRINT" scadbuddy-print
            manifests+=("$MANIFEST_PRINT")
          else
            echo "::notice::${MANIFEST_PRINT} is not in clusters yet; not pinning it"
          fi
          # Conditional until clusters adds the flow runs' worker's file (#1057).
          if [ -f "$MANIFEST_PROJECTS" ]; then
            pin "$MANIFEST_PROJECTS" scadbuddy-projects
            manifests+=("$MANIFEST_PROJECTS")
          else
            echo "::notice::${MANIFEST_PROJECTS} is not in clusters yet; not pinning it"
          fi
          # Conditional until clusters adds the storefront's file (#5284).
          if [ -f "$MANIFEST_STOREFRONT" ]; then
            pin "$MANIFEST_STOREFRONT" scadbuddy-storefront
            manifests+=("$MANIFEST_STOREFRONT")
          else
            echo "::notice::${MANIFEST_STOREFRONT} is not in clusters yet; not pinning it"
          fi
          # Conditional until clusters adds the intake worker's file (#6133).
          if [ -f "$MANIFEST_INTAKE" ]; then
            pin "$MANIFEST_INTAKE" scadbuddy-intake
            manifests+=("$MANIFEST_INTAKE")
          else
            echo "::notice::${MANIFEST_INTAKE} is not in clusters yet; not pinning it"
          fi

          # Nothing left behind (#5037): every ScadBuddy image any scanned file
          # names must now be one this run pinned. A file the list above does
          # not know (a new worker's Deployment), a sibling package this
          # workflow does not resolve, or a second copy of a pin outside its
          # file fails the deploy here, rather than staying on its old build.
          # The exceptions are a slicer pin kept on purpose (pin_slicer), a
          # profile-fetch, playwright-mcp, fleet and core pins kept the same way,
          # the camera pins kept the same way, each in its own file, and the
          # sandbox pins.
          allowed=("${IMAGE}:${VERSION}@${DIGEST}" "${AGENT_IMAGE}:${VERSION}@${AGENT_DIGEST}")
          [ "$durable" != pinned ] || allowed+=("${AGENT_DURABLE_IMAGE}:${VERSION}@${AGENT_DURABLE_DIGEST}")
          [ "$slicer" != pinned ] || allowed+=("${SLICER_IMAGE}:${VERSION}@${SLICER_DIGEST}")
          [ "$profile_fetch" != pinned ] || allowed+=("${PROFILE_FETCH_IMAGE}:${VERSION}@${PROFILE_FETCH_DIGEST}")
          [ "$playwright_mcp" != pinned ] || allowed+=("${PLAYWRIGHT_MCP_IMAGE}:${VERSION}@${PLAYWRIGHT_MCP_DIGEST}")
          [ "$fleet" != pinned ] || allowed+=("${FLEET_IMAGE}:${VERSION}@${FLEET_DIGEST}")
          [ "$core" != pinned ] || allowed+=("${CORE_IMAGE}:${VERSION}@${CORE_DIGEST}")
          [ "$camera_relay" != pinned ] || allowed+=("${CAMERA_RELAY_IMAGE}:${VERSION}@${CAMERA_RELAY_DIGEST}")
          [ "$camera_recorder" != pinned ] || allowed+=("${CAMERA_RECORDER_IMAGE}:${VERSION}@${CAMERA_RECORDER_DIGEST}")
          [ "$camera_edge" != pinned ] || allowed+=("${CAMERA_EDGE_IMAGE}:${VERSION}@${CAMERA_EDGE_DIGEST}")
          [ "$sandbox" != pinned ] || allowed+=("${SANDBOX_IMAGE}:${VERSION}@${SANDBOX_DIGEST}")
          stale=0
          while IFS= read -r f; do
            refs=$(scadbuddy_refs "$f") \
              || { echo "::error file=$f::could not parse it to check which ScadBuddy images it runs"; exit 1; }
            while IFS= read -r ref; do
              [ -n "$ref" ] || continue
              ok=false
              for a in "${allowed[@]}"; do [ "$ref" != "$a" ] || ok=true; done
              if [ "$slicer" = kept ] && [ "$f" = "$MANIFEST_SLICER" ] && [[ "$ref" == "${SLICER_IMAGE}"[:@]* ]]; then ok=true; fi
              if [ "$profile_fetch" = kept ] && [ "$f" = "$MANIFEST_PROFILE_FETCH" ] && [[ "$ref" == "${PROFILE_FETCH_IMAGE}"[:@]* ]]; then ok=true; fi
              if [ "$playwright_mcp" = kept ] && [ "$f" = "$MANIFEST_PLAYWRIGHT_MCP" ] && [[ "$ref" == "${PLAYWRIGHT_MCP_IMAGE}"[:@]* ]]; then ok=true; fi
              if [ "$fleet" = kept ] && [ "$f" = "$MANIFEST_FLEET" ] && [[ "$ref" == "${FLEET_IMAGE}"[:@]* ]]; then ok=true; fi
              if [ "$core" = kept ] && [ "$f" = "$MANIFEST" ] && [[ "$ref" == "${CORE_IMAGE}"[:@]* ]]; then ok=true; fi
              if [ "$camera_relay" = kept ] && [ "$f" = "$MANIFEST_CAMERA_RELAY" ] && [[ "$ref" == "${CAMERA_RELAY_IMAGE}"[:@]* ]]; then ok=true; fi
              if [ "$camera_recorder" = kept ] && [ "$f" = "$MANIFEST_CAMERA_RECORDER" ] && [[ "$ref" == "${CAMERA_RECORDER_IMAGE}"[:@]* ]]; then ok=true; fi
              if [ "$camera_edge" = kept ] && [ "$f" = "$MANIFEST_CAMERA_EDGE" ] && [[ "$ref" == "${CAMERA_EDGE_IMAGE}"[:@]* ]]; then ok=true; fi
              if [ "$sandbox" = kept ] && [[ "$ref" == "${SANDBOX_IMAGE}"[:@]* ]]; then ok=true; fi
              if [ "$ok" != true ]; then
                echo "::error file=$f::names ${ref}, which this deploy does not move to ${VERSION}; deploy.reusable.yml must pin this file"
                stale=1
              fi
            done <<< "$refs"
          done < <(scanned)
          [ "$stale" -eq 0 ] || exit 1

          if git diff --quiet -- "${manifests[@]}"; then
            echo "clusters already pins ${IMAGE}:${VERSION}@${DIGEST}; nothing to deploy"
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
          else
            echo "unchanged=false" >> "$GITHUB_OUTPUT"
            # Only the files this run changed: the commit and the PR name them.
            echo "files=$(git diff --name-only -- "${manifests[@]}" | paste -sd ' ' -)" >> "$GITHUB_OUTPUT"
            git --no-pager diff -- "${manifests[@]}"
          fi

      - name: Open the deploy PR and arm auto-merge
        id: pr
        if: steps.edit.outputs.unchanged == 'false'
        working-directory: clusters
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ env.CLUSTERS_REPO }}
          DIGEST: ${{ inputs.digest }}
          AGENT_DIGEST: ${{ steps.agent.outputs.digest }}
          AGENT_DURABLE_DIGEST: ${{ steps.agent-durable.outputs.digest }}
          DURABLE: ${{ steps.edit.outputs.durable }}
          SLICER_DIGEST: ${{ steps.slicer.outputs.digest }}
          SLICER: ${{ steps.edit.outputs.slicer }}
          PROFILE_FETCH_DIGEST: ${{ steps.profile-fetch.outputs.digest }}
          PROFILE_FETCH: ${{ steps.edit.outputs.profile_fetch }}
          PLAYWRIGHT_MCP_DIGEST: ${{ steps.playwright-mcp.outputs.digest }}
          PLAYWRIGHT_MCP: ${{ steps.edit.outputs.playwright_mcp }}
          FLEET_DIGEST: ${{ steps.fleet.outputs.digest }}
          FLEET: ${{ steps.edit.outputs.fleet }}
          CORE_DIGEST: ${{ steps.core.outputs.digest }}
          CORE: ${{ steps.edit.outputs.core }}
          CAMERA_RELAY_DIGEST: ${{ steps.camera.outputs.relay }}
          CAMERA_RELAY: ${{ steps.edit.outputs.camera_relay }}
          CAMERA_RECORDER_DIGEST: ${{ steps.camera.outputs.recorder }}
          CAMERA_RECORDER: ${{ steps.edit.outputs.camera_recorder }}
          CAMERA_EDGE_DIGEST: ${{ steps.camera.outputs.edge }}
          CAMERA_EDGE: ${{ steps.edit.outputs.camera_edge }}
          SANDBOX_DIGEST: ${{ steps.sandbox.outputs.digest }}
          SANDBOX: ${{ steps.edit.outputs.sandbox }}
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
          SOURCE_URL: ${{ inputs.source_url }}
          KIND: ${{ inputs.source_kind }}
          FILES: ${{ steps.edit.outputs.files }}
          WAIT_OUTCOME: ${{ steps.wait-more.outputs.outcome || steps.wait.outputs.outcome }}
          DASHBOARD: ${{ steps.edit.outputs.dashboard }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "eh-homelab-org-runners[bot]"
          git config user.email "287522375+eh-homelab-org-runners[bot]@users.noreply.github.com"

          # One deploy branch, one open deploy PR. Still open after the wait
          # step, the older one cannot land soon: close it (with a pointer)
          # and replace the branch.
          gh pr list --head "$DEPLOY_BRANCH" --state open --json number --jq '.[].number' \
            | while read -r old; do
                gh pr close "$old" --comment "Superseded by a newer ScadBuddy deploy (${VERSION}, ${RUN_URL}): this one could not land (${WAIT_OUTCOME:-unknown})."
              done
          git push origin --delete "$DEPLOY_BRANCH" 2>/dev/null || true

          read -ra manifest_files <<< "$FILES"
          listed=""
          for f in "${manifest_files[@]}"; do listed+="\`${f}\` "; done
          # The dashboards move with the image, or clusters does not vendor them.
          case "$DASHBOARD" in
            vendored) dashboard_note="deploy/grafana at ${REVISION}, vendored in \`${DASHBOARD_DIR}/\`" ;;
            kept)     dashboard_note="vendored copy kept at its \`.revision\`: ${REVISION} has no deploy/grafana" ;;
            *)        dashboard_note="not vendored in clusters (eh-homelab/clusters#3734)" ;;
          esac
          if [ "$DURABLE" = pinned ]; then
            durable_note="\`${AGENT_DURABLE_IMAGE}:${VERSION}@${AGENT_DURABLE_DIGEST}\`"
          else
            durable_note="not run in clusters yet (#1056)"
          fi
          case "$SLICER" in
            pinned) slicer_note="\`${SLICER_IMAGE}:${VERSION}@${SLICER_DIGEST}\`" ;;
            kept)   slicer_note="kept at its current pin: no image was published for ${VERSION}" ;;
            *)      slicer_note="not run in clusters yet (#3822)" ;;
          esac
          case "$PROFILE_FETCH" in
            pinned) profile_fetch_note="\`${PROFILE_FETCH_IMAGE}:${VERSION}@${PROFILE_FETCH_DIGEST}\`" ;;
            kept)   profile_fetch_note="kept at its current pin: no image was published for ${VERSION}" ;;
            *)      profile_fetch_note="not run in clusters yet (#6625)" ;;
          esac
          case "$PLAYWRIGHT_MCP" in
            pinned) playwright_mcp_note="\`${PLAYWRIGHT_MCP_IMAGE}:${VERSION}@${PLAYWRIGHT_MCP_DIGEST}\`" ;;
            kept)   playwright_mcp_note="kept at its current pin: no image was published for ${VERSION}" ;;
            *)      playwright_mcp_note="not run in clusters yet (#7027)" ;;
          esac
          case "$FLEET" in
            pinned) fleet_note="\`${FLEET_IMAGE}:${VERSION}@${FLEET_DIGEST}\`" ;;
            kept)   fleet_note="kept at its current pin: no image was published for ${VERSION}" ;;
            *)      fleet_note="not run in clusters yet (#7903)" ;;
          esac
          case "$CORE" in
            pinned) core_note="\`${CORE_IMAGE}:${VERSION}@${CORE_DIGEST}\`" ;;
            kept)   core_note="kept at its current pin: no image was published for ${VERSION}" ;;
            *)      core_note="not run in clusters yet (#7667)" ;;
          esac
          # `camera_note <state> <image> <digest>`: one part's line.
          camera_note() {
            case "$1" in
              pinned) echo "\`${2}:${VERSION}@${3}\`" ;;
              kept)   echo "kept at its current pins: no image was published for ${VERSION}" ;;
              *)      echo "not run in clusters yet (#7997)" ;;
            esac
          }
          camera_relay_note=$(camera_note "$CAMERA_RELAY" "$CAMERA_RELAY_IMAGE" "$CAMERA_RELAY_DIGEST")
          camera_recorder_note=$(camera_note "$CAMERA_RECORDER" "$CAMERA_RECORDER_IMAGE" "$CAMERA_RECORDER_DIGEST")
          camera_edge_note=$(camera_note "$CAMERA_EDGE" "$CAMERA_EDGE_IMAGE" "$CAMERA_EDGE_DIGEST")
          case "$SANDBOX" in
            pinned) sandbox_note="\`${SANDBOX_IMAGE}:${VERSION}@${SANDBOX_DIGEST}\`" ;;
            kept)   sandbox_note="kept at its current pins: no image was published for ${VERSION}" ;;
            *)      sandbox_note="not run in clusters yet (#5864)" ;;
          esac
          git checkout -B "$DEPLOY_BRANCH"
          git add -- "${manifest_files[@]}"
          git commit -q -F - <<EOF
          deploy(scadbuddy): ${VERSION}

          Pin ${IMAGE}:${VERSION}@${DIGEST}
          and ${AGENT_IMAGE}:${VERSION}@${AGENT_DIGEST}
          (agent-durable: ${durable_note}; slicer: ${slicer_note}; profile-fetch: ${profile_fetch_note}; playwright-mcp: ${playwright_mcp_note}; fleet: ${fleet_note}; core: ${core_note}; camera-relay: ${camera_relay_note}; camera-recorder: ${camera_recorder_note}; camera-edge: ${camera_edge_note}; sandbox: ${sandbox_note}; dashboard: ${dashboard_note})
          built from eh-homelab/ScadBuddy@${REVISION} (${KIND}),
          in ${manifest_files[*]}.

          Source: ${SOURCE_URL}
          Deploy run: ${RUN_URL}
          EOF
          git push -u origin "$DEPLOY_BRANCH"

          case "$KIND" in
            release) report="the release notes of ${SOURCE_URL}" ;;
            *)       report="a comment on eh-homelab/ScadBuddy@${REVISION:0:7}" ;;
          esac
          pr_url=$(gh pr create \
            --title "deploy(scadbuddy): ${VERSION}" \
            --body "$(cat <<EOF
          Automated by eh-homelab/ScadBuddy \`deploy.reusable.yml\` — [run](${RUN_URL}).

          - **Image:** \`${IMAGE}:${VERSION}@${DIGEST}\`
          - **Agent:** \`${AGENT_IMAGE}:${VERSION}@${AGENT_DIGEST}\`
          - **Agent-durable:** ${durable_note}
          - **Slicer:** ${slicer_note}
          - **Profile-fetch:** ${profile_fetch_note}
          - **Playwright MCP:** ${playwright_mcp_note}
          - **Fleet:** ${fleet_note}
          - **Core:** ${core_note}
          - **Camera relay:** ${camera_relay_note}
          - **Camera recorder:** ${camera_recorder_note}
          - **Camera edge:** ${camera_edge_note}
          - **Sandbox:** ${sandbox_note}
          - **Dashboard:** ${dashboard_note}
          - **Files:** ${listed}
          - **Built from:** ${SOURCE_URL} (\`${REVISION}\`)
          - **Path:** ${KIND}

          Auto-merge is armed; this repo's ruleset (CI Summary + claude-review) gates it. On merge ArgoCD syncs the \`scadbuddy\` Application and \`scadbuddy-verify-deploy.yml\` waits for the pod's \`/healthz\` to report revision \`${REVISION:0:7}\`, then posts the result here and on ${report}.
          EOF
          )")
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "pr_number=${pr_url##*/}" >> "$GITHUB_OUTPUT"
          # The PR exists from here on, whatever happens next: record whether
          # auto-merge armed so a caller can say "merge it by hand" rather
          # than "no PR was opened" when this fails.
          if gh pr merge "$pr_url" --auto --squash; then
            armed=true
          else
            armed=false
            echo "::error::opened ${pr_url} but could not arm auto-merge; it needs a manual merge"
          fi
          echo "armed=$armed" >> "$GITHUB_OUTPUT"
          {
            echo "### Deploy PR opened"
            echo
            if [ "$armed" = true ]; then
              echo "- ${pr_url} — auto-merge armed"
            else
              echo "- ${pr_url} — **auto-merge could not be armed; merge it by hand**"
            fi
            echo "- \`${IMAGE}:${VERSION}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$armed" = true ]

      - name: Note an unchanged pin
        if: steps.edit.outputs.unchanged == 'true'
        env:
          DIGEST: ${{ inputs.digest }}
          VERSION: ${{ inputs.version }}
        run: |
          echo "### Nothing to deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "clusters already pins \`${IMAGE}:${VERSION}@${DIGEST}\`." >> "$GITHUB_STEP_SUMMARY"
