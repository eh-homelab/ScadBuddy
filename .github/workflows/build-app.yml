---
name: Build App

# Publishes the phone app's APK (app/, #8376) as ghcr.io/eh-homelab/scadbuddy-app:
# a `FROM scratch` image (app/Dockerfile) with only /scadbuddy.apk and
# /scadbuddy.apk.sha256, tagged `sha-<7>` and `latest`. GHCR only, no GitHub
# release (the owner, 2026-11-27: "use ghcr for now"). How to get the APK out:
# app/CLAUDE.md.
#
# A workflow of its own, not a job in build-image.yml: that one builds on every
# main push but a docs-only one, and deploy-main.yml runs on it, so an app job
# there would rebuild the APK for every change and tie the deploy to it. This
# one runs only when app/ changes.
#
# The build is the one ci.yml's `android` job runs (same SDK, workload set and
# JDK; move the pins together, app/CLAUDE.md), plus a version from the run
# number, so each published APK is newer than the last. It is signed with the
# runner's debug key until a release key exists (#8376).
#
# THE PACKAGE MUST BE PUBLIC, as the other images' are. It was public from its
# first push (2026-11-27: an anonymous ghcr.io token read its tags and layer).
# Visibility is a GitHub UI step (Packages -> scadbuddy-app -> Package settings).
#
# Nothing here runs on a pull request: a PR has no GHCR write token, and ci.yml's
# `android` job builds the app on every PR that touches app/.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-app.yml"
      - "!**/CLAUDE.md"
      - "!**/AGENTS.md"
  workflow_dispatch:

# Never cancel a publish: a cancelled push leaves a half-written manifest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app/ScadBuddy
    steps:
      - uses: actions/checkout@v7
      # Pinned as ci.yml's `android` job (app/CLAUDE.md). Move them together.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.301
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'
      - name: Test
        working-directory: app/ScadBuddy.Tests
        run: dotnet test
      - name: Install the maui-android workload
        run: dotnet workload install maui-android --version 10.0.303.1
      # A re-run keeps github.run_number, so it republishes the same version over the same
      # `sha-<7>`: intended, the commit and its APK do not change.
      - name: Build (Release)
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: >-
          dotnet build -f net10.0-android -c Release
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME"
          -p:ApplicationVersion="$RUN_NUMBER" -p:ApplicationDisplayVersion="1.0.$RUN_NUMBER"
      # The image's build context: the APK and its SHA-256, and nothing else.
      - name: Stage the APK
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/apk"
          mkdir -p "$out"
          cp bin/Release/net10.0-android/com.ehhomelab.scadbuddy-Signed.apk "$out/scadbuddy.apk"
          cd "$out"
          sha256sum scadbuddy.apk > scadbuddy.apk.sha256
          cat scadbuddy.apk.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: ${{ runner.temp }}/apk/
          if-no-files-found: error
          retention-days: 7

  push:
    name: Push the APK image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: app/Dockerfile
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: ${{ runner.temp }}/apk

      - name: Check the APK's SHA-256
        working-directory: ${{ runner.temp }}/apk
        run: sha256sum -c scadbuddy.apk.sha256

      - uses: docker/setup-buildx-action@v4
        # Google's Docker Hub mirror: Docker Hub refuses some anonymous pulls (#3370).
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the tags
        id: tags
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image=ghcr.io/eh-homelab/scadbuddy-app
          tags="${image}:sha-${SHA:0:7}"
          # `latest` moves only with main: a dispatch of another ref must not move it.
          if [[ "$REF" == refs/heads/main ]]; then
            tags+=$'\n'"${image}:latest"
          fi
          {
            echo "image=${image}"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "$tags"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/apk
          file: app/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=1.0.${{ github.run_number }}
            org.opencontainers.image.title=scadbuddy-app
            org.opencontainers.image.description=The ScadBuddy Android app's APK (/scadbuddy.apk)
          provenance: false

      - name: Report the published digest
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.tags }}
          VERSION: 1.0.${{ github.run_number }}
        run: |
          set -euo pipefail
          {
            echo "### Published \`${IMAGE}\` (app ${VERSION})"
            echo
            echo "**Digest:** \`${DIGEST}\`"
            echo
            echo '```'
            printf '%s\n' "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
