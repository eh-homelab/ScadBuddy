---
name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "🚀 Features"
    labels: ["enhancement", "feature"]
  - title: "🐛 Bug Fixes"
    labels: ["bug", "fix"]
  - title: "🎨 Customizer UI"
    labels: ["frontend"]
  - title: "🧩 Render pipeline"
    labels: ["renderer"]
  - title: "🔌 API & Bambuddy"
    labels: ["api", "bambuddy"]
  - title: "📐 Models"
    labels: ["models"]
  - title: "📦 Container & CI"
    labels: ["ci", "docker", "deploy"]
  - title: "📚 Documentation"
    labels: ["documentation"]
  - title: "🔧 Dependencies"
    labels: ["dependencies"]

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
# Escapes markdown that would otherwise render as formatting in a PR title.
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels: ["major", "breaking"]
  minor:
    labels: ["minor", "enhancement", "feature"]
  patch:
    labels: ["patch", "bug", "fix", "dependencies", "documentation", "ci"]
  default: patch

# Labels applied to a PR automatically, matched against its title. Deliberately
# title-only and not `files:` — the four build branches each touch a different
# tree, so a path rule would be right today and wrong the moment a PR spans two.
autolabeler:
  - label: "ci"
    title: ['/^(ci|build|chore\(ci\))(\(.*\))?:/i']
  - label: "documentation"
    title: ['/^docs(\(.*\))?:/i']
  - label: "bug"
    title: ['/^fix(\(.*\))?:/i']
  - label: "enhancement"
    title: ['/^feat(\(.*\))?:/i']
  - label: "renderer"
    title: ["/openscad/i", "/render/i", "/3mf/i"]
  - label: "frontend"
    title: ["/customizer/i", "/\\bui\\b/i", "/react/i"]
  - label: "bambuddy"
    title: ["/bambuddy/i"]
  - label: "models"
    title: ["/keychain/i", "/\\.scad\\b/i"]

template: |
  ## Changes

  $CHANGES

  **Image:** `ghcr.io/eh-homelab/scadbuddy:$RESOLVED_VERSION`
