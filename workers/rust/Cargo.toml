[workspace]
resolver = "3"
members = ["crates/sb-slicer", "crates/sb-transfer"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
temporalio-sdk = { version = "=1.1.0", features = ["testing"] }
temporalio-client = "=1.1.0"
temporalio-common = "=1.1.0"
temporalio-macros = "=1.1.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "stream"] }
tokio-util = { version = "0.7", features = ["io"] }
sha2 = "0.10"
futures-util = "0.3"
tempfile = "3"
axum = "0.8"
