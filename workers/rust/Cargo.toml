[workspace]
resolver = "3"
members = ["crates/sb-slicer"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
temporalio-sdk = { version = "=1.1.0", features = ["testing"] }
temporalio-client = "=1.1.0"
temporalio-common = "=1.1.0"
temporalio-macros = "=1.1.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
