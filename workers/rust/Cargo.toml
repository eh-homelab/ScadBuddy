[workspace]
resolver = "3"
members = ["bins/scadbuddy-slicer", "crates/sb-slicer", "crates/sb-temporal", "crates/sb-transfer"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
temporalio-sdk = { version = "=1.1.0", features = ["testing"] }
temporalio-client = "=1.1.0"
temporalio-common = "=1.1.0"
temporalio-macros = "=1.1.0"
# `#[workflow_methods]` expands to `::temporalio_workflow` paths.
temporalio-workflow = "=1.1.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "stream"] }
tokio-util = { version = "0.7", features = ["io"] }
sha2 = "0.10"
futures-util = "0.3"
# temporalio-macros 1.1.0's `#[activities]` expands to `::futures::FutureExt`.
futures = "0.3"
tempfile = "3"
nix = { version = "0.31", features = ["fs", "process", "signal"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
axum = "0.8"
prometheus = { version = "0.14", default-features = false }
# One opentelemetry major in the tree: temporalio-sdk 1.1.0's `opentelemetry` feature
# depends on opentelemetry/opentelemetry_sdk 0.32, so the exporter and the tracing
# bridge are the releases built on 0.32.
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "grpc-tonic", "http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = { version = "0.33", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
