[project]
name = "scadbuddy"
version = "0.1.0"
description = "Self-hosted OpenSCAD customizer for Bambuddy"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lxml>=5.3",
    "networkx>=3.4",
    "numpy>=2.1",
    "pydantic>=2.9",
    "trimesh>=4.5",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scadbuddy"]

[tool.uv]
dev-dependencies = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["scadbuddy", "tests"]

[[tool.mypy.overrides]]
module = ["trimesh.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["requires_openscad: needs a real openscad binary on PATH"]
