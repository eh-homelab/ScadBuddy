[project]
name = "scadbuddy"
version = "0.1.0"
description = "Self-hosted OpenSCAD customizer for Bambuddy"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpcore>=1.0",
    "httpx>=0.28",
    "lxml>=5.3",
    "networkx>=3.4",
    "numpy>=2.1",
    "pillow>=11",
    "prometheus-client>=0.21",
    "psycopg-pool>=3.2",
    "psycopg>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",
    "trimesh>=4.5",
    "uvicorn[standard]>=0.32",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "opentelemetry-instrumentation-fastapi>=0.66b0,<0.67",
    "opentelemetry-instrumentation-psycopg>=0.66b0,<0.67",
    "temporalio[opentelemetry]>=1.33.0,<1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scadbuddy"]

[dependency-groups]
dev = [
    # The wheel with its own libpq, for developing and testing without one on the
    # system. Production uses plain `psycopg` against the image's apt-managed
    # libpq5 (Dockerfile), so libpq/OpenSSL security fixes arrive with the OS
    # packages rather than with a Python wheel release.
    "psycopg[binary]>=3.2",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.7",
    "types-lxml>=2026.2.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["scadbuddy", "tests"]
untyped_calls_exclude = ["trimesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "requires_openscad: needs a real openscad binary on PATH",
    "requires_git: needs a real git binary on PATH",
    "requires_openscad_lsp: needs a real openscad-lsp binary on PATH",
    "requires_postgres: needs SCADBUDDY_TEST_DATABASE_URL pointing at a Postgres",
    "rack_injects_errors: the test injects a non-API error into the rack pick on purpose",
    "requires_temporal: needs SCADBUDDY_TEST_TEMPORAL_ADDRESS, SCADBUDDY_TEST_TEMPORAL_DEV_SERVER (a temporal CLI) or a temporal CLI on PATH",
]
