<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vercel Security Checkpoint</title>
  </head>
  <body>
    <p>We're verifying your browser</p>
    <script>
      // "clears": the challenge passes, sets its cookie and reloads, as Vercel's does.
      if ("__CLEARS__" === "true") {
        setTimeout(() => {
          document.cookie = "_vcrcs=passed; path=/";
          location.reload();
        }, 300);
      }
    </script>
  </body>
</html>
