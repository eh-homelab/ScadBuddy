<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Filament __ID__ | 3D Filament Profiles (replica)</title>
  </head>
  <body>
    <h1>Inland PLA+ White</h1>
    <!-- 3dfp.mjs `add`: the "Add to My Spools" button. 3DFP shows it every time, and
         each click adds one more record (measured 2026-11-23, #7228). -->
    <div id="actions"></div>
    <script>
      const add = document.createElement("button");
      add.type = "button";
      add.textContent = "Add to My Spools";
      add.onclick = () => fetch("/api/spools/__ID__", { method: "POST" });
      document.getElementById("actions").appendChild(add);
    </script>
  </body>
</html>
