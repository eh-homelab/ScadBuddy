[project]
name = "scadbuddy-durable"
version = "0.1.0"
description = "ScadBuddy's Python agent parts: the payload codec, secrets and gate ports (spec 2026-10-13 §14.4)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "temporalio>=1.33.0,<1.35",
    "cryptography>=44",
    "psycopg>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scadbuddy_durable"]

[dependency-groups]
dev = [
    # The wheel with its own libpq, for tests without one on the system. The
    # image uses plain psycopg against apt's libpq5, as the backend does.
    "psycopg[binary]>=3.2",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
# #2677: uv.lock is lockfile revision 5, which uv reads from 0.6, but uv first installs
# the final Python 3.14.0 (not a 3.14 pre-release) at 0.9.0. Older uv stops here and
# names the version, rather than failing `uv run --frozen` opaquely.
required-version = ">=0.9.0"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "requires_postgres: needs SCADBUDDY_TEST_DATABASE_URL pointing at a Postgres",
]
